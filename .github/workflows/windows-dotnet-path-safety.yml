            $sdk = Split-Path -Parent $dotnet.Source
            $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
            $hook = Join-Path $source 'windows/native/ClaudeHook/Test-ClaudeHook.ps1'
