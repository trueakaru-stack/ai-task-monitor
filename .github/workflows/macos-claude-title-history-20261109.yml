          done
      - name: Run synthetic suites with IP denied
        shell: bash
        working-directory: macos
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aitm-phase-home" "$RUNNER_TEMP/aitm-phase-tmp" "$RUNNER_TEMP/aitm-phase-support"
          DEVELOPER="$(xcode-select -p)"
          PROFILE='(version 1) (allow default) (deny network*) (allow network* (local unix-socket)) (allow network-outbound (remote unix-socket))'
          cat > "$RUNNER_TEMP/aitm-phase-network-probe.py" <<'PY'
          import errno
          import os
          import socket
          import sys

          for family, destination in ((socket.AF_INET, ("127.0.0.1", 0)), (socket.AF_INET6, ("::1", 0))):
              try:
                  internet = socket.socket(family, socket.SOCK_STREAM)
              except OSError as error:
                  if error.errno not in (errno.EPERM, errno.EACCES): raise
              else:
                  try:
                      if internet.connect_ex(destination) not in (errno.EPERM, errno.EACCES): sys.exit(1)
                  finally:
                      internet.close()
          path = "/private/tmp/aitm-phase-probe-" + str(os.getpid())
          server = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          try:
              server.bind(path)
              server.listen(1)
              client.connect(path)
              peer, _ = server.accept()
              peer.close()
          finally:
              client.close()
              server.close()
              if os.path.exists(path): os.unlink(path)
          print("Network probe: IPv4/IPv6 denied; synthetic local Unix socket allowed")
          PY
          run_isolated() {
            /usr/bin/env -i "PATH=/usr/bin:/bin" "DEVELOPER_DIR=$DEVELOPER" \
              "CFFIXED_USER_HOME=$RUNNER_TEMP/aitm-phase-home" \
              "TMPDIR=$RUNNER_TEMP/aitm-phase-tmp/" \
              "AI_TASK_MONITOR_SUPPORT_DIR=$RUNNER_TEMP/aitm-phase-support" \
              "AITM_CLAUDE_TEST_EXECUTABLE=$GITHUB_WORKSPACE/macos/.build/debug/AITaskMonitor" \
              /usr/bin/sandbox-exec -p "$PROFILE" "$@"
          }
          run_isolated /usr/bin/python3 -I -S -B "$RUNNER_TEMP/aitm-phase-network-probe.py"
          cp "$GITHUB_WORKSPACE/.github/claude-audit/title-history-20261109/TaskStore-before.swift" Sources/AITaskMonitor/TaskStore.swift
          run_isolated /usr/bin/xcrun swift build --disable-sandbox
          set +e
          run_isolated /usr/bin/xcrun swift test --disable-sandbox --filter ClaudePhaseIsolationRaceTests.testAttributedPhaseAfterSnapshotPreservesNeighbor 2>&1 | /usr/bin/tee "$RUNNER_TEMP/aitm-phase-before.log"
          before_status=${PIPESTATUS[0]}
          set -e
          if [ "$before_status" -eq 0 ]; then echo 'Expected pre-fix isolation failure did not occur'; exit 1; fi
          /usr/bin/grep -F 'An attributed phase in first must not clear neighbor' "$RUNNER_TEMP/aitm-phase-before.log"
          /usr/bin/grep -Eq 'Executed 1 test, with 2 failures? \(' "$RUNNER_TEMP/aitm-phase-before.log"
          cp "$GITHUB_WORKSPACE/.github/claude-audit/title-history-20261109/TaskStore.swift" Sources/AITaskMonitor/TaskStore.swift
          cp "$GITHUB_WORKSPACE/.github/claude-audit/title-history-20261109/ClaudeTaskReader-before.swift" Sources/AITaskMonitor/ClaudeTaskReader.swift
          run_isolated /usr/bin/xcrun swift build --disable-sandbox
          set +e
          run_isolated /usr/bin/xcrun swift test --disable-sandbox --filter ClaudeTitleHistoryTests.testOldAndNewTitleSameIDBeforeFirstPollSurviveKnownLoss 2>&1 | /usr/bin/tee "$RUNNER_TEMP/aitm-title-before.log"
          before_title_status=${PIPESTATUS[0]}
          set -e
          if [ "$before_title_status" -eq 0 ]; then echo 'Expected pre-fix title loss did not occur'; exit 1; fi
          /usr/bin/grep -F 'Both observed titles must survive one read' "$RUNNER_TEMP/aitm-title-before.log"
          /usr/bin/grep -Eq 'Executed 1 test, with 1 failure \(' "$RUNNER_TEMP/aitm-title-before.log"
          cp "$GITHUB_WORKSPACE/.github/claude-audit/title-history-20261109/ClaudeTaskReader.swift" Sources/AITaskMonitor/ClaudeTaskReader.swift
          run_isolated /usr/bin/xcrun swift build --disable-sandbox
          audit_status=0
          for entry in ClaudeBackgroundIndependentTests:1 ClaudeHookPhaseBlockingTests:1 ClaudeIdentityInvalidUTF8Tests:4 ClaudeIdentityIsolationTests:2 ClaudeIntegrationSafetyTests:16 ClaudePhaseChannelTests:14 ClaudePhaseIndependentCounterexamples:7 ClaudePhaseIntegrationTests:30 ClaudePhaseUnresolvedTests:2 ClaudePlanOrderingCandidateTests:14 ClaudeReaderIndependentTests:13 ClaudeReaderSafetyCandidateTests:6 ClaudeSourceLossRecoveryTests:17 ClaudeRecoveryFix5Tests:6 ParserTests:23 ClaudeHookLockTests:1 ClaudeLoopChannelTests:9 ClaudeLoopDetectionTests:7 ClaudeRetentionTests:3 ClaudePlanLabelTests:2 ClaudePhaseIdentityIsolationIndependentTests:3 ClaudeIntegrationPreservationIndependentTests:4 ClaudeRecoveryBoundaryIndependentTests:3 ClaudeCombinedRecoveryTests:8 ClaudePhaseIsolationRaceTests:4 ClaudeTitleHistoryTests:5 CodexColdCompressedIndependentTests:8 CodexCompressedBoundaryIndependentTests:4 CodexLongTurnTests:3 CodexMultipleColdIndependentTests:5 CodexRevertSafetyTests:13 CodexSiblingDirectoryIndependentTests:1 CodexSourceStalePlanTests:1; do
            suite="${entry%:*}"
            count="${entry#*:}"
            log="$RUNNER_TEMP/aitm-phase-$suite.log"
            if ! run_isolated /usr/bin/xcrun swift test --disable-sandbox --filter "$suite" 2>&1 | /usr/bin/tee "$log"; then
              audit_status=1
            fi
            if ! /usr/bin/grep -Eq "Executed $count tests?, with 0 failures" "$log"; then
              printf '%s\n' "Missing successful expected test count: $suite"
              audit_status=1
            fi
          done
          if ! run_isolated /usr/bin/xcrun swift build --disable-sandbox --configuration release; then
            audit_status=1
          fi
          exit "$audit_status"

