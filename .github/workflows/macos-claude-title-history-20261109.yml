name: macOS Claude title history synthetic tests

on:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-claude-title-history-20261109.yml"
      - ".github/claude-audit/title-history-20261109/**"

permissions:
  contents: read

jobs:
  candidate-tests:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[claude-title-history]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Check disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
