            '2c86c1eb3e3880069e9617d2272563235013540d5196a538e35ce5c5c3bf8152' ClaudePhaseIdentityIsolationIndependentTests.swift \
            'af304db47e7f9eec041a84c1f61b19e54690e44d846ef93028266e2cfc6d7e30' ClaudeIntegrationPreservationIndependentTests.swift \
            '83df2ddb469e3824364a35778fd9cc13247c12762e01d057210fe641d8222677' ClaudeRecoveryBoundaryIndependentTests.swift \
            '0e729bdb6e31f1e8d089426c0797bfceccd7ac96413e1e962fd1ddde9c0be659' ClaudeCombinedRecoveryTests.swift \
