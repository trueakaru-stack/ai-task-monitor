            '861f30835cc64866759eb6f4f24f6df73e63d1b753d1aa6e1fed0701c9e4af68' ClaudeLoopChannel.swift \
            'cb2a3d3ed31028b5b258d68c2507bbde08fda990d0668f1956ec94eb86f8f8eb' ClaudeLoopDetection.swift \
            '8411b0ebd702909c6581492816a0e3628328ea76dbef843a080fadd4c7c47333' ClaudePhaseEvidence.swift \
            '0cd9ff3538d0c768511ba1d5bec85470f8d35358e50717726c4178443a20b19a' ClaudeRetention.swift \
            '84f6d6b61d004372ebe96463f95e0836044956c59c7ad3d46d56d5890da1d030' ClaudeTaskReader.swift \
            'b3ef6fd6af663ee4a8c1a02541980fff70faa269bb48ed5d41f12bde00a6f173' TaskStore.swift \
            '436eb6e670bbd8b878d00db475e3416029e065aa420d0f0d7669f35708c0d289' TaskCardView.swift \
            '8f7a63f9b5d957a9ff9db01fe179f0eba9ec8198a9d3769c3b5013eec336efcc' ClaudeBackgroundIndependentTests.swift \
            '9a359fcefcefd9b46a42f7b888c7f5a6ea96e39abb797e2049302891557fc674' ClaudeHookPhaseBlockingTests.swift \
            '84411c695c4e77e8370caf78d13bffbddde5bd659f1e6c8ac75dd95faa2274b4' ClaudeIdentityInvalidUTF8Tests.swift \
            '9831d53b7cf8b722319e780462f738480b6f2971d940c01c9d2505c9338ee830' ClaudeIdentityIsolationTests.swift \
            '0488334385026450adbc847309528a666f3de0598d1c6439ece00310be293088' ClaudeIntegrationSafetyTests.swift \
