name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [macos]
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"
  pull_request:
    branches: [macos]
    paths:
      - "macos/**"
      - ".github/workflows/macos-build.yml"

permissions:
  contents: read

jobs:
  feedback-visual:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tests-only]') && contains(github.event.head_commit.message, '[feedback-visual]') }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned baseline for the same diagnostic
        uses: actions/checkout@v4
        with:
          ref: ab4de7012b2f452005b918cc73130d4a9a489e9e
          path: baseline-feedback
      - name: Test original copy button on disposable runner
        working-directory: baseline-feedback/macos
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          cp "$GITHUB_WORKSPACE/macos/Tests/AITaskMonitorTests/FeedbackAlignmentTests.swift" Tests/AITaskMonitorTests/
          export AITM_FEEDBACK_SYNTHETIC_ROOT="$(mktemp -d "$RUNNER_TEMP/aitm-feedback-XXXXXXXX")"
          export AITM_FEEDBACK_SYNTHETIC_CI=1
          export AITM_FEEDBACK_BASELINE=1
          swift test --filter FeedbackAlignmentTests
      - name: Test feedback copy button on disposable runner
        if: ${{ !cancelled() }}
        working-directory: macos
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          export AITM_FEEDBACK_SYNTHETIC_ROOT="$(mktemp -d "$RUNNER_TEMP/aitm-feedback-XXXXXXXX")"
          export AITM_FEEDBACK_SYNTHETIC_CI=1
          swift test --filter FeedbackAlignmentTests
      - name: Render synthetic settings previews
        if: ${{ !cancelled() }}
        working-directory: macos
        run: swift run AITaskMonitor --render-previews "$RUNNER_TEMP/aitm-feedback-previews"
      - name: Upload feedback previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-feedback-previews
          path: ${{ runner.temp }}/aitm-feedback-previews/settings-end-*.png
          if-no-files-found: error
          retention-days: 7

  tests-only:
    if: ${{ contains(github.event.head_commit.message, '[tests-only]') }}
    runs-on: ${{ contains(github.event.head_commit.message, '[macos26]') && 'macos-26' || 'macos-15' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        if: ${{ !contains(github.event.head_commit.message, '[macos26]') }}
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare isolated DeepSeek test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/aitm-dsh-upstream" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.5 pnpm@11.25.0
          echo "AITM_DSH_ANCHOR=$(node -p 'require("node:fs").realpathSync(process.argv[1])' "$RUNNER_TEMP/aitm-dsh-upstream/node_modules/@deepseek-ai/dsh/package.json")" >> "$GITHUB_ENV"
          echo "AITM_PNPM_SCRIPT=$(node -p 'require("node:fs").realpathSync(process.argv[1])' "$RUNNER_TEMP/aitm-dsh-upstream/node_modules/pnpm/bin/pnpm.mjs")" >> "$GITHUB_ENV"
          echo "AITM_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: Test
        working-directory: macos
        run: |
          swift build
          AITM_CLAUDE_TEST_EXECUTABLE="$(swift build --show-bin-path)/AITaskMonitor" swift test
      - name: Test isolated agent integrations
        working-directory: macos
        run: |
          node integration-tests/Test-ExternalProviderEvents.mjs
          node integration-tests/Test-ExternalProviderObservers.mjs
          node integration-tests/Test-ProviderBundles.mjs
          node integration-tests/Test-DeepSeekCordisRuntime.mjs "$RUNNER_TEMP/aitm-dsh-upstream/node_modules"
          node integration-tests/Test-DeepSeekIntegration.mjs "$AITM_DSH_ANCHOR" "$AITM_PNPM_SCRIPT"
          python3 -B integration-tests/test_external_provider_hooks.py
          python3 -B integration-tests/test_provider_bundle.py
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 \
            "https://codeload.github.com/NousResearch/hermes-agent/tar.gz/b200f5bc60e31588ba2cb60e288029c4a54ba5fa" \
            --output "$RUNNER_TEMP/aitm-hermes-upstream.tar.gz"
          python3 -B integration-tests/Extract-HermesFixture.py "$RUNNER_TEMP/aitm-hermes-upstream.tar.gz" "$RUNNER_TEMP/aitm-hermes-upstream"
          python3 -m venv "$RUNNER_TEMP/aitm-hermes-pm-python"
          "$RUNNER_TEMP/aitm-hermes-pm-python/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: 'ruamel.yaml==0.18.16' 'packaging==26.0' 'python-dotenv==1.2.4'
          "$RUNNER_TEMP/aitm-hermes-pm-python/bin/python" -I -S -B integration-tests/Test-HermesSetup.py integrations "$RUNNER_TEMP/aitm-hermes-upstream"
          "$RUNNER_TEMP/aitm-hermes-pm-python/bin/python" -I -B integration-tests/Test-HermesManager.py integrations "$RUNNER_TEMP/aitm-hermes-upstream"
          python3 -I -S -B integration-tests/Test-HermesPackaging.py
          AITM_HERMES_PYTHON="$RUNNER_TEMP/aitm-hermes-pm-python/bin/python" AITM_HERMES_SOURCE="$RUNNER_TEMP/aitm-hermes-upstream" swift test --filter HermesIntegrationTests/testPinnedBridgePreparesAnIsolatedProfileWithoutChangingSettings
          python3 -B integration-tests/Test-HermesUpstreamDispatch.py "$RUNNER_TEMP/aitm-hermes-upstream"
          python3 -B integration-tests/Test-HermesLiveness.py "$RUNNER_TEMP/aitm-hermes-upstream/hermes_cli/active_sessions.py"
          "$RUNNER_TEMP/aitm-hermes-pm-python/bin/python" -B integration-tests/Test-HermesPublication.py "$RUNNER_TEMP/aitm-hermes-upstream"
          npm pack @moonshot-ai/kimi-code@2.5.0 --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/aitm-kimi-package.json"
          tar -xOf "$RUNNER_TEMP/moonshot-ai-kimi-code-2.5.0.tgz" package/dist/main.mjs > "$RUNNER_TEMP/aitm-kimi-upstream.mjs"
          node integration-tests/Test-KimiIntegration.mjs
          node integration-tests/Test-KimiObserver.mjs
          node integration-tests/Test-KimiUpstreamHook.mjs "$RUNNER_TEMP/aitm-kimi-upstream.mjs"
          node integration-tests/Test-KimiUpstreamContract.mjs "$RUNNER_TEMP/aitm-kimi-upstream.mjs"
          node integration-tests/Test-KimiUpstreamInstall.mjs "$RUNNER_TEMP/aitm-kimi-upstream.mjs"
          npm install --prefix "$RUNNER_TEMP/aitm-kimi-full" --ignore-scripts --omit=optional --no-audit --no-fund "$RUNNER_TEMP/moonshot-ai-kimi-code-2.5.0.tgz"
          node integration-tests/Test-KimiApprovalWeb.mjs "$RUNNER_TEMP/aitm-kimi-full"
      - name: Render native source-status previews
        working-directory: macos
        run: swift run AITaskMonitor --render-previews "$RUNNER_TEMP/ai-task-monitor-previews"
      - name: Upload source-status previews
        uses: actions/upload-artifact@v4
        with:
          name: macos-source-previews
          path: ${{ runner.temp }}/ai-task-monitor-previews/*.png
          if-no-files-found: error
          retention-days: 7

  build:
    if: ${{ !contains(github.event.head_commit.message, '[tests-only]') }}
    runs-on: ${{ contains(github.event.head_commit.message, '[macos26]') && 'macos-26' || 'macos-15' }}
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: ${{ contains(github.event.head_commit.message, '[macos26]') && '/Applications/Xcode.app/Contents/Developer' || '/Applications/Xcode_16.1.app/Contents/Developer' }}
    steps:
      - name: Checkout exact commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test -d "$DEVELOPER_DIR"
          test -z "$(ls -A "$GITHUB_WORKSPACE")"
          mkdir -p "$RUNNER_TEMP/aitm-empty-template" "$RUNNER_TEMP/aitm-empty-hooks"
          git -C "$GITHUB_WORKSPACE" -c init.templateDir="$RUNNER_TEMP/aitm-empty-template" \
              -c core.hooksPath="$RUNNER_TEMP/aitm-empty-hooks" init
          if ! git -C "$GITHUB_WORKSPACE" -c credential.helper= \
              -c core.hooksPath="$RUNNER_TEMP/aitm-empty-hooks" fetch --no-tags --depth=1 \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"; then
            git -C "$GITHUB_WORKSPACE" -c credential.helper= \
                -c core.hooksPath="$RUNNER_TEMP/aitm-empty-hooks" fetch --no-tags --depth=1 \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          fi
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" -c core.hooksPath="$RUNNER_TEMP/aitm-empty-hooks" checkout --detach FETCH_HEAD
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Test
        working-directory: macos
        run: bash ./scripts/run-swift-tests.sh
      - name: Build universal application
        working-directory: macos
        run: ./scripts/build-app.sh
      - name: Smoke test bundle and hook
        working-directory: macos
        run: ./scripts/smoke-test.sh "dist/AI Task Monitor.app"
      - name: Render native verification screenshots
        working-directory: macos
        run: |
          mkdir -p docs/verification
          "dist/AI Task Monitor.app/Contents/MacOS/AITaskMonitor" --render-previews "$PWD/docs/verification"
      - name: Create disk image
        working-directory: macos
        run: ./scripts/create-dmg.sh
      - name: Read release version
        id: release_version
        run: echo "value=$(plutil -extract AITaskMonitorReleaseVersion raw -o - macos/Info.plist)" >> "$GITHUB_OUTPUT"
      - name: Upload macOS alpha
        uses: actions/upload-artifact@v4
        with:
          name: AITaskMonitor-macOS-${{ steps.release_version.outputs.value }}
          path: |
            macos/dist/AITaskMonitor-macOS-${{ steps.release_version.outputs.value }}.dmg
            macos/dist/SHA256SUMS-macOS.txt
            macos/docs/verification/*.png
          if-no-files-found: error
          retention-days: 30
