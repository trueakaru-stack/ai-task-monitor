name: Synthetic installed payload removal
on:
  push:
    branches: ['codex/windows-uninstall-ci-20261116']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-contained-preview:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Publish and inspect isolated self-contained preview
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:RUNNER_TEMP ('aitm-selfcontained-source-' + [guid]::NewGuid().ToString('N'))
          $source = Join-Path $sourceRoot 'source'
          $template = Join-Path $sourceRoot 'template'
          $hooks = Join-Path $sourceRoot 'hooks'
          New-Item -ItemType Directory -Path $source, $template, $hooks | Out-Null
          git -c credential.helper= -c core.hooksPath="$hooks" -c init.defaultBranch=fixture init --quiet --template="$template" "$source"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize source checkout.' }
          git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" fetch --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch exact test revision.' }
          git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select test revision.' }
          & python -B (Join-Path $source 'windows/tests/Test-DotnetPathSafety.py')
          if ($LASTEXITCODE -ne 0) { throw 'PATH safety guard failed.' }
          & (Join-Path $source 'windows/native/SelfContainedExperiment/Test-SelfContainedPreview.ps1')
      - name: Preserve synthetic inventory and preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-self-contained-inventory
          path: |
            ${{ runner.temp }}/aitm-selfcontained-*/selfcontained-preview.png
            ${{ runner.temp }}/aitm-selfcontained-*/selfcontained-inventory.json
          if-no-files-found: ignore
          retention-days: 7
