name: macOS isolated package audit

on:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-package-audit-20261109.yml"
      - ".github/macos-package-audit-20261109/**"

permissions:
  contents: read

jobs:
  candidate-package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/macos' && contains(github.event.head_commit.message, '[macos-package-audit-20261109]')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          for tool in /bin/bash /usr/bin/env /usr/bin/git /usr/bin/tar /usr/bin/python3 /usr/bin/shasum /usr/bin/xcrun /usr/bin/sandbox-exec; do
            test -x "$tool"
            /usr/bin/shasum -a 256 "$tool"
          done
      - name: Check out exact public source without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'trueakaru-stack/ai-task-monitor'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -d "$GITHUB_WORKSPACE"
          test -z "$(ls -A "$GITHUB_WORKSPACE")"
          run_git() {
            /usr/bin/env -i 'PATH=/usr/bin:/bin' 'GIT_CONFIG_NOSYSTEM=1' \
              'GIT_CONFIG_GLOBAL=/dev/null' 'GIT_TERMINAL_PROMPT=0' \
              /usr/bin/git -c credential.helper= -c core.autocrlf=false "$@"
          }
          run_git init "$GITHUB_WORKSPACE"
          run_git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 https://github.com/trueakaru-stack/ai-task-monitor.git "$GITHUB_SHA"
          for commit in 8ebef09327339711bc5a4519c62eb565203b31d4 bbef0654fdb2789c62c8d8511576f05b75a289ca; do
            run_git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 https://github.com/trueakaru-stack/ai-task-monitor.git "$commit"
          done
          run_git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(run_git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Select and record Xcode
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ matrix.runner }}" = macos-15; then
            developer=/Applications/Xcode_16.1.app/Contents/Developer
          else
            developer="$(/usr/bin/xcode-select -p)"
          fi
          test -d "$developer"
          printf '%s\n' "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
          /usr/bin/env -i 'PATH=/usr/bin:/bin' "DEVELOPER_DIR=$developer" /usr/bin/xcodebuild -version
          executable="$(/usr/bin/env -i 'PATH=/usr/bin:/bin' "DEVELOPER_DIR=$developer" /usr/bin/xcrun --find swift)"
          test -x "$executable"
          /usr/bin/shasum -a 256 "$executable"
      - name: Build and inspect isolated test app and disk image
        id: package_checks
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/macos-package-audit-20261109/build-and-inspect.sh"
      - name: Upload synthetic package evidence
        if: ${{ success() && steps.package_checks.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-package-audit-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/aitm-package-output/AITaskMonitor-macOS-0.3.8-ci.1.dmg
            ${{ runner.temp }}/aitm-package-output/SHA256SUMS-macOS.txt
            ${{ runner.temp }}/aitm-package-output/candidate-test-version.sha256
            ${{ runner.temp }}/aitm-package-output/bundle-resources.sha256
            ${{ runner.temp }}/aitm-package-output/NOT-A-RELEASE.txt
          if-no-files-found: error
          retention-days: 7

  old-selector:
    if: github.event_name == 'push' && github.ref == 'refs/heads/macos' && contains(github.event.head_commit.message, '[macos-package-audit-20261109]')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          for tool in /bin/bash /usr/bin/env /usr/bin/git /usr/bin/tar /usr/bin/python3 /usr/bin/shasum /usr/bin/xcrun /usr/bin/sandbox-exec; do
            test -x "$tool"
            /usr/bin/shasum -a 256 "$tool"
          done
      - name: Check out exact public source without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'trueakaru-stack/ai-task-monitor'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -d "$GITHUB_WORKSPACE"
          test -z "$(ls -A "$GITHUB_WORKSPACE")"
          run_git() {
            /usr/bin/env -i 'PATH=/usr/bin:/bin' 'GIT_CONFIG_NOSYSTEM=1' \
              'GIT_CONFIG_GLOBAL=/dev/null' 'GIT_TERMINAL_PROMPT=0' \
              /usr/bin/git -c credential.helper= -c core.autocrlf=false "$@"
          }
          run_git init "$GITHUB_WORKSPACE"
          run_git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 https://github.com/trueakaru-stack/ai-task-monitor.git "$GITHUB_SHA"
          for commit in c034eef660922c9a06ee601e6ab9f8eac22b7889; do
            run_git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 https://github.com/trueakaru-stack/ai-task-monitor.git "$commit"
          done
          run_git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(run_git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Select and record Xcode
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ matrix.runner }}" = macos-15; then
            developer=/Applications/Xcode_16.1.app/Contents/Developer
          else
            developer="$(/usr/bin/xcode-select -p)"
          fi
          test -d "$developer"
          printf '%s\n' "DEVELOPER_DIR=$developer" >> "$GITHUB_ENV"
          /usr/bin/env -i 'PATH=/usr/bin:/bin' "DEVELOPER_DIR=$developer" /usr/bin/xcodebuild -version
          executable="$(/usr/bin/env -i 'PATH=/usr/bin:/bin' "DEVELOPER_DIR=$developer" /usr/bin/xcrun --find swift)"
          test -x "$executable"
          /usr/bin/shasum -a 256 "$executable"
      - name: Test old release selector with offline synthetic metadata
        id: selector_checks
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/macos-package-audit-20261109/legacy-update-check.sh"
      - name: Upload selector evidence
        if: ${{ success() && steps.selector_checks.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-old-selector-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/aitm-old-selector-output/selector.log
            ${{ runner.temp }}/aitm-old-selector-output/SCOPE.txt
          if-no-files-found: error
          retention-days: 7
