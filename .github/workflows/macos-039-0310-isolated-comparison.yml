          test "$(/usr/bin/plutil -extract CFBundleVersion raw -o - "$task_app/Contents/Info.plist")" = "14"
          cat > "$task_root/observer.m" <<'OBJC'
          #import <AppKit/AppKit.h>
          #import <ApplicationServices/ApplicationServices.h>
          #include <signal.h>
          #include <stdlib.h>
          #include <unistd.h>
          static BOOL axFind(AXUIElementRef node, NSString *wanted, BOOL buttonOnly, CGRect *frame, int depth) {
              if (!node || depth > 30) return NO;
              CFTypeRef role = NULL, title = NULL, description = NULL, value = NULL;
              AXUIElementCopyAttributeValue(node, kAXRoleAttribute, &role);
              AXUIElementCopyAttributeValue(node, kAXTitleAttribute, &title);
              AXUIElementCopyAttributeValue(node, kAXDescriptionAttribute, &description);
              AXUIElementCopyAttributeValue(node, kAXValueAttribute, &value);
              BOOL roleOK = !buttonOnly || (role && CFGetTypeID(role) == CFStringGetTypeID() && CFEqual(role, kAXButtonRole));
              BOOL match = NO;
              CFTypeRef candidates[] = { title, description, value };
              for (int i=0; i<3; i++) {
                  if (candidates[i] && CFGetTypeID(candidates[i]) == CFStringGetTypeID() &&
                      [(__bridge NSString *)candidates[i] isEqualToString:wanted]) { match = YES; break; }
              }
              if (role) CFRelease(role);
              if (title) CFRelease(title);
              if (description) CFRelease(description);
              if (value) CFRelease(value);
              if (match && roleOK) {
                  if (!frame) return YES;
                  CFTypeRef position = NULL, size = NULL;
                  CGPoint p = CGPointZero;
                  CGSize z = CGSizeZero;
                  AXError ep = AXUIElementCopyAttributeValue(node, kAXPositionAttribute, &position);
                  AXError es = AXUIElementCopyAttributeValue(node, kAXSizeAttribute, &size);
                  BOOL valid = ep == kAXErrorSuccess && es == kAXErrorSuccess && position && size &&
                      CFGetTypeID(position) == AXValueGetTypeID() && CFGetTypeID(size) == AXValueGetTypeID() &&
