name: Verify exact macOS 0.3.10 installed application
on:
  push:
    branches: [codex/macos-0310-actual-dmg-check-20261118]
    paths: [".github/workflows/macos-0310-actual-dmg-check.yml"]
permissions:
  contents: read
  actions: read
jobs:
  exact-dmg-gui:
    if: ${{ github.repository == 'trueakaru-stack/ai-task-monitor' }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Prepare disposable synthetic environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          echo "Verified runner architecture: $RUNNER_ARCH ($(/usr/bin/uname -m))"
          case "$RUNNER_ARCH:$(/usr/bin/uname -m)" in X64:x86_64|ARM64:arm64) ;; *) echo 'Unexpected runner architecture'; exit 1;; esac
          test "$RUNNER_OS" = macOS
          test "$GITHUB_REPOSITORY" = trueakaru-stack/ai-task-monitor
          test "$RUNNER_TEMP" = /Users/runner/work/_temp
          task_root="$(mktemp -d "$RUNNER_TEMP/aitm-gui-0310.XXXXXXXX")"
          task_marker="$(mktemp "$RUNNER_TEMP/aitm-denied-0310.XXXXXXXX")"
          printf 'synthetic profile marker\n' > "$task_marker"
          mkdir -p "$task_root"/{input,mount,temp,synthetic-home,out,previews,plan-previews,Applications}
          printf 'AITM_TEST_TASK_ROOT=%s\nAITM_TEST_DENIED_FILE=%s\n' "$task_root" "$task_marker" >> "$GITHUB_ENV"
      - name: Download the exact completed candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: "14428481166"
          run-id: "44304568821"
          github-token: ${{ github.token }}
          path: ${{ env.AITM_TEST_TASK_ROOT }}/input
      - name: Validate profile isolation and run the actual application window
        shell: bash
        run: |
          set -euo pipefail
          task_root="$AITM_TEST_TASK_ROOT"
          case "$task_root" in /Users/runner/work/_temp/aitm-gui-0310.*) ;; *) echo 'Unexpected temporary root'; exit 1;; esac
          cd "$task_root"
          image_count="$(find input -type f -name 'AITaskMonitor-macOS-0.3.10.dmg' -print | wc -l | tr -d ' ')"
          test "$image_count" = 1
          image_path="$(find input -type f -name 'AITaskMonitor-macOS-0.3.10.dmg' -print)"
          expected=d711d8e32f62f76347cbd6fb8bc9037f27b6b53bc4394565a735626fea567263
          test "$(shasum -a 256 "$image_path" | cut -d' ' -f1)" = "$expected"
          echo "Verified exact final DMG: $expected"
          test "$(find input -type f | wc -l | tr -d ' ')" = 3
          test "$(find input -type f -name SOURCE-REVISION.txt | wc -l | tr -d ' ')" = 1
          test "$(find input -type f -name SHA256SUMS-macOS.txt | wc -l | tr -d ' ')" = 1
          revision_path="$(find input -type f -name SOURCE-REVISION.txt -print)"
          checksum_path="$(find input -type f -name SHA256SUMS-macOS.txt -print)"
          test "$(tr -d '\r\n' < "$revision_path")" = 6f9e11914064052c0bbe5fbc30bfa6c0a23bc860
          test "$(tr -d '\r\n' < "$checksum_path")" = "$expected  AITaskMonitor-macOS-0.3.10.dmg"
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin "TMPDIR=$task_root/temp" \
            "CFFIXED_USER_HOME=$task_root/synthetic-home" /usr/bin/hdiutil verify "$image_path" > "$task_root/out/dmg-verify.log"
          echo "Verified artifact revision, checksum manifest and disk-image integrity."
          cat > "$task_root/graphics.sb" <<'PROFILE'
          (version 1)
          (allow default)
          (deny file-read* (subpath "/Users") (subpath "/private/var/folders"))
          (allow file-read-metadata (literal "/Users") (literal "/Users/runner") (literal "/Users/runner/work") (literal "/Users/runner/work/_temp"))
          (allow file-read* (subpath (param "TASK_ROOT")))
          (deny file-write*)
          (allow file-write* (subpath (param "TASK_ROOT")))
          (allow file-write-data (literal "/dev/null") (literal "/dev/tty"))
          (deny network*)
          (allow mach-lookup)
          (deny mach-lookup (global-name "com.apple.cfprefsd.agent") (global-name "com.apple.cfprefsd.daemon") (global-name "com.apple.bsd.dirhelper"))
          PROFILE
          cat > "$task_root/run-graphics" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          exec /usr/bin/env -i "PATH=/usr/bin:/bin:/usr/sbin:/sbin" \
            "TMPDIR=$AITM_TEST_TASK_ROOT/temp" "CFFIXED_USER_HOME=$AITM_TEST_TASK_ROOT/synthetic-home" \
            "LANG=en_US.UTF-8" \
            /usr/bin/sandbox-exec -D "TASK_ROOT=$AITM_TEST_TASK_ROOT" -f "$AITM_TEST_TASK_ROOT/graphics.sb" "$@"
          SCRIPT
          chmod 700 "$task_root/run-graphics"
          task_run="$task_root/run-graphics"
          "$task_run" /bin/bash -c 'test -z "${HOME+x}" && test -z "${CODEX_HOME+x}"'
          ln -s "$AITM_TEST_DENIED_FILE" "$task_root/profile-link"
          for marker in "$AITM_TEST_DENIED_FILE" "$task_root/profile-link"; do
            if "$task_run" /bin/cat "$marker" > /dev/null 2>&1; then echo 'Profile read unexpectedly allowed'; exit 1; fi
            if "$task_run" /usr/bin/touch "$marker" > /dev/null 2>&1; then echo 'Profile write unexpectedly allowed'; exit 1; fi
          done
          cat > "$task_root/safety.c" <<'C'
          #include <mach/mach.h>
          #include <servers/bootstrap.h>
          #include <sys/socket.h>
          #include <netinet/in.h>
          #include <arpa/inet.h>
          #include <errno.h>
          #include <stdio.h>
          #include <unistd.h>
          int main(void) {
            const char *blocked[] = {"com.apple.cfprefsd.agent", "com.apple.cfprefsd.daemon", "com.apple.bsd.dirhelper"};
            for (unsigned i = 0; i < sizeof(blocked)/sizeof(blocked[0]); i++) {
              mach_port_t port = MACH_PORT_NULL;
              kern_return_t r = bootstrap_look_up(bootstrap_port, blocked[i], &port);
              if (r == KERN_SUCCESS) mach_port_deallocate(mach_task_self(), port);
              if (r != BOOTSTRAP_NOT_PRIVILEGED) { fprintf(stderr, "Profile service block not verified: %d\n", r); return 1; }
            }
            int fd = socket(AF_INET, SOCK_STREAM, 0);
            if (fd < 0) {
              if (errno != EPERM && errno != EACCES) return 2;
            } else {
              struct sockaddr_in addr = {0};
              addr.sin_len = sizeof(addr);
              addr.sin_family = AF_INET;
              addr.sin_port = htons(9);
              addr.sin_addr.s_addr = htonl(INADDR_LOOPBACK);
              errno = 0;
              if (connect(fd, (struct sockaddr *)&addr, sizeof(addr)) == 0 || (errno != EPERM && errno != EACCES)) {
                close(fd); fprintf(stderr, "Loopback network was not provably denied.\n"); return 3;
              }
              close(fd);
            }
            puts("Profile services and loopback network are denied");
            return 0;
          }
          C
          cat > "$task_root/window.c" <<'C'
          #include <CoreGraphics/CoreGraphics.h>
          #include <CoreFoundation/CoreFoundation.h>
          #include <stdio.h>
          #include <stdlib.h>
          int main(int argc, char **argv) {
            if (argc != 2) return 2;
            int target = atoi(argv[1]), found = 0;
            CFArrayRef windows = CGWindowListCopyWindowInfo(kCGWindowListOptionOnScreenOnly | kCGWindowListExcludeDesktopElements, kCGNullWindowID);
            if (!windows) { fputs("Window list unavailable\n", stderr); return 3; }
            for (CFIndex i = 0; i < CFArrayGetCount(windows); i++) {
              CFDictionaryRef row = CFArrayGetValueAtIndex(windows, i);
              CFNumberRef owner = CFDictionaryGetValue(row, kCGWindowOwnerPID), level = CFDictionaryGetValue(row, kCGWindowLayer);
              CFDictionaryRef bounds = CFDictionaryGetValue(row, kCGWindowBounds);
              int ownerID = -1, layer = -1;
              CGRect rect = CGRectZero;
              if (!owner || !level || !bounds) continue;
              if (!CFNumberGetValue(owner, kCFNumberIntType, &ownerID) || !CFNumberGetValue(level, kCFNumberIntType, &layer)) continue;
              if (!CGRectMakeWithDictionaryRepresentation(bounds, &rect)) continue;
              if (ownerID == target && (layer == CGWindowLevelForKey(kCGNormalWindowLevelKey) || layer == CGWindowLevelForKey(kCGFloatingWindowLevelKey)) && rect.size.width >= 200 && rect.size.height >= 100) {
                printf("Visible application window: %.0f x %.0f points at system level %d (%s)\n", rect.size.width, rect.size.height, layer, layer == CGWindowLevelForKey(kCGFloatingWindowLevelKey) ? "floating" : "normal");
                found++;
              }
            }
            CFRelease(windows);
            return found ? 0 : 1;
          }
          C
          /usr/bin/clang -Wno-deprecated-declarations "$task_root/safety.c" -o "$task_root/safety"
          /usr/bin/clang -Wno-deprecated-declarations "$task_root/window.c" -framework CoreGraphics -framework CoreFoundation -o "$task_root/window"
          "$task_run" "$task_root/safety"
          task_pid=""
          task_helper_pid=""
          cleanup() {
            if test -n "$task_helper_pid" && kill -0 "$task_helper_pid" 2>/dev/null; then
              kill -TERM "$task_helper_pid" 2>/dev/null || true
              wait "$task_helper_pid" 2>/dev/null || true
            fi
            if test -n "$task_pid" && kill -0 "$task_pid" 2>/dev/null; then
              kill -TERM "$task_pid" 2>/dev/null || true
              wait "$task_pid" 2>/dev/null || true
            fi
            if /sbin/mount | /usr/bin/grep -F " on $task_root/mount (" > /dev/null; then
              /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin "TMPDIR=$task_root/temp" \
                "CFFIXED_USER_HOME=$task_root/synthetic-home" /usr/bin/hdiutil detach "$task_root/mount" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          cat > "$task_root/window-control.m" <<'OBJC'
          #import <AppKit/AppKit.h>
          int main(void) {
            @autoreleasepool {
              NSApplication *application = [NSApplication sharedApplication];
              [application setActivationPolicy:NSApplicationActivationPolicyRegular];
              NSWindow *normal = [[NSWindow alloc] initWithContentRect:NSMakeRect(40,40,300,220)
                styleMask:NSWindowStyleMaskTitled backing:NSBackingStoreBuffered defer:NO];
              NSWindow *floating = [[NSWindow alloc] initWithContentRect:NSMakeRect(400,350,300,220)
                styleMask:NSWindowStyleMaskTitled backing:NSBackingStoreBuffered defer:NO];
              [normal setReleasedWhenClosed:NO]; [floating setReleasedWhenClosed:NO];
              [normal setLevel:NSNormalWindowLevel]; [floating setLevel:NSFloatingWindowLevel];
              [normal orderFrontRegardless]; [floating orderFrontRegardless];
              [application activateIgnoringOtherApps:YES];
              [application run];
            }
            return 0;
          }
          OBJC
          /usr/bin/clang -Wno-deprecated-declarations "$task_root/window-control.m" -framework AppKit -o "$task_root/window-control"
          "$task_run" "$task_root/window-control" > "$task_root/out/control-app.log" 2>&1 &
          task_pid=$!
          found_control=0
          for attempt in {1..40}; do
            if ! kill -0 "$task_pid" 2>/dev/null; then break; fi
            if "$task_run" "$task_root/window" "$task_pid" > "$task_root/out/control-window.log" 2>&1 &&
               /usr/bin/grep -F '(normal)' "$task_root/out/control-window.log" >/dev/null &&
               /usr/bin/grep -F '(floating)' "$task_root/out/control-window.log" >/dev/null; then
              found_control=1
              break
            fi
            sleep 0.5
          done
          if test "$found_control" != 1; then
            echo 'Normal and floating control windows were not both verified.'
            cat "$task_root/out/control-app.log" "$task_root/out/control-window.log"
            exit 1
          fi
          echo 'Verified both normal and floating levels with known synthetic windows.'
          cat "$task_root/out/control-window.log"
          kill -TERM "$task_pid"
          wait "$task_pid" || true
          task_pid=""
          /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin "TMPDIR=$task_root/temp" \
            "CFFIXED_USER_HOME=$task_root/synthetic-home" /usr/bin/hdiutil attach "$image_path" \
            -readonly -nobrowse -noautoopen -mountpoint "$task_root/mount" -plist > "$task_root/out/mount.plist"
          task_mounted_app="$task_root/mount/AI Task Monitor.app"
          test -d "$task_mounted_app"
          test ! -L "$task_mounted_app"
          task_app="$task_root/Applications/AI Task Monitor.app"
          test ! -e "$task_app"
          test ! -L "$task_app"
          /usr/bin/ditto "$task_mounted_app" "$task_app"
          /usr/bin/diff -qr "$task_mounted_app" "$task_app"
          /usr/bin/codesign --verify --deep --strict "$task_app"
          task_binary="$task_app/Contents/MacOS/AITaskMonitor"
          test -x "$task_binary"
          /usr/bin/xcrun lipo "$task_binary" -verify_arch arm64 x86_64
          test "$(/usr/bin/plutil -extract AITaskMonitorReleaseVersion raw -o - "$task_app/Contents/Info.plist")" = 0.3.10
          test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$task_app/Contents/Info.plist")" = 0.3.10
          test "$(/usr/bin/plutil -extract CFBundleVersion raw -o - "$task_app/Contents/Info.plist")" = 14
          echo "Starting verified installed copy from the exact DMG without preview flags"
          "$task_run" "$task_binary" > "$task_root/out/app.log" 2>&1 &
          task_pid=$!
          found=0
          for attempt in {1..40}; do
            if ! kill -0 "$task_pid" 2>/dev/null; then
              set +e
              wait "$task_pid"
              result=$?
              set -e
              task_pid=""
              echo "Application exited before a window was verified (status $result)."
              cat "$task_root/out/app.log"
              exit 1
            fi
            if "$task_run" "$task_root/window" "$task_pid" > "$task_root/out/window.log" 2>&1; then found=1; break; fi
            sleep 0.5
          done
          if test "$found" != 1; then
            echo "No visible application window detected."
            cat "$task_root/out/window.log" "$task_root/out/app.log"
            exit 1
          fi
          cat "$task_root/out/window.log"
          sleep 3
          kill -0 "$task_pid"
          echo 'Installed copy from the exact DMG remained running with its own visible window.'
          cat > "$task_root/focus-helper.m" <<'OBJC'
          #import <AppKit/AppKit.h>
          #import <dispatch/dispatch.h>
          #include <signal.h>
          int main(void) {
              @autoreleasepool {
                  NSApplication *app = [NSApplication sharedApplication];
                  [app setActivationPolicy:NSApplicationActivationPolicyRegular];
                  NSWindow *window = [[NSWindow alloc] initWithContentRect:NSMakeRect(4, 4, 120, 80)
                      styleMask:NSWindowStyleMaskTitled backing:NSBackingStoreBuffered defer:NO];
                  [window setReleasedWhenClosed:NO];
                  [window setLevel:NSNormalWindowLevel];
                  [window orderFrontRegardless];
                  signal(SIGUSR1, SIG_IGN);
                  dispatch_source_t source = dispatch_source_create(DISPATCH_SOURCE_TYPE_SIGNAL, SIGUSR1, 0, dispatch_get_main_queue());
                  dispatch_source_set_event_handler(source, ^{
                      [app activateIgnoringOtherApps:YES];
                      [window makeKeyAndOrderFront:nil];
                  });
                  dispatch_resume(source);
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [app activateIgnoringOtherApps:YES];
                      [window makeKeyAndOrderFront:nil];
                  });
                  [app run];
              }
              return 0;
          }
          OBJC
          cat > "$task_root/actual-app-driver.m" <<'OBJC'
          #import <AppKit/AppKit.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <ApplicationServices/ApplicationServices.h>
          #include <signal.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>

          static void spin(double seconds) {
              NSDate *deadline = [NSDate dateWithTimeIntervalSinceNow:seconds];
              do {
                  [[NSRunLoop currentRunLoop] runMode:NSDefaultRunLoopMode beforeDate:[NSDate dateWithTimeIntervalSinceNow:0.01]];
                  [NSThread sleepForTimeInterval:0.01];
              } while (deadline.timeIntervalSinceNow > 0);
          }
          static BOOL findWindow(pid_t target, CGFloat minimumWidth, CGRect *result, CGWindowID *number) {
              CFArrayRef list = CGWindowListCopyWindowInfo(kCGWindowListOptionOnScreenOnly | kCGWindowListExcludeDesktopElements, kCGNullWindowID);
              if (!list) return NO;
              BOOL found = NO;
              for (NSDictionary *row in (__bridge NSArray *)list) {
                  if ([row[(__bridge id)kCGWindowOwnerPID] intValue] != target) continue;
                  CGRect rect = CGRectZero;
                  NSDictionary *bounds = row[(__bridge id)kCGWindowBounds];
                  if (!bounds || !CGRectMakeWithDictionaryRepresentation((__bridge CFDictionaryRef)bounds, &rect)) continue;
                  if (rect.size.width < minimumWidth || rect.size.height < 40) continue;
                  *result = rect;
                  *number = [row[(__bridge id)kCGWindowNumber] unsignedIntValue];
                  found = YES;
                  break;
              }
              CFRelease(list);
              return found;
          }
          static BOOL topmostAt(CGPoint point, CGWindowID expected) {
              NSArray<NSScreen *> *screens = [NSScreen screens];
              if (screens.count != 1) return NO;
              NSRect frame = screens.firstObject.frame;
              if (frame.origin.x != 0 || frame.origin.y != 0) return NO;
              NSPoint appKitPoint = NSMakePoint(point.x, NSMaxY(frame) - point.y);
              NSInteger appkit = [NSWindow windowNumberAtPoint:appKitPoint belowWindowWithWindowNumber:0];
              CFArrayRef list = CGWindowListCopyWindowInfo(kCGWindowListOptionOnScreenOnly | kCGWindowListExcludeDesktopElements, kCGNullWindowID);
              if (!list) return NO;
              CGWindowID top = 0;
              int owner = -1;
              for (NSDictionary *row in (__bridge NSArray *)list) {
                  CGRect rect = CGRectZero;
                  NSDictionary *box = row[(__bridge id)kCGWindowBounds];
                  if (!box || !CGRectMakeWithDictionaryRepresentation((__bridge CFDictionaryRef)box, &rect)) continue;
                  NSNumber *alpha = row[(__bridge id)kCGWindowAlpha];
                  if (alpha && alpha.doubleValue < 0.02) continue;
                  if (!CGRectContainsPoint(rect, point)) continue;
                  top = [row[(__bridge id)kCGWindowNumber] unsignedIntValue];
                  owner = [row[(__bridge id)kCGWindowOwnerPID] intValue];
                  break;
              }
              CFRelease(list);
              printf("TOPMOST x=%.0f y=%.0f expected=%u cg=%u owner=%d appkit=%ld\n", point.x, point.y, expected, top, owner, (long)appkit);
              return appkit == (NSInteger)expected;
          }
          static BOOL postMouse(CGEventType type, CGPoint point) {
              CGEventRef event = CGEventCreateMouseEvent(NULL, type, point, kCGMouseButtonLeft);
              if (!event) return NO;
              if (type == kCGEventLeftMouseDown || type == kCGEventLeftMouseUp)
                  CGEventSetIntegerValueField(event, kCGMouseEventClickState, 1);
              CGEventPost(kCGHIDEventTap, event);
              CFRelease(event);
              return YES;
          }
          static BOOL moveMouse(CGPoint point) {
              return CGWarpMouseCursorPosition(point) == kCGErrorSuccess && postMouse(kCGEventMouseMoved, point);
          }
          int main(int argc, char **argv) {
              @autoreleasepool {
                  if (argc != 3) return 2;
                  pid_t pid = (pid_t)atoi(argv[1]);
                  pid_t helperPid = (pid_t)atoi(argv[2]);
                  [NSApplication sharedApplication];
                  NSRunningApplication *target = [NSRunningApplication runningApplicationWithProcessIdentifier:pid];
                  NSRunningApplication *helper = [NSRunningApplication runningApplicationWithProcessIdentifier:helperPid];
                  if (!target || target.terminated) { puts("DRIVER_ERROR: target process missing"); return 3; }
                  CGRect bounds = CGRectZero, helperBounds = CGRectZero;
                  CGWindowID windowNumber = 0, helperWindow = 0;
                  if (!findWindow(pid, 200, &bounds, &windowNumber)) { puts("DRIVER_ERROR: target window missing"); return 4; }
                  BOOL helperFound = helper && !helper.terminated && findWindow(helperPid, 60, &helperBounds, &helperWindow);
                  printf("TARGET_WINDOW id=%u x=%.0f y=%.0f width=%.0f height=%.0f\n", windowNumber,
                         bounds.origin.x, bounds.origin.y, bounds.size.width, bounds.size.height);
                  NSArray<NSScreen *> *screens = [NSScreen screens];
                  BOOL hoverTested = NO;
                  BOOL hoverPassed = NO;
                  BOOL negativeControl = NO;
                  if (helperFound && screens.count == 1) {
                      [target activateWithOptions:NSApplicationActivateIgnoringOtherApps];
                      spin(0.8);
                      CGPoint helperPoint = CGPointMake(CGRectGetMinX(helperBounds)+15, CGRectGetMidY(helperBounds));
                      printf("NEGATIVE_PRE targetActive=%d helperActive=%d helperFound=%d\n", target.isActive, helper.isActive, helperFound);
                      if (target.isActive && !helper.isActive && topmostAt(helperPoint, helperWindow) && moveMouse(helperPoint)) {
                          spin(0.8);
                          negativeControl = target.isActive && !helper.isActive;
                          if (negativeControl) puts("NEGATIVE_CONTROL_PASS: ordinary helper window did not activate on hover");
                          else puts("NEGATIVE_CONTROL_FAIL: ordinary helper activated on hover");
                      } else {
                          puts("NEGATIVE_CONTROL_UNVERIFIED: ordinary helper window is not independently targetable");
                      }
                  } else {
                      puts("NEGATIVE_CONTROL_UNVERIFIED: helper window or single screen unavailable");
                  }
                  if (helperFound) {
                      kill(helperPid, SIGUSR1);
                      for (int i=0; i<30 && !helper.isActive && !helper.terminated; i++) spin(0.1);
                  }
                  if (negativeControl && helperFound && helper.isActive && !target.isActive && screens.count == 1) {
                      NSRect frame = screens.firstObject.frame;
                      CGPoint candidates[] = {CGPointMake(2, 2), CGPointMake(NSWidth(frame)-2, 2),
                                               CGPointMake(2, NSHeight(frame)-2), CGPointMake(NSWidth(frame)-2, NSHeight(frame)-2)};
                      BOOL foundOutside = NO;
                      for (unsigned i=0; i<4; i++) {
                          if (!CGRectContainsPoint(bounds, candidates[i])) {
                              if (moveMouse(candidates[i])) { foundOutside = YES; spin(0.4); }
                              break;
                          }
                      }
                      CGPoint header = CGPointMake(CGRectGetMidX(bounds), CGRectGetMinY(bounds)+(CGRectGetHeight(bounds)-700)+29);
                      if (foundOutside && helper.isActive && !target.isActive && topmostAt(header, windowNumber) && moveMouse(header)) {
                          hoverTested = YES;
                          for (int i=0; i<40 && !target.isActive && !target.terminated; i++) spin(0.1);
                          hoverPassed = target.isActive;
                      }
                  }
                  if (hoverTested && hoverPassed) puts("HOVER_PASS: real app became active after pointer entered visible header");
                  else if (hoverTested) puts("HOVER_FAIL: real app did not activate after pointer entered visible header");
                  else puts("HOVER_UNVERIFIED: could not establish focus, negative control, pointer, screen, or unobscured-window preconditions");

                  if (target.terminated) { puts("CLOSE_UNVERIFIED: app terminated before close test"); return 5; }
                  if (!target.isActive) {
                      [target activateWithOptions:NSApplicationActivateIgnoringOtherApps];
                      spin(0.8);
                  }
                  CGPoint close = CGPointMake(CGRectGetMaxX(bounds)-32, CGRectGetMinY(bounds)+(CGRectGetHeight(bounds)-700)+29);
                  printf("CLOSE_PRE targetActive=%d helperActive=%d trusted=%d\n", target.isActive, helper.isActive, AXIsProcessTrusted());
                  AXUIElementRef system = AXUIElementCreateSystemWide();
                  AXUIElementRef element = NULL;
                  AXError axError = AXUIElementCopyElementAtPosition(system, close.x, close.y, &element);
                  if (axError == kAXErrorSuccess && element) {
                      pid_t axPid = 0;
                      AXUIElementGetPid(element, &axPid);
                      CFTypeRef role = NULL, label = NULL;
                      AXUIElementCopyAttributeValue(element, kAXRoleAttribute, &role);
                      AXUIElementCopyAttributeValue(element, kAXDescriptionAttribute, &label);
                      printf("AX_CLOSE pid=%d target=%d role=%s label=%s\n", axPid, pid,
                          role && CFGetTypeID(role)==CFStringGetTypeID() ? [(__bridge NSString *)role UTF8String] : "?",
                          label && CFGetTypeID(label)==CFStringGetTypeID() ? [(__bridge NSString *)label UTF8String] : "?");
                      BOOL valid = axPid == pid && role && CFEqual(role, kAXButtonRole);
                      if (role) CFRelease(role);
                      if (label) CFRelease(label);
                      CFRelease(element);
                      if (!valid) { CFRelease(system); puts("CLOSE_UNVERIFIED: accessibility element is not target button"); return 9; }
                  } else printf("AX_CLOSE_UNAVAILABLE error=%d\n", axError);
                  CFRelease(system);
                  if (!target.isActive || !topmostAt(close, windowNumber) || !moveMouse(close)) {
                      puts("CLOSE_UNVERIFIED: close button is not safely targetable");
                      return 6;
                  }
                  spin(0.3);
                  if (!postMouse(kCGEventLeftMouseDown, close) || !postMouse(kCGEventLeftMouseUp, close)) {
                      puts("CLOSE_UNVERIFIED: mouse events could not be created");
                      return 7;
                  }
                  for (int i=0; i<100 && !target.terminated; i++) spin(0.1);
                  if (target.terminated) { puts("CLOSE_PASS: target terminated after a real close-button click"); return 0; }
                  puts("CLOSE_UNVERIFIED: target did not terminate after the close-button event");
                  return 8;
              }
          }
          OBJC
          /usr/bin/clang -Wno-deprecated-declarations "$task_root/focus-helper.m" -framework AppKit -o "$task_root/focus-helper"
          /usr/bin/clang -Wno-deprecated-declarations "$task_root/actual-app-driver.m" -framework AppKit -framework CoreGraphics -framework ApplicationServices -o "$task_root/actual-app-driver"
          "$task_run" "$task_root/focus-helper" > "$task_root/out/focus-helper.log" 2>&1 &
          task_helper_pid=$!
          sleep 2
          set +e
          "$task_run" "$task_root/actual-app-driver" "$task_pid" "$task_helper_pid" > "$task_root/out/driver.log" 2>&1
          driver_status=$?
          set -e
          cat "$task_root/out/driver.log"
          if test "$driver_status" -ne 0; then
            echo "NORMAL_CLOSE_UNVERIFIED: driver returned $driver_status; cleanup may terminate the app"
            exit 1
          fi
          set +e
          wait "$task_pid"
          app_status=$?
          set -e
          task_pid=""
          if test "$app_status" -ne 0; then
            echo "NORMAL_CLOSE_FAIL: real app exited with status $app_status"
            exit 1
          fi
          echo 'NORMAL_CLOSE_PASS: unmodified app exited with status 0 after the close-button click.'
          if /usr/bin/grep -q '^HOVER_FAIL:' "$task_root/out/driver.log"; then
            echo 'HOVER_FAIL: the real application did not activate despite verified hover preconditions.'
            exit 1
          fi
      - name: Save diagnostic evidence
        if: ${{ always() && env.AITM_TEST_TASK_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-0310-actual-dmg-check-${{ matrix.runner }}
          path: ${{ env.AITM_TEST_TASK_ROOT }}/out/
          if-no-files-found: warn
          retention-days: 7
