name: Verify exact Windows 0.2.9 installer
on:
  push:
    branches: ['codex/windows-final-029-ci-a']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      RELEASE_SOURCE_SHA: '440392135de66a16214d6294e786855ff6dc22cc'
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
    steps:
      - name: Check out exact source and run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:RUNNER_TEMP ('aitm-final-source-' + [guid]::NewGuid().ToString('N'))
          $source = Join-Path $sourceRoot 'source'
          $template = Join-Path $sourceRoot 'template'
          $hooks = Join-Path $sourceRoot 'hooks'
          New-Item -ItemType Directory -Path $source, $template, $hooks | Out-Null
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = Join-Path $sourceRoot 'empty.gitconfig'
          [IO.File]::WriteAllText($env:GIT_CONFIG_GLOBAL, '')
          $env:GIT_TERMINAL_PROMPT = '0'
          git -c credential.helper= -c core.hooksPath="$hooks" -c init.defaultBranch=fixture init --quiet --template="$template" "$source"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize checkout.' }
          git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" fetch --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" "$env:RELEASE_SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the exact release source.' }
          git -C "$source" -c core.hooksPath="$hooks" checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C "$source" rev-parse HEAD).Trim() -cne $env:RELEASE_SOURCE_SHA) { throw 'Unexpected source revision.' }
          $gui = [IO.File]::ReadAllText((Join-Path $source 'windows/app/CodexProgress.ps1'))
          $versionInfo = [IO.File]::ReadAllText((Join-Path $source 'windows/app/VersionInfo.cs'))
          if (-not $gui.Contains('$script:currentVersion=''0.2.9''') -or -not $versionInfo.Contains('[assembly: AssemblyInformationalVersion("0.2.9")]')) { throw 'The 0.2.9 source versions do not agree.' }
          $interpreters = @(Get-Command python.exe -CommandType Application -All -ErrorAction SilentlyContinue |
              Where-Object { $_.Source -notmatch '(?i)\\WindowsApps\\' } | ForEach-Object { $_.Source })
          if ($interpreters.Count -eq 0 -and $env:RUNNER_TOOL_CACHE) {
              $pythonCache = Join-Path $env:RUNNER_TOOL_CACHE 'Python'
              if (Test-Path -LiteralPath $pythonCache -PathType Container) {
                  $interpreters = @(Get-ChildItem -LiteralPath $pythonCache -Filter python.exe -File -Recurse |
                      Where-Object { $_.FullName -notmatch '(?i)\\WindowsApps\\' } | ForEach-Object { $_.FullName })
              }
          }
          if ($interpreters.Count -eq 0) { throw 'A hosted Python interpreter was not found.' }
          $interpreter = $interpreters[0]
          $version = & $interpreter --version 2>&1
          if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '^Python 3\.') { throw 'A verified Python 3 interpreter is required.' }
          & $interpreter -B (Join-Path $source 'windows/tests/Test-DotnetPathSafety.py')
          if ($LASTEXITCODE -ne 0) { throw '.NET PATH safety check failed.' }
          & (Join-Path $source 'windows/tests/Test-CodexTitleLookup.ps1')
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $test = Join-Path $sourceRoot 'Test-SafeInstallSwap.exe'
          & $compiler /nologo /target:exe /main:TestSafeInstallSwap /reference:System.Web.Extensions.dll /reference:System.Management.dll /reference:System.Windows.Forms.dll "/out:$test" `
              (Join-Path $source 'windows/app/SafeInstallPaths.cs') `
              (Join-Path $source 'windows/app/SafeInstallSwap.cs') `
              (Join-Path $source 'windows/app/MonitorProcessCheck.cs') `
              (Join-Path $source 'windows/app/CodexProgressInstaller.cs') `
              (Join-Path $source '.github/legacy-uninstall-ci/Test-SafeInstallSwap.cs')
          if ($LASTEXITCODE -ne 0) { throw 'Installer regression harness did not compile.' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'Installer regression harness failed.' }
          $env:GITHUB_SHA = $env:RELEASE_SOURCE_SHA
          & (Join-Path $source '.github/legacy-uninstall-ci/Test-InstallerAndRemoval.ps1')
          $artifactRoot = Join-Path $env:RUNNER_TEMP ('aitm-verified-setup-' + $env:RELEASE_SOURCE_SHA)
          $recorded = [IO.File]::ReadAllText((Join-Path $artifactRoot 'SOURCE-REVISION.txt')).Trim()
          if ($recorded -cne $env:RELEASE_SOURCE_SHA) { throw 'Artifact source revision is incorrect.' }
          $installer = Join-Path $artifactRoot 'AITaskMonitorSetup.exe'
          if ([Diagnostics.FileVersionInfo]::GetVersionInfo($installer).ProductVersion -cne '0.2.9') { throw 'Installer version is incorrect.' }
      - name: Save exact verified installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-windows-029-${{ env.RELEASE_SOURCE_SHA }}
          path: ${{ runner.temp }}/aitm-verified-setup-${{ env.RELEASE_SOURCE_SHA }}
          if-no-files-found: error
          retention-days: 3
      - name: Save installer dialog screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-029-dialogs-${{ env.RELEASE_SOURCE_SHA }}
          path: ${{ runner.temp }}/aitm-dialogs-${{ env.RELEASE_SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 3
