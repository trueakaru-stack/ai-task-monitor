name: Synthetic Windows feedback visual audit
on:
  push:
    branches: ['codex/windows-feedback-audit-20261116']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feedback:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
    steps:
      - name: Check released feedback layout on isolated runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-PathState([string]$scope) {
            $key = if ($scope -eq 'User') { [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $false) } else { [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SYSTEM\CurrentControlSet\Control\Session Manager\Environment', $false) }
            try { return [pscustomobject]@{ Value=[string]$key.GetValue('Path','',[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames); Kind=[string]$key.GetValueKind('Path') } } finally { $key.Dispose() }
          }
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:RUNNER_OS -ne 'Windows') { throw 'Disposable hosted Windows runner required.' }
          $beforeUser = Read-PathState 'User'
          $beforeMachine = Read-PathState 'Machine'
          try {
            $root = Join-Path $env:RUNNER_TEMP ('aitm-windows-feedback-' + [guid]::NewGuid().ToString('N'))
            $source = Join-Path $root 'source'
            $template = Join-Path $root 'template'
            $hooks = Join-Path $root 'hooks'
            $screens = Join-Path $root 'screenshots'
            $temp = Join-Path $root 'temp'
            $profile = Join-Path $root 'profile'
            $appdata = Join-Path $root 'appdata'
            $local = Join-Path $root 'localappdata'
            New-Item -ItemType Directory -Path $source,$template,$hooks,$screens,$temp,$profile,$appdata,$local | Out-Null
            git -c credential.helper= -c core.hooksPath="$hooks" -c init.defaultBranch=audit init --quiet --template="$template" "$source"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize checkout.' }
            git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" fetch --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch exact test revision.' }
            git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" checkout --quiet --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot select test revision.' }
            $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            $script = Join-Path $source 'windows/app/CodexProgress.ps1'
            foreach ($theme in @('dark')) {
              foreach ($language in @('ru')) {
                $stem = "$theme-$language"
                $info = [Diagnostics.ProcessStartInfo]::new()
                $info.FileName = $powershell
                $info.WorkingDirectory = $root
                $info.UseShellExecute = $false
                $info.CreateNoWindow = $true
                $info.RedirectStandardOutput = $true
                $info.RedirectStandardError = $true
                foreach ($arg in @('-NoProfile','-STA','-NonInteractive','-ExecutionPolicy','Bypass','-File',$script,'-PreviewActiveTasks','2','-PreviewAbout','-PreviewAboutUiTest','-PreviewSettingsEnd','-ThemeOverride',$theme,'-LanguageOverride',$language,'-DiagnosticDirectory',(Join-Path $temp ('diag-'+$stem)),'-PreferencesFile',(Join-Path $temp ('prefs-'+$stem+'.json')),'-SnapshotFile',(Join-Path $screens ('about-'+$stem+'.png')),'-SettingsSnapshotFile',(Join-Path $screens ('settings-'+$stem+'.png')))) { [void]$info.ArgumentList.Add($arg) }
                $info.Environment.Clear()
                $values = @{ SystemRoot=$env:SystemRoot; windir=$env:SystemRoot; PATH=((Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0')+';'+(Join-Path $env:SystemRoot 'System32')+';'+$env:SystemRoot); USERPROFILE=$profile; APPDATA=$appdata; LOCALAPPDATA=$local; TEMP=$temp; TMP=$temp; DOTNET_ADD_GLOBAL_TOOLS_TO_PATH='0'; DOTNET_GENERATE_ASPNET_CERTIFICATE='0'; AITM_SYNTHETIC_FEEDBACK_HOVER='1'; GITHUB_ACTIONS=$env:GITHUB_ACTIONS; RUNNER_ENVIRONMENT=$env:RUNNER_ENVIRONMENT; RUNNER_OS=$env:RUNNER_OS }
                foreach ($name in @('ProgramFiles','ProgramFiles(x86)','ProgramW6432','ProgramData','ALLUSERSPROFILE','SystemDrive','ComSpec')) { $value=[Environment]::GetEnvironmentVariable($name); if (-not [string]::IsNullOrEmpty($value)) { $values[$name]=$value } }
                foreach ($key in $values.Keys) { $info.Environment[$key]=[string]$values[$key] }
                $process = [Diagnostics.Process]::Start($info)
                try {
                  $stdout=$process.StandardOutput.ReadToEndAsync(); $stderr=$process.StandardError.ReadToEndAsync()
                  if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'Synthetic feedback audit timed out.' }
                  if ($process.ExitCode -ne 0) { throw ('Synthetic feedback audit failed: '+$stdout.Result+$stderr.Result) }
                  if (-not (Test-Path -LiteralPath (Join-Path $screens ('settings-'+$stem+'.png')) -PathType Leaf)) { throw 'Settings screenshot missing.' }
                  if ($stdout.Result) { Write-Output $stdout.Result.TrimEnd() }
                } finally { $process.Dispose() }
              }
            }
          } finally {
            foreach ($scope in @('User','Machine')) { $before=if($scope -eq 'User'){$beforeUser}else{$beforeMachine}; $after=Read-PathState $scope; if ($after.Value -cne $before.Value -or $after.Kind -cne $before.Kind) { throw "$scope PATH changed." } }
          }
      - name: Preserve synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-feedback-screenshots
          path: ${{ runner.temp }}/aitm-windows-feedback-*/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
