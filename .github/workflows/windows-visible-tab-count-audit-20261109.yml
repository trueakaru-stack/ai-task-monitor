name: Windows visible tab counts isolated review

on:
  workflow_dispatch:
  push:
    branches: [windows]
    paths:
      - '.github/workflows/windows-visible-tab-count-audit-20261109.yml'

permissions:
  contents: read

jobs:
  synthetic:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-tab-count-audit]'))
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
    steps:
      - name: Fetch pinned public baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'A GitHub-hosted Windows runner is required.' }
          $sourceCommit = '31f043426dc7f90cd3c1a776098ce156afe26d97'
          $gitRoot = Join-Path $env:RUNNER_TEMP 'aitm-tab-count-git'
          $template = Join-Path $gitRoot 'template'
          $hooks = Join-Path $gitRoot 'hooks'
          New-Item -ItemType Directory -Path $template, $hooks -ErrorAction Stop | Out-Null
          $env:GIT_CONFIG_GLOBAL = Join-Path $gitRoot 'empty-gitconfig'
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_TERMINAL_PROMPT = '0'
          [IO.File]::WriteAllText($env:GIT_CONFIG_GLOBAL, '', [Text.UTF8Encoding]::new($false))
          git -c credential.helper= -c core.autocrlf=false -c core.eol=lf -c core.safecrlf=false -c core.hooksPath="$hooks" -c init.defaultBranch=audit init --template="$template" .
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize the disposable checkout.' }
          git -c credential.helper= -c core.autocrlf=false -c core.eol=lf -c core.safecrlf=false -c core.hooksPath="$hooks" fetch --no-tags --depth=1 https://github.com/trueakaru-stack/ai-task-monitor.git $sourceCommit
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the pinned public source.' }
          git -c credential.helper= -c core.autocrlf=false -c core.eol=lf -c core.safecrlf=false -c core.hooksPath="$hooks" checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot select the pinned public source.' }
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $sourceCommit) { throw 'Unexpected baseline commit.' }
      - name: Apply only the verified C# changes
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_CONFIG_GLOBAL = Join-Path $env:RUNNER_TEMP 'aitm-tab-count-git\empty-gitconfig'
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_TERMINAL_PROMPT = '0'
          $patchBytes = [Convert]::FromBase64String('')
          $patchDigest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($patchBytes))
          if ($patchDigest -ne '6D205006E451952AD11D18982FCED9054C08D7F86A82A786F5B2FB883315F6B7') { throw 'Unexpected test patch.' }
          $patchFile = Join-Path $env:RUNNER_TEMP 'aitm-tab-count.patch'
          [IO.File]::WriteAllBytes($patchFile, $patchBytes)
          git -c core.autocrlf=false -c core.eol=lf -c core.safecrlf=false apply --check -- $patchFile
          if ($LASTEXITCODE -ne 0) { throw 'Patch does not apply to the pinned baseline.' }
          git -c core.autocrlf=false -c core.eol=lf -c core.safecrlf=false apply -- $patchFile
          if ($LASTEXITCODE -ne 0) { throw 'Patch application failed.' }
          $expected = [ordered]@{
            'windows/native/Prototype/PrototypeWindow.cs' = 'ADC18C641935C2F2DB2D99E7C4CBBBD64AA773B94C067469801B62B09A78A704'
            'windows/native/Prototype/Tests/Program.cs' = 'DA69FBB5FF9F6B72D5F28A388C665E0E34118A98908C1F3C39E005F793347321'
            'windows/native/Tests/ClaudeFileUi/Program.cs' = 'DF66B534F6E8C30F03C076935CCF596446C9393C24FCE7088AF4A17F685CF33C'
          }
          foreach ($path in $expected.Keys) {
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash -ne $expected[$path]) { throw "Unexpected candidate bytes: $path" }
          }
          $changed = @(git -c core.autocrlf=false -c core.eol=lf -c core.safecrlf=false diff --name-only HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 3) { throw 'Unexpected changed-file count.' }
          foreach ($path in $changed) {
            if (-not $expected.Contains($path)) { throw "Unexpected changed file: $path" }
          }
          $root = Join-Path $env:RUNNER_TEMP 'aitm-tab-count-audit'
          foreach ($item in @('profile','profile\AppData\Roaming','profile\AppData\Local','sdk','temp','nuget','before-red','before-visual','after','frames','frames\before','frames\after','saved')) {
            New-Item -ItemType Directory -Path (Join-Path $root $item) -Force | Out-Null
          }
          $config = Join-Path $root 'NuGet.Config'
          [IO.File]::WriteAllText($config, '<configuration><packageSources><clear /></packageSources></configuration>', [Text.UTF8Encoding]::new($false))
          Copy-Item -LiteralPath 'windows/native/Prototype/PrototypeWindow.cs' -Destination (Join-Path $root 'saved/PrototypeWindow.cs')
          Copy-Item -LiteralPath 'windows/native/Prototype/Tests/Program.cs' -Destination (Join-Path $root 'saved/PrototypeTests.cs')
          @(
            "AITM_TEST_ROOT=$root", "AITM_NUGET_CONFIG=$config",
            "USERPROFILE=$root\profile", "APPDATA=$root\profile\AppData\Roaming", "LOCALAPPDATA=$root\profile\AppData\Local",
            "TEMP=$root\temp", "TMP=$root\temp", "DOTNET_CLI_HOME=$root\sdk", "NUGET_PACKAGES=$root\nuget",
            "GIT_CONFIG_GLOBAL=$env:RUNNER_TEMP\aitm-tab-count-git\empty-gitconfig",
            "AITM_EMPTY_HOOKS=$env:RUNNER_TEMP\aitm-tab-count-git\hooks",
            'GIT_CONFIG_NOSYSTEM=1', 'GIT_TERMINAL_PROMPT=0',
            'DOTNET_CLI_TELEMETRY_OPTOUT=1', 'DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1',
            'DOTNET_GENERATE_ASPNET_CERTIFICATE=0', 'DOTNET_NOLOGO=1'
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Confirm exact installed SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdks = @(dotnet --list-sdks)
          if ($LASTEXITCODE -ne 0 -or -not ($sdks | Where-Object { $_ -match '^10\.0\.403\s' })) { throw 'SDK 10.0.403 is unavailable.' }
          if (Test-Path -LiteralPath 'global.json') { throw 'Unexpected global.json.' }
          [IO.File]::WriteAllText((Join-Path (Get-Location).Path 'global.json'), '{"sdk":{"version":"10.0.403","rollForward":"disable"}}', [Text.UTF8Encoding]::new($false))
          $selected = dotnet --version
          if ($LASTEXITCODE -ne 0 -or $selected -ne '10.0.403') { throw 'Exact SDK was not selected.' }
      - name: Reproduce the prior count and capture its reference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windowPath = 'windows/native/Prototype/PrototypeWindow.cs'
          $testPath = 'windows/native/Prototype/Tests/Program.cs'
          git -c credential.helper= -c core.autocrlf=false -c core.eol=lf -c core.safecrlf=false -c core.hooksPath="$env:AITM_EMPTY_HOOKS" checkout HEAD -- $windowPath
          if ($LASTEXITCODE -ne 0) { throw 'Cannot restore baseline window in the synthetic checkout.' }
          Remove-Item Env:AITM_TAB_COUNT_CAPTURE_DIRECTORY -ErrorAction SilentlyContinue
          dotnet build 'windows/native/Prototype/Tests/Prototype.Tests.csproj' -c Release --configfile $env:AITM_NUGET_CONFIG --artifacts-path "$env:AITM_TEST_ROOT\before-red" -p:NuGetAudit=false --nologo --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Baseline negative test build failed.' }
          $dll = Join-Path $env:AITM_TEST_ROOT 'before-red\bin\Prototype.Tests\release\AITaskMonitor.Prototype.Tests.dll'
          $start = [Diagnostics.ProcessStartInfo]::new((Get-Command dotnet).Source)
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          [void]$start.ArgumentList.Add($dll)
          $proc = [Diagnostics.Process]::Start($start)
          try {
            $output = $proc.StandardOutput.ReadToEndAsync()
            $errors = $proc.StandardError.ReadToEndAsync()
            if (-not $proc.WaitForExit(180000)) { $proc.Kill($true); throw 'Baseline negative test timed out.' }
            $combined = $output.GetAwaiter().GetResult() + $errors.GetAwaiter().GetResult()
            if ($proc.ExitCode -eq 0 -or -not $combined.Contains('Accessible tab count differs from visible cards.')) { throw 'Prior count defect was not reproduced.' }
            Write-Output 'Expected prior count assertion failed.'
          } finally { $proc.Dispose() }
          $text = [IO.File]::ReadAllText((Resolve-Path $testPath))
          $oldTwo = '            AssertTabs(4, 2, 2);'
          $oldOne = '            AssertTabs(3, 2, 1);'
          $oldWaiting = '            AssertTabs(4, 2, 1, 1);'
          $defenseCall = '                    CheckClaudeContradictoryState(language, theme);'
          if ([regex]::Matches($text, [regex]::Escape($oldTwo)).Count -ne 2 -or [regex]::Matches($text, [regex]::Escape($oldOne)).Count -ne 1 -or [regex]::Matches($text, [regex]::Escape($oldWaiting)).Count -ne 1 -or [regex]::Matches($text, [regex]::Escape($defenseCall)).Count -ne 1) { throw 'Expected test fixture was not found exactly.' }
          $text = $text.Replace($oldTwo, '            AssertTabs(1, 1, 0);').Replace($oldOne, '            AssertTabs(1, 1, 0);').Replace($oldWaiting, '            AssertTabs(1, 1, 0, 0);')
          [IO.File]::WriteAllText((Resolve-Path $testPath), $text, [Text.UTF8Encoding]::new($false))
          dotnet build 'windows/native/Prototype/Tests/Prototype.Tests.csproj' -c Release --configfile $env:AITM_NUGET_CONFIG --artifacts-path "$env:AITM_TEST_ROOT\before-defense-red" -p:NuGetAudit=false --nologo --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Baseline defense negative test build failed.' }
          $defenseDll = Join-Path $env:AITM_TEST_ROOT 'before-defense-red\bin\Prototype.Tests\release\AITaskMonitor.Prototype.Tests.dll'
          $start = [Diagnostics.ProcessStartInfo]::new((Get-Command dotnet).Source)
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          [void]$start.ArgumentList.Add($defenseDll)
          $proc = [Diagnostics.Process]::Start($start)
          try {
            $output = $proc.StandardOutput.ReadToEndAsync()
            $errors = $proc.StandardError.ReadToEndAsync()
            if (-not $proc.WaitForExit(180000)) { $proc.Kill($true); throw 'Baseline defense negative test timed out.' }
            $combined = $output.GetAwaiter().GetResult() + $errors.GetAwaiter().GetResult()
            if ($proc.ExitCode -eq 0 -or -not $combined.Contains('Unconfirmed Claude task displayed confirmed step markers.')) { throw 'Prior Claude marker defect was not reproduced.' }
            Write-Output 'Expected prior Claude marker assertion failed.'
          } finally { $proc.Dispose() }
          $text = $text.Replace($defenseCall, '                    // Baseline lacks the contradictory-input defense.')
          [IO.File]::WriteAllText((Resolve-Path $testPath), $text, [Text.UTF8Encoding]::new($false))
          $env:AITM_TAB_COUNT_CAPTURE_DIRECTORY = Join-Path $env:AITM_TEST_ROOT 'frames/before'
          dotnet build 'windows/native/Prototype/Tests/Prototype.Tests.csproj' -c Release --configfile $env:AITM_NUGET_CONFIG --artifacts-path "$env:AITM_TEST_ROOT\before-visual" -p:NuGetAudit=false --nologo --verbosity quiet
          if ($LASTEXITCODE -ne 0) { throw 'Baseline capture build failed.' }
          dotnet "$env:AITM_TEST_ROOT\before-visual\bin\Prototype.Tests\release\AITaskMonitor.Prototype.Tests.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline capture test failed.' }
      - name: Run candidate tests and capture updated frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item -LiteralPath (Join-Path $env:AITM_TEST_ROOT 'saved/PrototypeWindow.cs') -Destination 'windows/native/Prototype/PrototypeWindow.cs' -Force
          Copy-Item -LiteralPath (Join-Path $env:AITM_TEST_ROOT 'saved/PrototypeTests.cs') -Destination 'windows/native/Prototype/Tests/Program.cs' -Force
          $expected = [ordered]@{
            'windows/native/Prototype/PrototypeWindow.cs' = 'ADC18C641935C2F2DB2D99E7C4CBBBD64AA773B94C067469801B62B09A78A704'
            'windows/native/Prototype/Tests/Program.cs' = 'DA69FBB5FF9F6B72D5F28A388C665E0E34118A98908C1F3C39E005F793347321'
            'windows/native/Tests/ClaudeFileUi/Program.cs' = 'DF66B534F6E8C30F03C076935CCF596446C9393C24FCE7088AF4A17F685CF33C'
          }
          foreach ($path in $expected.Keys) {
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash -ne $expected[$path]) { throw "Restored candidate differs: $path" }
          }
          $env:AITM_TAB_COUNT_CAPTURE_DIRECTORY = Join-Path $env:AITM_TEST_ROOT 'frames/after'
          $tests = @(
            @{ Project='windows/native/Prototype/Tests/Prototype.Tests.csproj'; Dll='Prototype.Tests\release\AITaskMonitor.Prototype.Tests.dll' },
            @{ Project='windows/native/Tests/ClaudeFileUi/ClaudeFileUi.Tests.csproj'; Dll='ClaudeFileUi.Tests\release\AITaskMonitor.Prototype.Tests.dll' }
          )
          foreach ($test in $tests) {
            dotnet build $test.Project -c Release --configfile $env:AITM_NUGET_CONFIG --artifacts-path "$env:AITM_TEST_ROOT\after" -p:NuGetAudit=false --nologo --verbosity quiet
            if ($LASTEXITCODE -ne 0) { throw "Candidate build failed: $($test.Project)" }
            dotnet (Join-Path "$env:AITM_TEST_ROOT\after\bin" $test.Dll)
            if ($LASTEXITCODE -ne 0) { throw "Candidate test failed: $($test.Project)" }
          }
      - name: Verify and record captured frames
        id: frames
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName PresentationCore
          $records = [Collections.Generic.List[object]]::new()
          foreach ($version in @('before','after')) {
            foreach ($language in @('ru','en')) {
              foreach ($theme in @('dark','light')) {
                foreach ($selection in @('all','claude','deepseek')) {
                  $relative = "$version/$theme-$language-visible-counts-$selection.png"
                  $path = Join-Path (Join-Path $env:AITM_TEST_ROOT 'frames') $relative
                  if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing frame: $relative" }
                  $stream = [IO.File]::OpenRead($path)
                  try {
                    $image = [Windows.Media.Imaging.BitmapDecoder]::Create($stream, [Windows.Media.Imaging.BitmapCreateOptions]::None, [Windows.Media.Imaging.BitmapCacheOption]::OnLoad).Frames[0]
                    if ($image.PixelWidth -ne 590 -or $image.PixelHeight -ne 760) { throw "Unexpected frame dimensions: $relative" }
                  } finally { $stream.Dispose() }
                  $records.Add([pscustomobject]@{path=$relative;width=$image.PixelWidth;height=$image.PixelHeight;sha256=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash})
                }
              }
            }
          }
          if ($records.Count -ne 24) { throw 'Unexpected number of tab frames.' }
          $temporary = Join-Path $env:AITM_TEST_ROOT 'temp'
          $sourceDirectories = @(Get-ChildItem -LiteralPath $temporary -Directory -Filter 'aitm-claude-file-ui-*' -Force)
          if ($sourceDirectories.Count -ne 1) { throw 'Expected exactly one Claude UI test directory.' }
          $sourceDirectory = $sourceDirectories[0]
          if (($sourceDirectory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Claude UI test directory must not be a link.' }
          $suffixes = @('confirmed-expanded','loss-expanded','loss-compact','new-prompt-compact','new-prompt-expanded','bounded-compact','bounded-expanded','empty-warning-expanded','empty-warning-compact')
          $expectedNames = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($language in @('ru','en')) { foreach ($theme in @('dark','light')) { foreach ($suffix in $suffixes) {
            if (-not $expectedNames.Add("$language-$theme-$suffix.png")) { throw 'Duplicate expected Claude frame.' }
          } } }
          if ($expectedNames.Count -ne 36) { throw 'Unexpected Claude frame definition count.' }
          $sourceFrames = @(Get-ChildItem -LiteralPath $sourceDirectory.FullName -Force -File | Where-Object { $_.Extension -ieq '.png' })
          if ($sourceFrames.Count -ne 36) { throw 'Unexpected number of Claude UI frames.' }
          foreach ($frame in $sourceFrames) {
            if (-not $expectedNames.Contains($frame.Name) -or ($frame.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Unexpected Claude frame name or link.' }
          }
          $destination = Join-Path $env:AITM_TEST_ROOT 'frames/claude-file-ui'
          if (Test-Path -LiteralPath $destination) { throw 'Claude frame destination already exists.' }
          New-Item -ItemType Directory -Path $destination -ErrorAction Stop | Out-Null
          foreach ($name in ($expectedNames | Sort-Object)) {
            $sourcePath = Join-Path $sourceDirectory.FullName $name
            $stream = [IO.File]::OpenRead($sourcePath)
            try {
              $decoder = [Windows.Media.Imaging.BitmapDecoder]::Create($stream, [Windows.Media.Imaging.BitmapCreateOptions]::None, [Windows.Media.Imaging.BitmapCacheOption]::OnLoad)
              if ($decoder -isnot [Windows.Media.Imaging.PngBitmapDecoder] -or $decoder.Frames.Count -ne 1) { throw 'Expected one PNG frame.' }
              $image = $decoder.Frames[0]
              if ($name.EndsWith('-expanded.png', [StringComparison]::Ordinal)) {
                if ($image.PixelWidth -ne 590 -or $image.PixelHeight -ne 760) { throw "Unexpected expanded Claude frame: $name" }
              } elseif ($name.EndsWith('-compact.png', [StringComparison]::Ordinal)) {
                if ($image.PixelWidth -ne 390 -or $image.PixelHeight -lt 100 -or $image.PixelHeight -gt 500) { throw "Unexpected compact Claude frame: $name" }
              } else { throw 'Unexpected Claude frame layout.' }
            } finally { $stream.Dispose() }
            $destinationPath = Join-Path $destination $name
            [IO.File]::Copy($sourcePath, $destinationPath, $false)
            $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash
            $copyHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $destinationPath).Hash
            if ($sourceHash -cne $copyHash) { throw 'Copied Claude frame differs.' }
            $records.Add([pscustomobject]@{path="claude-file-ui/$name";width=$image.PixelWidth;height=$image.PixelHeight;sha256=$copyHash})
          }
          if ($records.Count -ne 60) { throw 'Unexpected total frame count.' }
          $frameRoot = Join-Path $env:AITM_TEST_ROOT 'frames'
          $records | Export-Csv -LiteralPath (Join-Path $frameRoot 'manifest.csv') -NoTypeInformation -Encoding utf8
          $artifactFiles = @(Get-ChildItem -LiteralPath $frameRoot -Recurse -File -Force)
          if ($artifactFiles.Count -ne 61 -or @($artifactFiles | Where-Object { $_.Extension -ine '.png' -and $_.FullName -cne (Join-Path $frameRoot 'manifest.csv') }).Count -ne 0) { throw 'Unexpected file in frame artifact.' }
          Write-Output 'Validated 24 tab frames and 36 Claude UI frames.'
      - name: Save synthetic comparison frames
        if: ${{ !cancelled() && steps.frames.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-tab-count-review-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitm-tab-count-audit/frames
          if-no-files-found: warn
          overwrite: false
          retention-days: 3
