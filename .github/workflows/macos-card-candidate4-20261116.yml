name: Synthetic macOS capacity regressions
on:
  push:
    branches: ['macos', 'codex/macos-kimi-scope-fix-20261116', 'codex/macos-activity-ci-20261123']
    paths: ['.github/workflows/macos-card-candidate4-20261116.yml', 'macos/**']
permissions:
  contents: read
jobs:
  isolated:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            developer: /Applications/Xcode_16.1.app/Contents/Developer
          - runner: macos-26
            developer: /Applications/Xcode.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare and verify disposable sandbox
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          task_profile_dir="$(/usr/bin/python3 -I -S -B -c 'import os,pwd; print(os.path.realpath(pwd.getpwuid(os.getuid()).pw_dir))')"
          case "$task_profile_dir" in /Users/*) ;; *) echo 'Unexpected hosted runner profile.' >&2; exit 1;; esac
          task_root="$(mktemp -d "$RUNNER_TEMP/aitm-card-tests.XXXXXXXX")"
          task_marker="$(mktemp "$RUNNER_TEMP/aitm-profile-deny.XXXXXXXX")"
          case "$task_marker" in "$task_profile_dir"/*) ;; *) echo 'Runner temp is outside expected profile.' >&2; exit 1;; esac
          printf 'synthetic-only\n' > "$task_marker"
          task_node="$(command -v node)"
          task_node_real="$(/usr/bin/python3 -I -S -B -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$task_node")"
          task_node_root="$(dirname "$(dirname "$task_node_real")")"
          task_node_bin="$(dirname "$task_node")"
          task_python=''
          for name in python3 python3.14 python3.13 python3.12 python3.11; do
            candidate="$(command -v "$name" || true)"
            if [[ "$candidate" == /* && -x "$candidate" ]] && "$candidate" -I -S -B -c 'import sys; assert (3, 11) <= sys.version_info[:2] < (3, 15)' 2>/dev/null; then task_python="$candidate"; break; fi
          done
          test -n "$task_python"
          task_python_root="$("$task_python" -I -S -B -c 'import os,sys; print(os.path.realpath(sys.base_prefix))')"
          case "$task_node_root" in /|/Users|"$task_profile_dir") echo 'Unsafe Node root.' >&2; exit 1;; esac
          case "$task_python_root" in /|/Users|"$task_profile_dir") echo 'Unsafe Python root.' >&2; exit 1;; esac
          task_path="$task_node_bin:$(dirname "$task_python"):$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin:$DEVELOPER_DIR/usr/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          mkdir -p "$task_root/source" "$task_root/template" "$task_root/hooks" "$task_root/temp" "$task_root/npm-cache" "$task_root/swift-cache" "$task_root/swift-config" "$task_root/swift-security" "$task_root/clang-cache"
          : > "$task_root/npmrc"
          git -c credential.helper= -c core.hooksPath="$task_root/hooks" -c init.templateDir="$task_root/template" init --quiet "$task_root/source"
          git -C "$task_root/source" -c credential.helper= -c core.hooksPath="$task_root/hooks" fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$task_root/source" -c core.hooksPath="$task_root/hooks" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$task_root/source" rev-parse HEAD)" = "$GITHUB_SHA"
          cat > "$task_root/profile.sb" <<'PROFILE'
          (version 1)
          (allow default)
          (deny file-read* (subpath (param "TASK_PROFILE")))
          (allow file-read-metadata)
          (allow file-read* (subpath (param "TASK_ROOT")))
          (deny mach-lookup (global-name "com.apple.bsd.dirhelper"))
          (allow file-read* (subpath (param "TASK_NODE_ROOT")))
          (allow file-read* (subpath (param "TASK_PYTHON_ROOT")))
          (deny file-write*)
          (allow file-write* (subpath (param "TASK_ROOT")))
          (allow file-write-data (literal "/dev/null") (literal "/dev/tty"))
          PROFILE
          cat "$task_root/profile.sb" > "$task_root/profile-offline.sb"
          printf '\n(deny network*)\n' >> "$task_root/profile-offline.sb"
          cat > "$task_root/run-isolated" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          task_policy="${AITM_TEST_SANDBOX_POLICY:-$AITM_TEST_TASK_ROOT/profile.sb}"
          case "$task_policy" in "$AITM_TEST_TASK_ROOT/profile.sb"|"$AITM_TEST_TASK_ROOT/profile-offline.sb") ;; *) exit 1;; esac
          exec /usr/bin/env -i "PATH=$AITM_TASK_PATH" "TMPDIR=$AITM_TEST_TASK_ROOT/temp" "DEVELOPER_DIR=$DEVELOPER_DIR" "CLANG_MODULE_CACHE_PATH=$AITM_TEST_TASK_ROOT/clang-cache" "SDKROOT=$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" XCRUN_NO_CACHE=1 \
            CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=macOS AITM_MACOS_TEST_SANDBOX=1 AITM_SYNTHETIC_REQUIRED=1 \
            "AITM_CI_DENIED_FILE=$AITM_TEST_DENIED_FILE" "AITM_MACOS_TEST_ROOT=$AITM_TEST_TASK_ROOT/temp" "AITM_SYNTHETIC_TEST_ROOT=$AITM_TEST_TASK_ROOT/temp" "NPM_CONFIG_CACHE=$AITM_TEST_TASK_ROOT/npm-cache" \
            "NPM_CONFIG_USERCONFIG=$AITM_TEST_TASK_ROOT/npmrc" NPM_CONFIG_GLOBALCONFIG=/dev/null NPM_CONFIG_UPDATE_NOTIFIER=false \
            /usr/bin/sandbox-exec -D "TASK_PROFILE=$AITM_TEST_PROFILE" -D "TASK_ROOT=$AITM_TEST_TASK_ROOT" \
              -D "TASK_NODE_ROOT=$AITM_TEST_NODE_ROOT" -D "TASK_PYTHON_ROOT=$AITM_TEST_PYTHON_ROOT" \
              -f "$task_policy" "$@"
          SCRIPT
          chmod 700 "$task_root/run-isolated"
          { printf 'AITM_TEST_TASK_ROOT=%s\n' "$task_root"; printf 'AITM_TEST_DENIED_FILE=%s\n' "$task_marker"; printf 'AITM_TEST_PROFILE=%s\n' "$task_profile_dir"; printf 'AITM_TEST_NODE_ROOT=%s\n' "$task_node_root"; printf 'AITM_TEST_PYTHON_ROOT=%s\n' "$task_python_root"; printf 'AITM_TASK_PATH=%s\n' "$task_path"; printf 'AITM_TEST_NODE_BIN=%s\n' "$task_node"; printf 'AITM_TEST_PYTHON_BIN=%s\n' "$task_python"; } >> "$GITHUB_ENV"
      - name: Verify sandbox blocks runner profile
        shell: bash
        run: |
          set -euo pipefail
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          "$task_run" /usr/bin/true
          if "$task_run" /bin/cat "$AITM_TEST_DENIED_FILE" >"$AITM_TEST_TASK_ROOT/out" 2>"$AITM_TEST_TASK_ROOT/err"; then echo 'Profile read was not denied.' >&2; exit 1; fi
          if "$task_run" /usr/bin/touch "$AITM_TEST_DENIED_FILE" >"$AITM_TEST_TASK_ROOT/out" 2>"$AITM_TEST_TASK_ROOT/err"; then echo 'Profile write was not denied.' >&2; exit 1; fi
          "$task_run" "$AITM_TEST_PYTHON_BIN" -I -S -B -c 'import os; assert "HOME" not in os.environ and "CODEX_HOME" not in os.environ'
          /bin/ln -s "$AITM_TEST_DENIED_FILE" "$AITM_TEST_TASK_ROOT/denied-link"
          if "$task_run" /bin/cat "$AITM_TEST_TASK_ROOT/denied-link" >"$AITM_TEST_TASK_ROOT/out" 2>"$AITM_TEST_TASK_ROOT/err"; then echo 'Profile read via link was not denied.' >&2; exit 1; fi
          if "$task_run" /usr/bin/touch "$AITM_TEST_TASK_ROOT/denied-link" >"$AITM_TEST_TASK_ROOT/out" 2>"$AITM_TEST_TASK_ROOT/err"; then echo 'Profile write via link was not denied.' >&2; exit 1; fi
      - name: Build synthetic regression tests
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd "$AITM_TEST_TASK_ROOT/source/macos"
          task_compiler=(/usr/bin/env -i "PATH=$AITM_TASK_PATH" "TMPDIR=$AITM_TEST_TASK_ROOT/temp" "DEVELOPER_DIR=$DEVELOPER_DIR" "CLANG_MODULE_CACHE_PATH=$AITM_TEST_TASK_ROOT/clang-cache" "SDKROOT=$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" XCRUN_NO_CACHE=1 swift)
          "${task_compiler[@]}" build --build-tests --cache-path "$AITM_TEST_TASK_ROOT/swift-cache" --config-path "$AITM_TEST_TASK_ROOT/swift-config" --security-path "$AITM_TEST_TASK_ROOT/swift-security"
          task_bin="$("${task_compiler[@]}" build --show-bin-path --cache-path "$AITM_TEST_TASK_ROOT/swift-cache" --config-path "$AITM_TEST_TASK_ROOT/swift-config" --security-path "$AITM_TEST_TASK_ROOT/swift-security")"
          test -d "$task_bin/AITaskMonitorPackageTests.xctest"
          printf 'AITM_TEST_BIN=%s\n' "$task_bin" >> "$GITHUB_ENV"
      - name: Verify Codex activity, task names and compact warnings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for suite in CodexActiveOperationTests CodexExecDiscoveryTests CompactSourceWarningTests; do
            "$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest "AITaskMonitorTests.$suite" "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"
          done
          "$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ParserTests/testActivityReadsCurrentSummaryWithoutExposingRawReasoning "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"
      - name: Verify Codex rollout selection offline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          task_policy="$AITM_TEST_TASK_ROOT/profile-offline.sb"
          AITM_TEST_SANDBOX_POLICY="$task_policy" "$task_run" "$AITM_TEST_PYTHON_BIN" -I -S -B -c 'import errno,socket; exec("try:\n s=socket.socket()\n s.connect((\"127.0.0.1\",9))\nexcept OSError as e:\n assert e.errno in (errno.EACCES,errno.EPERM), e\nelse:\n raise AssertionError(\"network was not denied\")")'
          AITM_TEST_SANDBOX_POLICY="$task_policy" "$task_run" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.CodexRolloutSelectionTests "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest" 2>&1 | tee "$AITM_TEST_TASK_ROOT/rollout-tests.log"
          if grep -Eiq 'Test Case .* skipped|[1-9][0-9]* tests? skipped' "$AITM_TEST_TASK_ROOT/rollout-tests.log"; then echo 'Rollout tests were skipped.' >&2; exit 1; fi
          grep -Eq 'Executed 38 tests?, with 0 failures' "$AITM_TEST_TASK_ROOT/rollout-tests.log"
          AITM_TEST_SANDBOX_POLICY="$task_policy" "$task_run" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.CodexExecDiscoveryTests/testUnindexedUncertainEndingsDoNotClaimSuccess "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest" 2>&1 | tee "$AITM_TEST_TASK_ROOT/unindexed-terminal-test.log"
          if grep -Eiq 'Test Case .* skipped|[1-9][0-9]* tests? skipped' "$AITM_TEST_TASK_ROOT/unindexed-terminal-test.log"; then echo 'Unindexed terminal test was skipped.' >&2; exit 1; fi
          grep -Eq 'Executed 1 tests?, with 0 failures' "$AITM_TEST_TASK_ROOT/unindexed-terminal-test.log"
          AITM_TEST_SANDBOX_POLICY="$task_policy" "$task_run" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.CodexRevertSafetyTests/testOldTerminalAndNewRevisionRetainUnconfirmedAndDoNotAffectNeighbor "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest" 2>&1 | tee "$AITM_TEST_TASK_ROOT/rollout-existing-test.log"
          if grep -Eiq 'Test Case .* skipped|[1-9][0-9]* tests? skipped' "$AITM_TEST_TASK_ROOT/rollout-existing-test.log"; then echo 'Existing rollout test was skipped.' >&2; exit 1; fi
          grep -Eq 'Executed 1 tests?, with 0 failures' "$AITM_TEST_TASK_ROOT/rollout-existing-test.log"
      - name: Verify synthetic Codex grouping
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          task_policy="$AITM_TEST_TASK_ROOT/profile-offline.sb"
          for spec in 'CodexTaskGroupingTests:10' 'CodexSubagentMetadataWorkerTests:3' 'CodexExecDiscoveryTests/testVerifiedParentIDReachesSnapshotForIndexedAndUnindexedChild:1' 'CodexExecDiscoveryTests/testIndexedChildWithConflictingParentMetadataHasNoLink:1' 'CodexExecDiscoveryTests/testThreadSourceMustAgreeWithSubagentMetadata:1' 'CodexExecDiscoveryTests/testStringSourceWithSubagentClassificationRemainsSeparate:1' 'CodexExecDiscoveryTests/testDuplicateMetadataKeysNeverCreateRelationship:1' 'CodexExecDiscoveryTests/testReplacementAtSamePathInvalidatesCachedRelationship:1' 'CodexExecDiscoveryTests/testAppendsKeepVerifiedGroupWithoutPartialWarning:1' 'CodexExecDiscoveryTests/testLargeHistoryEventuallyGroupsUnindexedChildAndRejectsConflict:1' 'CodexExecDiscoveryTests/testRewrittenHeaderOnSameInodeInvalidatesRelationship:1' 'CodexExecDiscoveryTests/testIndexedCompletedIntermediateIsDiscoveredForActiveGrandchild:1' 'CodexExecDiscoveryTests/testUnavailableOldIntermediateLeavesGrandchildSeparate:1' 'CodexExecDiscoveryTests/testTaskStoreGroupsVerifiedChildAndKeepsSelectionAndDisclosure:1'; do
            suite="${spec%:*}"
            count="${spec##*:}"
            log="$AITM_TEST_TASK_ROOT/grouping-${count}-$(printf '%s' "$suite" | /usr/bin/shasum | cut -c 1-12).log"
            AITM_TEST_SANDBOX_POLICY="$task_policy" "$task_run" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest "AITaskMonitorTests.$suite" "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest" 2>&1 | tee "$log"
            if grep -Eiq 'Test Case .* skipped|[1-9][0-9]* tests? skipped' "$log"; then echo 'Grouping test was skipped.' >&2; exit 1; fi
            grep -Eq "Executed $count tests?, with 0 failures" "$log"
          done
      - name: Render synthetic grouping preview
        id: grouping_render
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          task_policy="$AITM_TEST_TASK_ROOT/profile-offline.sb"
          AITM_TEST_SANDBOX_POLICY="$task_policy" "$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.CodexGroupingVisualTests/testRenderSyntheticGroupedParent "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest" 2>&1 | tee "$AITM_TEST_TASK_ROOT/grouping-render.log"
          if grep -Eiq 'Test Case .* skipped|[1-9][0-9]* tests? skipped' "$AITM_TEST_TASK_ROOT/grouping-render.log"; then echo 'Grouping render was skipped.' >&2; exit 1; fi
          grep -Eq 'Executed 1 tests?, with 0 failures' "$AITM_TEST_TASK_ROOT/grouping-render.log"
      - name: Save synthetic grouping preview
        if: ${{ !cancelled() && steps.grouping_render.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: codex-grouping-synthetic-preview-${{ matrix.runner }}
          path: ${{ runner.temp }}/aitm-card-tests.*/temp/grouping-renders/*.png
          if-no-files-found: error
      - name: Check guard skips without hosted test fixture
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$AITM_TEST_TASK_ROOT/run-isolated" /usr/bin/env -u AITM_SYNTHETIC_REQUIRED -u AITM_SYNTHETIC_TEST_ROOT -u AITM_CI_DENIED_FILE "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testV2CapacityWarningSurvivesScopeRemovalReconnectAndRestart "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest" 2>&1 | tee "$AITM_TEST_TASK_ROOT/expected-skip.log"
          grep -q 'skipped' "$AITM_TEST_TASK_ROOT/expected-skip.log"
      - name: Check required guard rejects missing marker
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if "$AITM_TEST_TASK_ROOT/run-isolated" /usr/bin/env -u AITM_CI_DENIED_FILE "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testV2CapacityWarningSurvivesScopeRemovalReconnectAndRestart "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest" >"$AITM_TEST_TASK_ROOT/expected-rejection.log" 2>&1; then
            echo 'Missing marker unexpectedly passed.' >&2
            exit 1
          fi
          grep -q 'unsafeEnvironment' "$AITM_TEST_TASK_ROOT/expected-rejection.log"
      - name: Run synthetic Kimi capacity regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testVisibleKimiCardSurvivesCapacityAndLateTerminal "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Run synthetic V1 warning regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testV1CapacityWarningSurvivesUnavailableAndReconnect "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Run synthetic V2 warning regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testV2CapacityWarningSurvivesScopeRemovalReconnectAndRestart "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Run synthetic TaskStore warning regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testTaskStoreKeepsCapacityWarningAfterPartialAndReconnect "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Run synthetic scope isolation regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testCapacityLossInScopeADoesNotUnconfirmScopeB "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Run synthetic Hermes restart regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testHermesWaitsForAnObserverStartedAfterMonitoring "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Run synthetic Kimi temporary scan regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testKimiTemporaryInspectionFailureRetainsCardUntilExplicitDisconnect "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Run synthetic partial scope retention regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testPartialScopeKeepsPriorCardAndHealthyNeighbourAfterReconnect "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Run synthetic Hermes scope isolation regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testReclaimingHermesTerminalDoesNotDegradeOtherScope "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Check bounded V2 warning history
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testV2WarningHistoryStaysBoundedAndSignalsUntrackedScopes "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Check bounded visible task preservation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testTaskStoreBoundKeepsVisibleNeighbourBeforeUnseenTasks "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Check full and partial warnings in both languages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testFullAndPartialAvailabilityMessagesStayDistinctInBothLanguages "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Check Hermes late observer and terminal behavior
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testHermesLateEventAndConfirmedTerminalDoNotReviveOldCard "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Check DeepSeek warning attribution through reconnect
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testDeepSeekCapacityWarningFollowsAffectedScopeThroughDisableAndReconnect "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Check partial loss with no visible tasks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testConnectedScopeWithoutCardsStillReportsPartialLoss "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Check Kimi scope change and explicit disconnect
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testKimiScopeChangeRetainsObservedCardUntilExplicitDisconnect "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Check Hermes scope change and healthy neighbour
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testHermesScopeChangeKeepsHealthyNeighbourAndReportsUncertainty "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Check existing in-memory provider suites
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for suite in ExternalProviderStateTests ExternalProviderTaskMapperTests ExternalProviderFilterTests ExternalProviderV2BrokerTests V1ProtectionTests NeutralTerminalTransitionTests HermesObserverStateTests; do
            "$AITM_TEST_TASK_ROOT/run-isolated" /usr/bin/env "AITM_HERMES_PYTHON=$AITM_TEST_PYTHON_BIN" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest "AITaskMonitorTests.$suite" "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"
          done
      - name: Render synthetic availability states
        id: render
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: '"$AITM_TEST_TASK_ROOT/run-isolated" "$DEVELOPER_DIR/usr/bin/xctest" -XCTest AITaskMonitorTests.ExternalCapacityRegressionTests/testRenderExistingWarningForFullAndPartialSources "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest"'
      - name: Save synthetic availability renders
        if: ${{ !cancelled() && steps.render.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-kimi-scope-${{ matrix.runner }}
          path: ${{ runner.temp }}/aitm-card-tests.*/temp/render-*/renders/*.png
          if-no-files-found: error
          retention-days: 30
