          (cd "$task_source/dist" && /usr/bin/shasum -a 256 -c SHA256SUMS-macOS.txt)
          /bin/cp "$task_root/validated-app/AI Task Monitor.app.zip" "$task_root/release-artifacts/AI Task Monitor.app.zip"
          /bin/cp "$task_dmg" "$task_source/dist/SHA256SUMS-macOS.txt" "$task_root/release-artifacts/"
          (cd "$task_root/release-artifacts" && /usr/bin/shasum -a 256 'AI Task Monitor.app.zip' >> SHA256SUMS-macOS.txt && /usr/bin/shasum -a 256 -c SHA256SUMS-macOS.txt)
          printf '%s\n' "$GITHUB_SHA" > "$task_root/release-artifacts/source-commit.txt"
          (cd "$AITM_TEST_CONTROL_ROOT" && /usr/bin/shasum -a 256 -c controls.sha256)
      - name: Save isolated macOS candidate
        if: ${{ !cancelled() && steps.dmg_candidate.outcome == 'success' && matrix.runner == 'macos-15' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-0.3.13-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/aitm-card-tests.*/release-artifacts/*
          if-no-files-found: error
          retention-days: 7
      - name: Verify control files after the job
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AITM_TEST_CONTROL_ROOT:-}"
          cd "$AITM_TEST_CONTROL_ROOT"
          /usr/bin/shasum -a 256 -c controls.sha256
      - name: Detach synthetic control image
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AITM_TEST_CONTROL_ROOT:-}"
          case "$AITM_TEST_CONTROL_ROOT" in /Users/runner/work/_temp/aitm-card-control.*/mount) ;; *) exit 1;; esac
          /usr/bin/hdiutil detach "$AITM_TEST_CONTROL_ROOT"
