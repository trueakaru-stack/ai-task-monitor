name: macOS synthetic scroll layout variants

on:
  workflow_dispatch:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-scroll-variants-audit.yml"
      - ".github/audits/ScrollVariantProbe.swift"
      - ".github/audits/ScrollVariantAuditTests.swift"
      - ".github/audits/generate-scroll-variant.py"

permissions:
  contents: read

jobs:
  scroll-variants:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[tests-only]') && contains(github.event.head_commit.message, '[scroll-variants-audit]')) }}
    name: synthetic scroll variants (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout the audit tools
        uses: actions/checkout@v4
        with:
          path: audit-control
      - name: Checkout the pinned application source
        uses: actions/checkout@v4
        with:
          ref: 835ad09e98efb59546a8b850b8b8c2777323b581
          path: pinned-source
      - name: Select Xcode for macOS 15
        if: ${{ matrix.runner == 'macos-15' }}
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      - name: Render isolated variants
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          status=0
          for variant in baseline outer clip outer-clip; do
            project="$RUNNER_TEMP/aitm-scroll-code-$variant"
            output="$RUNNER_TEMP/aitm-layout-scroll-$variant"
            test ! -e "$project"
            mkdir -p "$project" "$output"
            cp -R "$GITHUB_WORKSPACE/pinned-source/macos/." "$project/"
            cp "$GITHUB_WORKSPACE/audit-control/.github/audits/ScrollVariantProbe.swift" "$project/Sources/AITaskMonitor/"
            cp "$GITHUB_WORKSPACE/audit-control/.github/audits/ScrollVariantAuditTests.swift" "$project/Tests/AITaskMonitorTests/"
            if ! python3 "$GITHUB_WORKSPACE/audit-control/.github/audits/generate-scroll-variant.py" "$project" "$variant" "$output"; then
              status=1
              continue
            fi
            if diff -u "$GITHUB_WORKSPACE/pinned-source/macos/Sources/AITaskMonitor/RootView.swift" "$project/Sources/AITaskMonitor/RootView.swift" > "$output/root-layout.patch"; then
              :
            else
              test "$?" -eq 1 || status=1
            fi
            export AITM_LAYOUT_SYNTHETIC_CI=1
            export AITM_LAYOUT_SYNTHETIC_ROOT="$output"
            export AITM_SCROLL_VARIANT="$variant"
            if ! (cd "$project" && swift test --filter ScrollVariantAuditTests); then status=1; fi
            test -s "$output/scroll-variant-geometry.json" || status=1
          done
          exit "$status"
      - name: Document audit scope
        if: ${{ always() }}
        shell: bash
        run: |
          printf '%s\n' 'Synthetic layout experiments only; no source changes were integrated, no installer was built, and the full reconnect regression was not run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload synthetic geometry and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-scroll-variants-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/aitm-layout-scroll-*/
          if-no-files-found: warn
          retention-days: 7
