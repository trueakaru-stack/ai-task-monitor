name: Synthetic provider capacity regression
on:
  push:
    branches: ['codex/windows-provider-capacity-20261116']
permissions:
  contents: read
jobs:
  capacity:
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Test scoped capacity loss on a disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CI -cne 'true' -or $env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:DOTNET_ADD_GLOBAL_TOOLS_TO_PATH -cne '0') { throw 'Disposable hosted Windows runner required.' }
          function Read-PathState([string]$scope) {
            $key = if ($scope -eq 'User') { [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $false) }
                   else { [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SYSTEM\CurrentControlSet\Control\Session Manager\Environment', $false) }
            try { return [pscustomobject]@{ Value=[string]$key.GetValue('Path','',[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames); Kind=[string]$key.GetValueKind('Path') } }
            finally { $key.Dispose() }
          }
          $beforeUser = Read-PathState 'User'
          $beforeMachine = Read-PathState 'Machine'
          try {
            $root = Join-Path $env:RUNNER_TEMP ('aitm-provider-capacity-' + [guid]::NewGuid().ToString('N'))
            $source = Join-Path $root 'source'
            $template = Join-Path $root 'template'
            $hooks = Join-Path $root 'hooks'
            foreach ($path in @($source,$template,$hooks)) { $null = [IO.Directory]::CreateDirectory($path) }
            git -c credential.helper= -c core.hooksPath="$hooks" -c init.defaultBranch=fixture init --quiet --template="$template" "$source"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize source checkout.' }
            git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" fetch --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the exact revision.' }
            git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" checkout --quiet --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot check out the exact revision.' }
            $sdkCommand = Get-Command dotnet.exe -CommandType Application | Select-Object -First 1
            if ($null -eq $sdkCommand) { throw 'The SDK is unavailable.' }
            $sdk = Split-Path -Parent $sdkCommand.Source
            foreach ($name in @('profile','appdata','localappdata','temp','nuget','dotnet','artifacts')) {
              $null = [IO.Directory]::CreateDirectory((Join-Path $root $name))
            }
            $config = Join-Path $root 'NuGet.Config'
            [IO.File]::WriteAllText($config, '<configuration><packageSources><clear /></packageSources></configuration>', [Text.UTF8Encoding]::new($false))
            function Invoke-Isolated([string]$executable, [string[]]$arguments) {
              $info = [Diagnostics.ProcessStartInfo]::new()
              $info.FileName = $executable
              $info.WorkingDirectory = $root
              $info.UseShellExecute = $false
              $info.CreateNoWindow = $true
              $info.RedirectStandardOutput = $true
              $info.RedirectStandardError = $true
              foreach ($argument in $arguments) { $null = $info.ArgumentList.Add($argument) }
              $info.Environment.Clear()
              $values = @{
                SystemRoot=$env:SystemRoot; windir=$env:SystemRoot
                PATH=($sdk + ';' + (Join-Path $env:SystemRoot 'System32') + ';' + $env:SystemRoot)
                DOTNET_ROOT=$sdk; DOTNET_MULTILEVEL_LOOKUP='0'; DOTNET_ADD_GLOBAL_TOOLS_TO_PATH='0'
                DOTNET_CLI_HOME=(Join-Path $root 'dotnet'); DOTNET_CLI_TELEMETRY_OPTOUT='1'
                DOTNET_GENERATE_ASPNET_CERTIFICATE='0'; DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE='1'
                NUGET_PACKAGES=(Join-Path $root 'nuget'); USERPROFILE=(Join-Path $root 'profile')
                APPDATA=(Join-Path $root 'appdata'); LOCALAPPDATA=(Join-Path $root 'localappdata')
                TEMP=(Join-Path $root 'temp'); TMP=(Join-Path $root 'temp')
              }
              foreach ($name in @('ProgramFiles','ProgramFiles(x86)','ProgramW6432','ProgramData','ALLUSERSPROFILE','SystemDrive','ComSpec')) {
                $value = [Environment]::GetEnvironmentVariable($name)
                if (-not [string]::IsNullOrEmpty($value)) { $values[$name] = $value }
              }
              foreach ($key in $values.Keys) { $info.Environment[$key] = [string]$values[$key] }
              $process = [Diagnostics.Process]::Start($info)
              try {
                $stdout = $process.StandardOutput.ReadToEndAsync()
                $stderr = $process.StandardError.ReadToEndAsync()
                if (-not $process.WaitForExit(120000)) { $process.Kill($true); throw 'An isolated provider check timed out.' }
                if ($stdout.Result) { Write-Output $stdout.Result.TrimEnd() }
                if ($stderr.Result) { Write-Output $stderr.Result.TrimEnd() }
                if ($process.ExitCode -ne 0) { throw ('The isolated provider check failed: ' + $process.ExitCode) }
              } finally { $process.Dispose() }
            }
            $dotnet = Join-Path $sdk 'dotnet.exe'
            $project = Join-Path $source 'windows/native/Tests/ProviderCapacity/ProviderCapacity.Tests.csproj'
            $artifacts = Join-Path $root 'artifacts'
            Invoke-Isolated $dotnet @('build',$project,'-c','Release','--configfile',$config,'--artifacts-path',$artifacts,'-p:NuGetAudit=false','--nologo')
            $assembly = Join-Path $artifacts 'bin/ProviderCapacity.Tests/release/AITaskMonitor.ProviderCapacity.Tests.dll'
            Invoke-Isolated $dotnet @($assembly)
            $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
            foreach ($file in @('Test-ExternalProviderState.ps1','Test-ExternalProviderCapacityRuntime.ps1')) {
              Invoke-Isolated $powershell @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',(Join-Path $source ("windows/tests/" + $file)))
            }
            python -B (Join-Path $source 'windows/tests/Test-DotnetPathSafety.py')
            if ($LASTEXITCODE -ne 0) { throw 'The launcher safety check failed.' }
          } finally {
            foreach ($scope in @('User','Machine')) {
              $before = if ($scope -eq 'User') { $beforeUser } else { $beforeMachine }
              $after = Read-PathState $scope
              if ($after.Value -cne $before.Value -or $after.Kind -cne $before.Kind) { throw "$scope PATH changed during the synthetic provider checks." }
            }
          }
