name: Publish verified Windows 0.2.11
on:
  push:
    branches: [codex/windows-publish-v0211-20261118]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify source and upload release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="trueakaru-stack/ai-task-monitor"
          source="42825705eb131b12102763ad2b3eb120ef9cdcb1"
          prior="5fedcb3d6ecb0ec566faae55fcb7a5d4675246f9"
          run_id="44296680803"
          ci_head="bda88f438f26a0129c820267420c30420871e077"
          behavior_run="44293637861"
          behavior_head="52b7e1f7ff626f9fb843f8012e7f2009218576eb"
          artifact_id="14425005213"
          artifact_sha="e69e72066d7d930b8d1bad63ab20476010bf5722012d5f7a14f7ae711ac43dcd"
          installer_sha="968930fa2a6ebb2f59389b1905f8f1fec76686b68150a41d18acc3df26617939"
          tag="v0.2.11"
          test "$GITHUB_REPOSITORY" = "$repo"
          test "$(gh api "repos/$repo/actions/runs/$run_id" --jq .status)" = "completed"
          test "$(gh api "repos/$repo/actions/runs/$run_id" --jq .conclusion)" = "success"
          test "$(gh api "repos/$repo/actions/runs/$run_id" --jq .head_sha)" = "$ci_head"
          test "$(gh api "repos/$repo/actions/runs/$run_id" --jq .path)" = ".github/workflows/windows-installer-0211-ci.yml"
          test "$(gh api "repos/$repo/actions/runs/$behavior_run" --jq .conclusion)" = "success"
          test "$(gh api "repos/$repo/actions/runs/$behavior_run" --jq .head_sha)" = "$behavior_head"
          test "$(gh api "repos/$repo/git/commits/$source" --jq '.parents[0].sha')" = "$prior"
          test "$(gh api "repos/$repo/git/ref/heads/windows" --jq .object.sha)" = "$source"
          test "$(gh api "repos/$repo/contents/screenshots/compact-dark.png?ref=main" --jq .sha)" = "af7aead41d77aa57557fb18d771025a32f0d9114"
          test "$(gh api "repos/$repo/contents/screenshots/compact-light.png?ref=main" --jq .sha)" = "e890376fa2a2a88b992a4fc76cd0c1850da99a33"
          artifact="$(gh api "repos/$repo/actions/artifacts/$artifact_id")"
          test "$(jq -r .workflow_run.id <<<"$artifact")" = "$run_id"
          test "$(jq -r .workflow_run.head_sha <<<"$artifact")" = "$ci_head"
          test "$(jq -r .name <<<"$artifact")" = "verified-windows-0211-$source"
          test "$(jq -r .digest <<<"$artifact")" = "sha256:$artifact_sha"
          test "$(jq -r .expired <<<"$artifact")" = "false"
          archive="$RUNNER_TEMP/windows-0211-artifact.zip"
          gh api "repos/$repo/actions/artifacts/$artifact_id/zip" > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$artifact_sha"
          printf '%s\n' AITaskMonitorSetup-0.2.11.exe SHA256SUMS-windows-0.2.11.txt SOURCE-REVISION.txt | LC_ALL=C sort > "$RUNNER_TEMP/expected-files"
          unzip -Z1 "$archive" | LC_ALL=C sort > "$RUNNER_TEMP/artifact-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/artifact-files"
          mkdir "$RUNNER_TEMP/windows-release"
          unzip -q "$archive" -d "$RUNNER_TEMP/windows-release"
          cd "$RUNNER_TEMP/windows-release"
          test "$(tr -d '\r\n' < SOURCE-REVISION.txt)" = "$source"
          test "$(sha256sum AITaskMonitorSetup-0.2.11.exe | cut -d' ' -f1)" = "$installer_sha"
          test "$(tr -d '\r\n' < SHA256SUMS-windows-0.2.11.txt)" = "$installer_sha  AITaskMonitorSetup-0.2.11.exe"
          cp SHA256SUMS-windows-0.2.11.txt SHA256SUMS-windows.txt
          checksum_sha="$(sha256sum SHA256SUMS-windows.txt | cut -d' ' -f1)"
          gh api --paginate "repos/$repo/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/existing-release-tags"
          if grep -Fxq "$tag" "$RUNNER_TEMP/existing-release-tags"; then echo "Release or draft already exists"; exit 1; fi
          if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then echo "Tag already exists"; exit 1; fi
          if gh api "repos/$repo/releases/tags/$tag" >/dev/null 2>&1; then echo "Release already exists"; exit 1; fi
          previous_latest="$(gh api "repos/$repo/releases/latest" --jq .tag_name)"
          gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$source" >/dev/null
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)" = "$source"
          notes="$(printf '%s\n\n%s' 'В компактном режиме для точек переключения задач задан курсор-указатель.' 'A pointing cursor is assigned to the task selector dots in compact mode.')"
          gh api --method POST "repos/$repo/releases" -f tag_name="$tag" -f name="AI Task Monitor 0.2.11 — Windows" -f body="$notes" -F draft=true -F prerelease=false -f make_latest=false > "$RUNNER_TEMP/draft-release.json"
          release_id="$(jq -er .id "$RUNNER_TEMP/draft-release.json")"
          echo "DRAFT_RELEASE_ID=$release_id"
          upload_base="https://uploads.github.com/repos/$repo/releases/$release_id/assets"
          test "$(jq -r .upload_url "$RUNNER_TEMP/draft-release.json")" = "$upload_base{?name,label}"
          for asset in AITaskMonitorSetup-0.2.11.exe SHA256SUMS-windows.txt; do
            curl --fail --silent --show-error --proto '=https' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$asset" "$upload_base?name=$asset" > "$RUNNER_TEMP/upload-$asset.json"
            jq -e --arg name "$asset" '.name == $name and .state == "uploaded"' "$RUNNER_TEMP/upload-$asset.json" >/dev/null
          done
          gh api "repos/$repo/releases/$release_id" > "$RUNNER_TEMP/draft-check.json"
          jq -e --arg tag "$tag" '.tag_name == $tag and .draft == true and .prerelease == false and (.assets | length) == 2' "$RUNNER_TEMP/draft-check.json" >/dev/null
          jq -e --arg sha "sha256:$installer_sha" '[.assets[] | select(.name == "AITaskMonitorSetup-0.2.11.exe" and .state == "uploaded" and .size == 1426944 and .digest == $sha)] | length == 1' "$RUNNER_TEMP/draft-check.json" >/dev/null
          jq -e --arg sha "sha256:$checksum_sha" '[.assets[] | select(.name == "SHA256SUMS-windows.txt" and .state == "uploaded" and .digest == $sha)] | length == 1' "$RUNNER_TEMP/draft-check.json" >/dev/null
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)" = "$source"
          test "$(gh api "repos/$repo/git/ref/heads/windows" --jq .object.sha)" = "$source"
          gh api --method PATCH "repos/$repo/releases/$release_id" -F draft=false -f make_latest=false > "$RUNNER_TEMP/published.json"
          jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false and .prerelease == false and (.assets | length) == 2' "$RUNNER_TEMP/published.json" >/dev/null
          test "$(gh api "repos/$repo/releases/latest" --jq .tag_name)" = "$previous_latest"
          echo "Published https://github.com/$repo/releases/tag/$tag"
