name: Windows installer upgrade safety
on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-installer-upgrade-*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
    steps:
      - name: Fetch exact source and test installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:RUNNER_TEMP ('aitm-upgrade-source-' + [guid]::NewGuid().ToString('N'))
          $source = Join-Path $sourceRoot 'source'
          $template = Join-Path $sourceRoot 'template'
          $hooks = Join-Path $sourceRoot 'hooks'
          New-Item -ItemType Directory -Path $source, $template, $hooks | Out-Null
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = Join-Path $sourceRoot 'empty.gitconfig'
          [IO.File]::WriteAllText($env:GIT_CONFIG_GLOBAL, '')
          $env:GIT_TERMINAL_PROMPT = '0'
          git -c credential.helper= -c core.hooksPath="$hooks" -c init.defaultBranch=fixture init --quiet --template="$template" "$source"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize checkout.' }
          git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" fetch --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the requested source.' }
          git -C "$source" -c core.hooksPath="$hooks" checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C "$source" rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Unexpected source revision.' }
          $interpreter = (Get-Command python.exe -CommandType Application -ErrorAction Stop).Source
          if ($interpreter -match '(?i)\\WindowsApps\\') { throw 'Python installer aliases are not supported.' }
          $version = & $interpreter --version 2>&1
          if ($LASTEXITCODE -ne 0 -or "$version" -notmatch '^Python 3\.') { throw 'A verified Python 3 interpreter is required.' }
          & $interpreter -B (Join-Path $source 'windows/tests/Test-DotnetPathSafety.py')
          if ($LASTEXITCODE -ne 0) { throw '.NET PATH safety check failed.' }
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $test = Join-Path $sourceRoot 'Test-SafeInstallSwap.exe'
          & $compiler /nologo /target:exe /reference:System.Web.Extensions.dll /reference:System.Management.dll "/out:$test" `
              (Join-Path $source 'windows/app/SafeInstallPaths.cs') `
              (Join-Path $source 'windows/app/SafeInstallSwap.cs') `
              (Join-Path $source 'windows/app/MonitorProcessCheck.cs') `
              (Join-Path $source '.github/legacy-uninstall-ci/Test-SafeInstallSwap.cs')
          if ($LASTEXITCODE -ne 0) { throw 'Installer regression harness did not compile.' }
          & $test
          if ($LASTEXITCODE -ne 0) { throw 'Installer regression harness failed.' }
          & (Join-Path $source '.github/legacy-uninstall-ci/Test-InstallerAndRemoval.ps1')
      - name: Save verified installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-windows-installer-${{ github.sha }}
          path: ${{ runner.temp }}/aitm-verified-setup-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
      - name: Save installer dialog screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer-dialogs-${{ github.sha }}
          path: ${{ runner.temp }}/aitm-dialogs-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
