name: Isolated macOS image diagnostic
on:
  push:
    branches: ['codex/macos-activity-ci-20261123']
    paths: ['.github/workflows/macos-hdiutil-diagnostic-20261123.yml']
permissions:
  contents: read
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            developer: /Applications/Xcode_16.1.app/Contents/Developer
          - runner: macos-26
            developer: /Applications/Xcode.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      AITM_IMAGE_SOURCE_SHA: b709ae6992e963fbf81f75aad115f8c3c9708c1f
      DEVELOPER_DIR: ${{ matrix.developer }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check hdiutil on disposable fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          case "$RUNNER_TEMP" in /Users/runner/*) ;; *) exit 1;; esac
          task_root="$(/usr/bin/mktemp -d "$RUNNER_TEMP/aitm-image-check.XXXXXXXX")"
          marker="$(/usr/bin/mktemp "$RUNNER_TEMP/aitm-image-profile.XXXXXXXX")"
          printf 'synthetic-marker\n' > "$marker"
          mkdir -p "$task_root/source" "$task_root/template" "$task_root/hooks" "$task_root/temp" "$task_root/synthetic-home" "$task_root/logs"
          cd "$task_root"
          task_git=(/usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null /usr/bin/git)
          "${task_git[@]}" -c credential.helper= -c core.hooksPath="$task_root/hooks" -c init.templateDir="$task_root/template" init --quiet "$task_root/source"
          "${task_git[@]}" -C "$task_root/source" -c credential.helper= -c core.hooksPath="$task_root/hooks" fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$AITM_IMAGE_SOURCE_SHA"
          "${task_git[@]}" -C "$task_root/source" -c core.hooksPath="$task_root/hooks" checkout --quiet --detach FETCH_HEAD
          test "$("${task_git[@]}" -C "$task_root/source" rev-parse HEAD)" = "$AITM_IMAGE_SOURCE_SHA"
          cat > "$task_root/profile.sb" <<'PROFILE'
          (version 1)
          (allow default)
          (deny file-read* (subpath (param "TASK_PROFILE")))
          (allow file-read-metadata)
          (allow file-read* (subpath (param "TASK_ROOT")))
          (deny mach-lookup (global-name "com.apple.bsd.dirhelper"))
          (deny file-write*)
          (allow file-write* (subpath (param "TASK_ROOT")))
          (allow file-write-data (literal "/dev/null") (literal "/dev/tty"))
          (deny network*)
          PROFILE
          run_isolated() {
            /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin "TMPDIR=$task_root/temp/" \
              "CFFIXED_USER_HOME=$task_root/synthetic-home" "DEVELOPER_DIR=$DEVELOPER_DIR" XCRUN_NO_CACHE=1 \
              /usr/bin/sandbox-exec -D TASK_PROFILE=/Users/runner -D "TASK_ROOT=$task_root" -f "$task_root/profile.sb" "$@"
          }
          /bin/cat "$marker" >/dev/null
          /bin/ln -s "$marker" "$task_root/denied-link"
          for probe in "$marker" "$task_root/denied-link"; do
            if run_isolated /bin/cat "$probe" >/dev/null 2>&1 || run_isolated /usr/bin/touch "$probe" >/dev/null 2>&1; then
              echo 'Profile access unexpectedly allowed.' >&2; exit 1
            fi
          done
          run_isolated /usr/bin/touch "$task_root/temp/allowed-write"
          /usr/bin/env node -e 'const n=require("node:net"),f=require("node:fs");n.createServer(c=>c.end()).listen(0,"127.0.0.1",function(){f.writeFileSync(process.argv[1],String(this.address().port))})' "$task_root/port" &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
          for attempt in {1..100}; do test -s "$task_root/port" && break; sleep 0.1; done
          test -s "$task_root/port"
          port="$(cat "$task_root/port")"
          [[ "$port" =~ ^[0-9]{1,5}$ ]]
          /usr/bin/nc -vz -G 2 127.0.0.1 "$port"
          if run_isolated /usr/bin/nc -vz -G 2 127.0.0.1 "$port" >"$task_root/network.log" 2>&1; then
            echo 'Network unexpectedly allowed.' >&2; exit 1
          fi
          grep -Eiq 'operation not permitted|permission denied' "$task_root/network.log"
          kill "$server"; wait "$server" 2>/dev/null || true; trap - EXIT
          mkdir -p "$task_root/temp/plain-stage" "$task_root/temp/link-stage" "$task_root/temp/app-stage/AI Task Monitor.app/Contents/MacOS" "$task_root/temp/app-stage/AI Task Monitor.app/Contents/Resources/integrations/kimi-plugin"
          printf 'synthetic\n' > "$task_root/temp/plain-stage/example.txt"
          printf 'synthetic\n' > "$task_root/temp/link-stage/example.txt"
          /bin/ln -s /Applications "$task_root/temp/link-stage/Applications"
          /bin/ln -s /Applications "$task_root/temp/app-stage/Applications"
          task_app="$task_root/temp/app-stage/AI Task Monitor.app"
          /bin/cp "$task_root/source/macos/Info.plist" "$task_app/Contents/Info.plist"
          /bin/cp /usr/bin/true "$task_app/Contents/MacOS/AITaskMonitor"
          /bin/cp "$task_root/source/.github/macos-icon-fallback-20261123/AppIcon.icns" "$task_app/Contents/Resources/AppIcon.icns"
          for file in opencode-entry.js provider-events.mjs provider-observers.mjs provider-transport.mjs provider-v2-sender.mjs deepseek-integration.mjs deepseek-setup.mjs deepseek-plugin.js kimi-integration.mjs kimi-setup.mjs package.json cordis.patch.yml hermes-setup.py hermes-manager.py ruamel.yaml-0.18.16-py3-none-any.whl ruamel.yaml-LICENSE.txt provider_bundle.py hermes-entry.py hermes-plugin.yaml hermes_observer.py provider_hooks.py provider_sender.py provider_transport.py; do
            /bin/cp "$task_root/source/macos/integrations/$file" "$task_app/Contents/Resources/integrations/$file"
          done
          for file in kimi.plugin.json kimi-hook.mjs kimi-observer.mjs provider-transport.mjs; do
            /bin/cp "$task_root/source/macos/integrations/kimi-plugin/$file" "$task_app/Contents/Resources/integrations/kimi-plugin/$file"
          done
          run_isolated /usr/bin/codesign --force --deep --sign - "$task_app"
          run_isolated /usr/bin/codesign --verify --deep --strict --verbose=2 "$task_app"
          for mode in plain link app app-hfs; do
            case "$mode" in
              plain) stage="$task_root/temp/plain-stage";;
              link) stage="$task_root/temp/link-stage";;
              app|app-hfs) stage="$task_root/temp/app-stage";;
            esac
            args=(create -debug -volname 'AI Task Monitor' -srcfolder "$stage" -ov -format UDZO)
            if test "$mode" = app-hfs; then args+=(-fs HFS+); fi
            echo "hdiutil diagnostic: $mode"
            if run_isolated /usr/bin/hdiutil "${args[@]}" "$task_root/temp/$mode.dmg" >"$task_root/logs/$mode.log" 2>&1; then
              test -s "$task_root/temp/$mode.dmg"
              echo "$mode: created"
            else
              echo "$mode: failed"
            fi
            tail -n 50 "$task_root/logs/$mode.log"
          done
          # This diagnostic changes only an image in the disposable task directory.
          # It never authorizes writes to raw disk devices or changes the installer.
          run_logged() {
            local name="$1"; shift
            echo "Running $name"
            if ! run_isolated "$@" >"$task_root/logs/$name.log" 2>&1; then
              cat "$task_root/logs/$name.log" >&2
              return 1
            fi
          }
          check_mount() {
            local plist="$1" expected="$2" index value found=false
            for index in {0..15}; do
              value="$(/usr/libexec/PlistBuddy -c "Print :system-entities:$index:mount-point" "$plist" 2>/dev/null || true)"
              if test "$value" = "$expected"; then found=true; fi
            done
            test "$found" = true
            test -d "$expected/AI Task Monitor.app"
            test ! -L "$expected/AI Task Monitor.app"
            test -L "$expected/Applications"
            test "$(/usr/bin/readlink "$expected/Applications")" = /Applications
          }
          # The hybrid has no free blocks by default. Reserve disposable space
          # in the synthetic staging directory before creating the image.
          run_logged create-padding /bin/dd if=/dev/zero of="$task_root/temp/app-stage/.aitm-padding" bs=1048576 count=16
          test "$(run_isolated /usr/bin/stat -f %z "$task_root/temp/app-stage/.aitm-padding")" = 16777216
          run_logged hybrid /usr/bin/hdiutil makehybrid -hfs -hfs-volume-name 'AI Task Monitor' \
            -o "$task_root/temp/hybrid.dmg" "$task_root/temp/app-stage"
          test -s "$task_root/temp/hybrid.dmg"
          run_logged convert-rw /usr/bin/hdiutil convert "$task_root/temp/hybrid.dmg" -format UDRW \
            -o "$task_root/temp/hybrid-rw.dmg"
          test -s "$task_root/temp/hybrid-rw.dmg"
          rw_mount="$task_root/temp/hybrid-rw-mount"
          mkdir "$rw_mount"
          trap 'run_isolated /usr/bin/hdiutil detach "$rw_mount" >/dev/null 2>&1 || true' EXIT
          run_logged attach-rw /usr/bin/hdiutil attach -plist -readwrite -nobrowse -noautoopen \
            -mountpoint "$rw_mount" "$task_root/temp/hybrid-rw.dmg"
          check_mount "$task_root/logs/attach-rw.log" "$rw_mount"
          rw_app="$rw_mount/AI Task Monitor.app"
          test -z "$(run_isolated /usr/bin/find "$rw_app" -type l -print -quit)"
          test -f "$rw_mount/.aitm-padding"
          test ! -L "$rw_mount/.aitm-padding"
          test "$(run_isolated /usr/bin/stat -f %z "$rw_mount/.aitm-padding")" = 16777216
          run_logged free-before /bin/df -Pk "$rw_mount"
          run_logged truncate-padding /bin/sh -c ': > "$1"' sh "$rw_mount/.aitm-padding"
          test "$(run_isolated /usr/bin/stat -f %z "$rw_mount/.aitm-padding")" = 0
          run_logged free-after /bin/df -Pk "$rw_mount"
          free_kb="$(/usr/bin/awk 'END {print $4}' "$task_root/logs/free-after.log")"
          [[ "$free_kb" =~ ^[0-9]+$ ]]
          test "$free_kb" -ge 1024
          echo "Freed image space: $free_kb KiB available."
          # Test Apple's per-volume marker only on the verified synthetic mount.
          # Refuse to modify existing entries from any other source.
          event_dir="$rw_mount/.fseventsd"
          if test -e "$event_dir" || test -L "$event_dir"; then
            test -d "$event_dir"
            test ! -L "$event_dir"
            run_logged list-rw-fsevents-before /bin/ls -la "$event_dir"
            cat "$task_root/logs/list-rw-fsevents-before.log"
            test -z "$(run_isolated /usr/bin/find -P "$event_dir" -xdev -mindepth 1 -maxdepth 1 -print -quit)"
          else
            run_isolated /bin/mkdir "$event_dir"
          fi
          image_device="$(run_isolated /usr/bin/stat -f %d "$rw_mount")"
          test "$(run_isolated /usr/bin/stat -f %d "$event_dir")" = "$image_device"
          test ! -L "$event_dir/no_log"
          run_isolated /usr/bin/touch "$event_dir/no_log"
          test "$(run_isolated /usr/bin/stat -f %z "$event_dir/no_log")" = 0
          test "$(run_isolated /usr/bin/stat -f %d "$event_dir/no_log")" = "$image_device"
          run_isolated /bin/rm "$rw_mount/.aitm-padding"
          test ! -e "$rw_mount/.aitm-padding"
          run_isolated /usr/bin/touch "$rw_mount/.aitm-write-probe"
          run_isolated /bin/rm "$rw_mount/.aitm-write-probe"
          if run_isolated /usr/bin/codesign --verify --deep --strict --verbose=2 "$rw_app" >"$task_root/logs/signature-before.log" 2>&1; then
            echo 'The mounted synthetic app unexpectedly passed the negative control.' >&2; exit 1
          fi
          if ! grep -F 'Disallowed xattr com.apple.FinderInfo' "$task_root/logs/signature-before.log" >/dev/null; then
            cat "$task_root/logs/signature-before.log" >&2; exit 1
          fi
          run_isolated /usr/bin/find "$rw_app" -xdev \( -type f -o -type d \) -print0 >"$task_root/temp/mounted-entries"
          count=0
          while IFS= read -r -d '' entry; do
            case "$entry" in "$rw_app"|"$rw_app"/*) ;; *) echo 'Entry escaped the verified mount.' >&2; exit 1;; esac
            if run_isolated /usr/bin/xattr -p com.apple.FinderInfo "$entry" >/dev/null 2>&1; then
              run_isolated /usr/bin/xattr -d com.apple.FinderInfo "$entry"
              count=$((count + 1))
            fi
          done <"$task_root/temp/mounted-entries"
          test "$count" -gt 0
          echo "Removed FinderInfo from $count synthetic entries."
          run_logged diff-rw /usr/bin/diff -qr "$task_app" "$rw_app"
          run_logged signature-rw /usr/bin/codesign --verify --deep --strict --verbose=2 "$rw_app"
          # The only permitted hidden entry is our empty no_log marker.
          test -d "$event_dir"
          test ! -L "$event_dir"
          test -f "$event_dir/no_log"
          test ! -L "$event_dir/no_log"
          test "$(run_isolated /usr/bin/stat -f %z "$event_dir/no_log")" = 0
          run_logged list-rw-fsevents /bin/ls -la "$event_dir"
          cat "$task_root/logs/list-rw-fsevents.log"
          run_logged list-rw-event-paths /usr/bin/find -P "$event_dir" -xdev -mindepth 1 -maxdepth 1 -print
          test "$(/usr/bin/wc -l <"$task_root/logs/list-rw-event-paths.log" | /usr/bin/tr -d ' ')" = 1
          test "$(cat "$task_root/logs/list-rw-event-paths.log")" = "$event_dir/no_log"
          run_logged list-rw-clean /usr/bin/find "$rw_mount" -mindepth 1 -maxdepth 1 -print
          cat "$task_root/logs/list-rw-clean.log"
          test "$(/usr/bin/wc -l <"$task_root/logs/list-rw-clean.log" | /usr/bin/tr -d ' ')" = 3
          run_logged detach-rw /usr/bin/hdiutil detach "$rw_mount"
          trap - EXIT
          run_logged convert-udzo /usr/bin/hdiutil convert "$task_root/temp/hybrid-rw.dmg" -format UDZO \
            -o "$task_root/temp/hybrid-verified.dmg"
          test -s "$task_root/temp/hybrid-verified.dmg"
          run_logged verify-udzo /usr/bin/hdiutil verify "$task_root/temp/hybrid-verified.dmg"
          ro_mount="$task_root/temp/hybrid-ro-mount"
          mkdir "$ro_mount"
          trap 'run_isolated /usr/bin/hdiutil detach "$ro_mount" >/dev/null 2>&1 || true' EXIT
          run_logged attach-ro /usr/bin/hdiutil attach -plist -readonly -nobrowse -noautoopen \
            -mountpoint "$ro_mount" "$task_root/temp/hybrid-verified.dmg"
          run_logged list-ro-root /bin/ls -la "$ro_mount"
          cat "$task_root/logs/list-ro-root.log"
          if test -d "$ro_mount/.fseventsd" && test ! -L "$ro_mount/.fseventsd"; then
            run_logged list-ro-fsevents /bin/ls -la "$ro_mount/.fseventsd"
            cat "$task_root/logs/list-ro-fsevents.log"
          fi
          run_logged read-ro-link /usr/bin/readlink "$ro_mount/Applications"
          cat "$task_root/logs/read-ro-link.log"
          echo 'Checking final mount identity and expected entries.'
          check_mount "$task_root/logs/attach-ro.log" "$ro_mount"
          ro_app="$ro_mount/AI Task Monitor.app"
          run_logged list-ro-paths /usr/bin/find "$ro_mount" -mindepth 1 -maxdepth 1 -print
          cat "$task_root/logs/list-ro-paths.log"
          test "$(/usr/bin/wc -l <"$task_root/logs/list-ro-paths.log" | /usr/bin/tr -d ' ')" = 3
          test -d "$ro_mount/.fseventsd"
          test ! -L "$ro_mount/.fseventsd"
          test -f "$ro_mount/.fseventsd/no_log"
          test ! -L "$ro_mount/.fseventsd/no_log"
          test "$(run_isolated /usr/bin/stat -f %z "$ro_mount/.fseventsd/no_log")" = 0
          run_logged list-ro-event-paths /usr/bin/find -P "$ro_mount/.fseventsd" -xdev -mindepth 1 -maxdepth 1 -print
          test "$(/usr/bin/wc -l <"$task_root/logs/list-ro-event-paths.log" | /usr/bin/tr -d ' ')" = 1
          test "$(cat "$task_root/logs/list-ro-event-paths.log")" = "$ro_mount/.fseventsd/no_log"
          run_logged list-ro-executable /bin/ls -l "$ro_app/Contents/MacOS/AITaskMonitor"
          cat "$task_root/logs/list-ro-executable.log"
          test -x "$ro_app/Contents/MacOS/AITaskMonitor"
          run_logged diff-ro /usr/bin/diff -qr "$task_app" "$ro_app"
          run_logged signature-ro /usr/bin/codesign --verify --deep --strict --verbose=2 "$ro_app"
          task_icon_actual="$(run_isolated /usr/bin/shasum -a 256 "$ro_app/Contents/Resources/AppIcon.icns")"
          test "${task_icon_actual%% *}" = ec9ba4d716b1988dfad213127d9d2dffbb37e188199f8c7576d4325774e78e67
          run_logged copy-app /usr/bin/ditto "$ro_app" "$task_root/temp/copied.app"
          run_logged signature-copied /usr/bin/codesign --verify --deep --strict --verbose=2 "$task_root/temp/copied.app"
          run_logged detach-ro /usr/bin/hdiutil detach "$ro_mount"
          trap - EXIT
          echo 'Read-write cleanup and strict signatures passed on the synthetic image and copied app.'
          for probe in "$marker" "$task_root/denied-link"; do
            if run_isolated /bin/cat "$probe" >/dev/null 2>&1 || run_isolated /usr/bin/touch "$probe" >/dev/null 2>&1; then
              echo 'Profile access became available.' >&2; exit 1
            fi
          done
          /usr/bin/log show --last 5m --style compact --predicate 'eventMessage CONTAINS "deny" AND (eventMessage CONTAINS "hdiutil" OR eventMessage CONTAINS "diskimages")' >"$task_root/logs/sandbox.log" 2>/dev/null || true
          tail -n 50 "$task_root/logs/sandbox.log"
      - name: Save diagnostic logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-image-diagnostic-${{ matrix.runner }}-${{ github.sha }}
          path: ${{ runner.temp }}/aitm-image-check.*/logs/*.log
          if-no-files-found: warn
