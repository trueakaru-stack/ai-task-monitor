name: Windows Codex title end to end
on:
  push:
    branches:
      - codex/windows-final-title-e2e-20261118-a
  workflow_dispatch:
permissions:
  contents: read
env:
  DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
jobs:
  title-window:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact integrated source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base=(git rev-parse HEAD~1).Trim()
          if($base -cne '440392135de66a16214d6294e786855ff6dc22cc'){throw 'Unexpected integrated parent commit.'}
          $changed=@(git diff --name-only HEAD~1 HEAD)
          if($changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/windows-title-e2e-20261118.yml'){throw 'Unexpected changes beyond the temporary workflow.'}
      - name: Verify SQLite title reaches a running window
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:CI -cne 'true' -or $env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'Requires a disposable hosted Windows runner.'}
          $root=Join-Path $env:RUNNER_TEMP ('title-e2e-'+[Guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($root)
          $env:USERPROFILE=Join-Path $root 'profile'
          $env:LOCALAPPDATA=Join-Path $root 'local'
          $env:APPDATA=Join-Path $root 'roaming'
          $env:CODEX_HOME=Join-Path $root 'codex'
          $env:TEMP=$root
          $env:TMP=$root
          foreach($p in @($env:USERPROFILE,$env:LOCALAPPDATA,$env:APPDATA,$env:CODEX_HOME)){[void][IO.Directory]::CreateDirectory($p)}
          $source=[IO.File]::ReadAllText((Resolve-Path 'windows/tests/Test-CodexTitleLookup.ps1').Path)
          $match=[regex]::Match($source,"(?s)Add-Type -TypeDefinition @'\r?\n(.*?)\r?\n'@")
          if(-not $match.Success){throw 'Synthetic database helper unavailable.'}
          Add-Type -TypeDefinition $match.Groups[1].Value
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes
          $db=Join-Path $env:CODEX_HOME 'state_5.sqlite'
          $writer=[SyntheticTitleDb]::new($db,'CREATE TABLE threads(id TEXT PRIMARY KEY,name TEXT,title TEXT,history_mode TEXT);')
          $process=$null
          try {
            $writer.Execute("INSERT INTO threads VALUES('11111111-1111-4111-8111-111111111111','Synthetic dashboard','Stale internal value','paginated');")
            $now=[DateTime]::UtcNow
            $day=Join-Path (Join-Path (Join-Path (Join-Path $env:CODEX_HOME 'sessions') $now.ToString('yyyy')) $now.ToString('MM')) $now.ToString('dd')
            $locks=Join-Path $env:CODEX_HOME 'thread-writer-locks'
            [void][IO.Directory]::CreateDirectory($day)
            [void][IO.Directory]::CreateDirectory($locks)
            $sessionId='11111111-1111-4111-8111-111111111111'
            $rollout=Join-Path $day ('rollout-'+$now.ToString('yyyy-MM-ddTHH-mm-ss')+'-'+$sessionId+'.jsonl')
            $meta=@{type='session_meta';payload=@{id=$sessionId}}|ConvertTo-Json -Compress -Depth 5
            $started=@{timestamp=$now.ToString('o');type='event_msg';payload=@{type='task_started';turn_id='synthetic-turn'}}|ConvertTo-Json -Compress -Depth 5
            [IO.File]::WriteAllText($rollout,(($meta,$started -join "`n")+"`n"),[Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText((Join-Path $locks ($sessionId+'.lock')),'')
            $app=(Resolve-Path 'windows/app/CodexProgress.ps1').Path
            $powershell=Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
            $parameters=@('-NoProfile','-STA','-ExecutionPolicy','Bypass','-File',('"' + $app + '"'),'-ThemeOverride','dark','-LanguageOverride','en','-DiagnosticDirectory',('"' + (Join-Path $root 'diagnostics') + '"'))
            $process=Start-Process -FilePath $powershell -ArgumentList $parameters -WindowStyle Hidden -PassThru
            $condition=[Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::NameProperty,'Synthetic dashboard')
            $clock=[Diagnostics.Stopwatch]::StartNew()
            $found=$false
            while($clock.Elapsed.TotalSeconds -lt 45){
              if($process.HasExited){throw 'The isolated application exited early.'}
              $process.Refresh()
              if($process.MainWindowHandle -ne [IntPtr]::Zero){
                $element=[Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
                if($null -ne $element -and $null -ne $element.FindFirst([Windows.Automation.TreeScope]::Descendants,$condition)){$found=$true;break}
              }
              Start-Sleep -Milliseconds 250
            }
            if(-not $found){throw 'The SQLite title did not reach the visible task in time.'}
            Write-Output 'A synthetic SQLite title reached the running application window.'
          } finally {
            if($null -ne $process){
              $process.Refresh()
              if(-not $process.HasExited){[void]$process.CloseMainWindow();if(-not $process.WaitForExit(5000)){$process.Kill();[void]$process.WaitForExit(5000)}}
              $process.Dispose()
            }
            $writer.Dispose()
          }
