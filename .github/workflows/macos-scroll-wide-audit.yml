name: macOS synthetic wide scroll document

on:
  workflow_dispatch:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-scroll-wide-audit.yml"
      - ".github/audits/ScrollWideProbes.swift"
      - ".github/audits/ScrollWideAuditTests.swift"
      - ".github/audits/generate-scroll-wide.py"

permissions:
  contents: read

jobs:
  wide-scroll:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[tests-only]') && contains(github.event.head_commit.message, '[scroll-wide-audit]')) }}
    name: synthetic wide scroll (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout the audit tools
        uses: actions/checkout@v4
        with:
          path: audit-control
          persist-credentials: false
      - name: Checkout the pinned application source
        uses: actions/checkout@v4
        with:
          ref: 835ad09e98efb59546a8b850b8b8c2777323b581
          path: pinned-source
          persist-credentials: false
      - name: Select Xcode for macOS 15
        if: ${{ matrix.runner == 'macos-15' }}
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      - name: Check isolated variants
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          status=0
          for variant in baseline wide; do
            project="$RUNNER_TEMP/aitm-scroll-wide-code-$variant"
            output="$RUNNER_TEMP/aitm-layout-wide-$variant"
            test ! -e "$project"
            mkdir -p "$project" "$output"
            cp -R "$GITHUB_WORKSPACE/pinned-source/macos/." "$project/"
            cp "$GITHUB_WORKSPACE/audit-control/.github/audits/ScrollWideProbes.swift" "$project/Sources/AITaskMonitor/"
            cp "$GITHUB_WORKSPACE/audit-control/.github/audits/ScrollWideAuditTests.swift" "$project/Tests/AITaskMonitorTests/"
            if ! python3 "$GITHUB_WORKSPACE/audit-control/.github/audits/generate-scroll-wide.py" "$project" "$variant" "$output"; then
              status=1
              continue
            fi
            for file in RootView.swift TaskCardView.swift; do
              if diff -u "$GITHUB_WORKSPACE/pinned-source/macos/Sources/AITaskMonitor/$file" "$project/Sources/AITaskMonitor/$file" > "$output/$file.patch"; then
                :
              else
                test "$?" -eq 1 || status=1
              fi
            done
            export AITM_LAYOUT_SYNTHETIC_CI=1
            export AITM_LAYOUT_SYNTHETIC_ROOT="$output"
            export AITM_SCROLL_VARIANT="$variant"
            if ! (cd "$project" && swift test --filter ScrollWideAuditTests); then status=1; fi
            test -s "$output/wide-geometry.json" || status=1
            test -s "$output/wide-hit-tests.json" || status=1
          done
          exit "$status"
      - name: Document audit scope
        if: ${{ always() }}
        shell: bash
        run: |
          printf '%s\n' 'Synthetic layout and in-process input only; no source change was integrated, no installer was built, and the full reconnect regression was not run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload synthetic geometry and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-scroll-wide-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/aitm-layout-wide-*/
          if-no-files-found: warn
          retention-days: 7
