          /usr/bin/shasum -a 256 "$developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
      - name: Reproduce late concurrent write in synthetic settings
        shell: bash
        run: /bin/bash "$GITHUB_WORKSPACE/.github/limited-audit/claude-version-policy-20261109/run-audit.sh" race
