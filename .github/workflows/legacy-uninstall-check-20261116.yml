name: Synthetic legacy uninstall safety
on:
  push:
    branches: ['windows', 'codex/windows-compact-ci-20261124']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
    steps:
      - name: Run legacy uninstaller only against isolated fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRoot = Join-Path $env:RUNNER_TEMP ('aitm-legacy-source-' + [guid]::NewGuid().ToString('N'))
          $source = Join-Path $sourceRoot 'source'
          $template = Join-Path $sourceRoot 'template'
          $hooks = Join-Path $sourceRoot 'hooks'
          New-Item -ItemType Directory -Path $source, $template, $hooks | Out-Null
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = Join-Path $sourceRoot 'empty.gitconfig'
          [IO.File]::WriteAllText($env:GIT_CONFIG_GLOBAL, '')
          $env:GIT_TERMINAL_PROMPT = '0'
          git -c credential.helper= -c core.hooksPath="$hooks" -c init.defaultBranch=fixture init --quiet --template="$template" "$source"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize source checkout.' }
          git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" fetch --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch exact test revision.' }
          git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" checkout --quiet --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C "$source" rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'Cannot select exact test revision.' }
          function Read-PathState([string]$scope){
            $key=if($scope -eq 'User'){[Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment',$false)}else{[Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SYSTEM\CurrentControlSet\Control\Session Manager\Environment',$false)}
            try{
              $value=$key.GetValue('Path',$null,[Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
              $kind=if($null -eq $value){'Missing'}else{[string]$key.GetValueKind('Path')}
              return [PSCustomObject]@{Value=[string]$value;Kind=$kind}
            }finally{if($null -ne $key){$key.Dispose()}}
          }
          $beforeUser=Read-PathState 'User';$beforeMachine=Read-PathState 'Machine'
          $beforeProcess=[Environment]::GetEnvironmentVariable('Path','Process')
          try{
            $pythonRoot=if($env:RUNNER_TOOL_CACHE){Join-Path $env:RUNNER_TOOL_CACHE 'Python'}else{''}
            $candidate=if($pythonRoot -and [IO.Directory]::Exists($pythonRoot)){Get-ChildItem -LiteralPath $pythonRoot -Filter python.exe -File -Recurse -ErrorAction Stop | Where-Object {$_.FullName -match '\\x64\\python\.exe$'} | Sort-Object FullName -Descending | Select-Object -First 1}else{$null}
            $verified=$false
            if($null -ne $candidate){
              $trusted=[IO.Path]::GetFullPath($pythonRoot).TrimEnd('\')+'\';$path=[IO.Path]::GetFullPath($candidate.FullName)
              $verified=$path.StartsWith($trusted,[StringComparison]::OrdinalIgnoreCase) -and $path -notmatch '(?i)WindowsApps' -and ($candidate.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0 -and ($candidate.VersionInfo.ProductName -match '(?i)Python' -or $candidate.VersionInfo.FileDescription -match '(?i)Python')
              $parent=$candidate.Directory
              while($verified -and $null -ne $parent -and $parent.FullName.Length -ge $pythonRoot.Length){
                if(($parent.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0){$verified=$false;break};$parent=$parent.Parent
              }
            }
            if($verified){
              & $candidate.FullName -I -B (Join-Path $source 'windows/tests/Test-DotnetPathSafety.py')
              if($LASTEXITCODE -ne 0){throw 'The PATH safety guard failed.'}
              Write-Output 'PATH safety guard: passed using a verified hosted tool-cache interpreter.'
            }else{throw 'No verified hosted tool-cache Python was found.'}
          function Assert-SourceSnapshot {
            $revision=(& git -C "$source" rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $revision -cne $env:GITHUB_SHA){throw 'Source revision changed during verification.'}
            & git -C "$source" diff --quiet HEAD -- windows .github/legacy-uninstall-ci .github/workflows .github/safe-uninstall-ci
            if($LASTEXITCODE -ne 0){throw 'Tracked source inputs changed during verification.'}
            $unexpected=@(& git -C "$source" ls-files --others --exclude-standard -- windows .github/legacy-uninstall-ci .github/workflows .github/safe-uninstall-ci)
            if($LASTEXITCODE -ne 0 -or $unexpected.Count -gt 0){throw 'Unexpected source inputs appeared during verification.'}
          }
          Assert-SourceSnapshot
          & (Join-Path $source '.github/legacy-uninstall-ci/Run.ps1')
          Assert-SourceSnapshot
          & (Join-Path $source 'windows/tests/Test-UninstallPreservesData.ps1')
          Assert-SourceSnapshot
          $verifiedExe=Join-Path $env:RUNNER_TEMP ("aitm-verified-setup-"+$env:GITHUB_SHA+"\AITaskMonitorSetup.exe")
          $powershell=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $source 'windows/tests/Test-CodexRecentEventPackaging.ps1') -InstallerPath $verifiedExe
          if($LASTEXITCODE -ne 0){throw 'The verified installer failed the observer resource check.'}
          Assert-SourceSnapshot
          }finally{
            foreach($scope in @('User','Machine')){$before=if($scope -eq 'User'){$beforeUser}else{$beforeMachine};$after=Read-PathState $scope;if($after.Value -cne $before.Value -or $after.Kind -cne $before.Kind){throw "$scope PATH changed."}}
            if([Environment]::GetEnvironmentVariable('Path','Process') -cne $beforeProcess){throw 'Process PATH changed.'}
          }

      - name: Save the exact verified setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-windows-setup-${{ github.sha }}
          path: ${{ runner.temp }}/aitm-verified-setup-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3

      - name: Save synthetic dialog screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-dialogs-${{ github.sha }}
          path: ${{ runner.temp }}/aitm-dialogs-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 3
