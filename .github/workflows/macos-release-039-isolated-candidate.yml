            "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest" 2>&1 | tee "$AITM_TEST_TASK_ROOT/out/codex-test.log"
          grep -F 'Executed 1 test, with 0 failures' "$AITM_TEST_TASK_ROOT/out/codex-test.log"
      - name: Save candidate and diagnostics
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-039-isolated-candidate-${{ matrix.runner }}
          path: ${{ runner.temp }}/aitm-release-039.*/out/*
          if-no-files-found: error
          retention-days: 7
      - name: Report incomplete candidate checks
        if: ${{ !cancelled() }}
        shell: bash
        env:
          UPDATE_OUTCOME: ${{ steps.update_test.outcome }}
          CLAUDE_OUTCOME: ${{ steps.claude_test.outcome }}
          CODEX_OUTCOME: ${{ steps.codex_test.outcome }}
          IMAGE_OUTCOME: ${{ steps.image.outcome }}
          RUNNER_KIND: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          test "$UPDATE_OUTCOME" = success
          test "$CLAUDE_OUTCOME" = success
          test "$CODEX_OUTCOME" = success
          if test "$RUNNER_KIND" = macos-26; then test "$IMAGE_OUTCOME" = success; fi
