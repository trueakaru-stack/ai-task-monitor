name: Isolated macOS 0.3.9 candidate
on:
  push:
    branches: ['codex/macos-release-0-3-9-candidate-20261116']
    paths: ['.github/workflows/macos-release-039-isolated-candidate.yml']
permissions:
  contents: read
jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            developer: /Applications/Xcode.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
    steps:
      - name: Prepare exact disposable candidate and sandbox
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$GITHUB_REPOSITORY" = trueakaru-stack/ai-task-monitor
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RUNNER_TEMP" = /Users/runner/work/_temp
          test -d "$DEVELOPER_DIR"
          task_root="$(mktemp -d "$RUNNER_TEMP/aitm-release-039.XXXXXXXX")"
          task_marker="$(mktemp "$RUNNER_TEMP/aitm-profile-deny.XXXXXXXX")"
          printf 'synthetic-only\n' > "$task_marker"
          mkdir -p "$task_root/source" "$task_root/template" "$task_root/hooks" "$task_root/temp" \
            "$task_root/wrapper" "$task_root/swift-cache" "$task_root/swift-config" \
            "$task_root/swift-security" "$task_root/clang-cache" "$task_root/out" "$task_root/mount"
          task_path="$task_root/wrapper:$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin:$DEVELOPER_DIR/usr/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          task_git() {
            /usr/bin/env -i "PATH=/usr/bin:/bin:/usr/sbin:/sbin" GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 /usr/bin/git "$@"
          }
          task_git -c credential.helper= -c core.hooksPath="$task_root/hooks" \
            -c init.templateDir="$task_root/template" init --quiet "$task_root/source"
          task_git -C "$task_root/source" -c credential.helper= -c core.hooksPath="$task_root/hooks" \
            fetch --no-tags --depth=1 https://github.com/trueakaru-stack/ai-task-monitor.git "$GITHUB_SHA"
          task_git -C "$task_root/source" -c core.hooksPath="$task_root/hooks" checkout --quiet --detach FETCH_HEAD
          test "$(task_git -C "$task_root/source" rev-parse HEAD)" = "$GITHUB_SHA"
          task_git -C "$task_root/source" -c credential.helper= -c core.hooksPath="$task_root/hooks" \
            fetch --no-tags --depth=1 https://github.com/trueakaru-stack/ai-task-monitor.git 2b69293ec611ab0031fbb318f4f6b041608c031f
          task_git -C "$task_root/source" diff --name-only 2b69293ec611ab0031fbb318f4f6b041608c031f HEAD -- macos | LC_ALL=C sort > "$task_root/actual-source-diff"
          printf '%s\n' 'macos/Info.plist' 'macos/Sources/AITaskMonitor/AppVersion.swift' > "$task_root/expected-source-diff"
          cmp "$task_root/expected-source-diff" "$task_root/actual-source-diff"
          test "$(task_git -C "$task_root/source" hash-object macos/Info.plist)" = 20b247bd3e88dd24259912124aac20333e592850
          test "$(task_git -C "$task_root/source" hash-object macos/Sources/AITaskMonitor/AppVersion.swift)" = 8fa85f8005e27219edb28180a2c91a90f690bdfd
          test "$(task_git -C "$task_root/source" hash-object macos/Package.swift)" = 144202dfc5f413e896867b219af2e0c3dc621897
          test "$(task_git -C "$task_root/source" hash-object macos/scripts/build-app.sh)" = 24bd6fa45808ea1c7bd8bc33b5931051e7baaa0c
          test "$(task_git -C "$task_root/source" hash-object macos/scripts/create-dmg.sh)" = e396e4895bfd228b605eeb42201313267ca73f48
          test "$(task_git -C "$task_root/source" hash-object .github/macos-final-build-20261109/verify-dmg-contents.py)" = dba112a7e2bfbac2f7adfa550e24920c170c158c
          test -z "$(find "$task_root/source/macos" -type l -print)"
          test ! -e "$task_root/source/macos/dist"
          test ! -L "$task_root/source/macos/dist"
          cat > "$task_root/profile.sb" <<'PROFILE'
          (version 1)
          (allow default)
          (deny file-read* (subpath "/Users") (subpath "/private/var/folders"))
          (allow file-read-metadata (literal "/Users") (literal "/Users/runner") (literal "/Users/runner/work") (literal "/Users/runner/work/_temp"))
          (allow file-read* (subpath (param "TASK_ROOT")))
          (deny file-write*)
          (allow file-write* (subpath (param "TASK_ROOT")))
          (allow file-write-data (literal "/dev/null") (literal "/dev/tty"))
          (deny network*)
          (deny mach-lookup)
          (allow mach-lookup (global-name "com.apple.windowserver.active") (global-name "com.apple.windowserver.session")
                             (global-name "com.apple.CARenderServer") (global-name "com.apple.windowmanager.server"))
          PROFILE
          cat > "$task_root/run-isolated" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          exec /usr/bin/env -i "PATH=$AITM_TASK_PATH" "TMPDIR=$AITM_TEST_TASK_ROOT/temp" \
            "DEVELOPER_DIR=$DEVELOPER_DIR" "CLANG_MODULE_CACHE_PATH=$AITM_TEST_TASK_ROOT/clang-cache" \
            "SDKROOT=$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" XCRUN_NO_CACHE=1 \
            CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=macOS AITM_MACOS_TEST_SANDBOX=1 \
            "AITM_TEST_TASK_ROOT=$AITM_TEST_TASK_ROOT" "AITM_CI_DENIED_FILE=$AITM_TEST_DENIED_FILE" \
            /usr/bin/sandbox-exec -D "TASK_ROOT=$AITM_TEST_TASK_ROOT" -f "$AITM_TEST_TASK_ROOT/profile.sb" "$@"
          SCRIPT
          cat > "$task_root/wrapper/swift" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test -z "${HOME+x}"
          test -z "${CODEX_HOME+x}"
          test "$(pwd -P)" = "$AITM_TEST_TASK_ROOT/source/macos"
          test "$*" = "build -c release --arch arm64 --arch x86_64"
          exec "$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift" build --disable-sandbox \
            --cache-path "$AITM_TEST_TASK_ROOT/swift-cache" --config-path "$AITM_TEST_TASK_ROOT/swift-config" \
            --security-path "$AITM_TEST_TASK_ROOT/swift-security" -c release --arch arm64 --arch x86_64
          SCRIPT
          chmod 700 "$task_root/run-isolated" "$task_root/wrapper/swift"
          { printf 'AITM_TEST_TASK_ROOT=%s\n' "$task_root"; printf 'AITM_TEST_DENIED_FILE=%s\n' "$task_marker"; printf 'AITM_TASK_PATH=%s\n' "$task_path"; } >> "$GITHUB_ENV"
      - name: Verify no profile access or HOME override
        shell: bash
        run: |
          set -euo pipefail
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          "$task_run" /usr/bin/true
          "$task_run" /bin/bash -c 'test -z "${HOME+x}" && test -z "${CODEX_HOME+x}"'
          if "$task_run" /bin/cat "$AITM_TEST_DENIED_FILE" >"$AITM_TEST_TASK_ROOT/out/deny" 2>&1; then echo 'Profile read was not denied.' >&2; exit 1; fi
          if "$task_run" /usr/bin/touch "$AITM_TEST_DENIED_FILE" >"$AITM_TEST_TASK_ROOT/out/deny" 2>&1; then echo 'Profile write was not denied.' >&2; exit 1; fi
          "$task_run" /bin/ln -s "$AITM_TEST_DENIED_FILE" "$AITM_TEST_TASK_ROOT/denied-link"
          if "$task_run" /bin/cat "$AITM_TEST_TASK_ROOT/denied-link" >"$AITM_TEST_TASK_ROOT/out/deny" 2>&1; then echo 'Profile read through link was not denied.' >&2; exit 1; fi
          if "$task_run" /usr/bin/touch "$AITM_TEST_TASK_ROOT/denied-link" >"$AITM_TEST_TASK_ROOT/out/deny" 2>&1; then echo 'Profile write through link was not denied.' >&2; exit 1; fi
      - name: Probe icon conversion with a single system service
        id: icon
        shell: bash
        run: |
          set -euo pipefail
          cd "$AITM_TEST_TASK_ROOT"
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          /bin/cp profile.sb profile-icon.sb
          printf '%s\n' '(allow mach-lookup (global-name "com.apple.lsd.mapdb"))' >> profile-icon.sb
          /usr/bin/sed 's@profile.sb@profile-icon.sb@' run-isolated > run-icon
          chmod 700 run-icon
          icon_run="$AITM_TEST_TASK_ROOT/run-icon"
          "$icon_run" /bin/bash -c 'test -z "${HOME+x}" && test -z "${CODEX_HOME+x}"'
          if "$icon_run" /bin/cat "$AITM_TEST_DENIED_FILE" >"$AITM_TEST_TASK_ROOT/out/profile-check.stdout" 2>"$AITM_TEST_TASK_ROOT/out/profile-check.stderr"; then exit 1; fi
          if "$icon_run" /usr/bin/touch "$AITM_TEST_DENIED_FILE" >"$AITM_TEST_TASK_ROOT/out/profile-check.stdout" 2>"$AITM_TEST_TASK_ROOT/out/profile-check.stderr"; then exit 1; fi
          if "$icon_run" /bin/cat "$AITM_TEST_TASK_ROOT/denied-link" >"$AITM_TEST_TASK_ROOT/out/profile-check.stdout" 2>"$AITM_TEST_TASK_ROOT/out/profile-check.stderr"; then exit 1; fi
          if "$icon_run" /usr/bin/touch "$AITM_TEST_TASK_ROOT/denied-link" >"$AITM_TEST_TASK_ROOT/out/profile-check.stdout" 2>"$AITM_TEST_TASK_ROOT/out/profile-check.stderr"; then exit 1; fi
          cat > mach-probe.c <<'C'
          #include <mach/mach.h>
          #include <servers/bootstrap.h>
          #include <sys/socket.h>
          #include <netinet/in.h>
          #include <arpa/inet.h>
          #include <errno.h>
          #include <stdio.h>
          #include <unistd.h>
          int main(void) {
              const char *blocked[] = {"com.apple.cfprefsd.agent", "com.apple.cfprefsd.daemon", "com.apple.bsd.dirhelper"};
              for (unsigned i = 0; i < sizeof(blocked) / sizeof(blocked[0]); ++i) {
                  mach_port_t service = MACH_PORT_NULL;
                  kern_return_t result = bootstrap_look_up(bootstrap_port, blocked[i], &service);
                  if (result == KERN_SUCCESS) mach_port_deallocate(mach_task_self(), service);
                  if (result != BOOTSTRAP_NOT_PRIVILEGED) { fprintf(stderr, "Profile service not provably blocked: %d\n", result); return 1; }
              }
              int fd = socket(AF_INET, SOCK_STREAM, 0);
              if (fd < 0) {
                  if (errno != EPERM && errno != EACCES) return 2;
              } else {
                  struct sockaddr_in addr = {0};
                  addr.sin_len = sizeof(addr);
                  addr.sin_family = AF_INET;
                  addr.sin_port = htons(9);
                  addr.sin_addr.s_addr = htonl(INADDR_LOOPBACK);
                  errno = 0;
                  if (connect(fd, (struct sockaddr *)&addr, sizeof(addr)) == 0 || (errno != EPERM && errno != EACCES)) {
                      close(fd); fprintf(stderr, "Loopback network was not provably denied.\n"); return 3;
                  }
                  close(fd);
              }
              puts("Profile services and loopback network remain denied.");
              return 0;
          }
          C
          "$task_run" /usr/bin/clang -mmacosx-version-min=13.0 "$AITM_TEST_TASK_ROOT/mach-probe.c" -o "$AITM_TEST_TASK_ROOT/mach-probe"
          "$task_run" "$AITM_TEST_TASK_ROOT/mach-probe"
          "$icon_run" "$AITM_TEST_TASK_ROOT/mach-probe"
          mkdir -p "$AITM_TEST_TASK_ROOT/icons/AppIcon.iconset"
          task_icons="$AITM_TEST_TASK_ROOT/source/macos/assets/app-icon"
          iconset="$AITM_TEST_TASK_ROOT/icons/AppIcon.iconset"
          cp "$task_icons/icon-16.png" "$iconset/icon_16x16.png"
          cp "$task_icons/icon-32.png" "$iconset/icon_16x16@2x.png"
          cp "$task_icons/icon-32.png" "$iconset/icon_32x32.png"
          cp "$task_icons/icon-64.png" "$iconset/icon_32x32@2x.png"
          cp "$task_icons/icon-128.png" "$iconset/icon_128x128.png"
          cp "$task_icons/icon-256.png" "$iconset/icon_128x128@2x.png"
          cp "$task_icons/icon-256.png" "$iconset/icon_256x256.png"
          cp "$task_icons/icon-512.png" "$iconset/icon_256x256@2x.png"
          cp "$task_icons/icon-512.png" "$iconset/icon_512x512.png"
          cp "$task_icons/icon-1024.png" "$iconset/icon_512x512@2x.png"
          set +e
          "$task_run" /usr/bin/iconutil -c icns "$iconset" -o "$AITM_TEST_TASK_ROOT/icons/strict.icns" > "$AITM_TEST_TASK_ROOT/strict-icon.log" 2>&1
          strict_status=$?
          set -e
          echo "Strict iconutil exit status: $strict_status"
          cat "$AITM_TEST_TASK_ROOT/strict-icon.log"
          "$icon_run" /usr/bin/iconutil -c icns "$iconset" -o "$AITM_TEST_TASK_ROOT/icons/icon.icns"
          test -s "$AITM_TEST_TASK_ROOT/icons/icon.icns"
          /usr/bin/shasum -a 256 "$AITM_TEST_TASK_ROOT/icons/icon.icns"
          "$icon_run" /usr/bin/iconutil -c iconset "$AITM_TEST_TASK_ROOT/icons/icon.icns" -o "$AITM_TEST_TASK_ROOT/icons/roundtrip.iconset"
          for n in icon_16x16.png icon_16x16@2x.png icon_32x32.png icon_32x32@2x.png icon_128x128.png icon_128x128@2x.png icon_256x256.png icon_256x256@2x.png icon_512x512.png icon_512x512@2x.png; do
            test -s "$AITM_TEST_TASK_ROOT/icons/roundtrip.iconset/$n"
          done
          echo 'Round-trip includes all ten icon sizes.'
          printf '%s  %s\n' 'ec9ba4d716b1988dfad213127d9d2dffbb37e188199f8c7576d4325774e78e67' "$AITM_TEST_TASK_ROOT/icons/icon.icns" | /usr/bin/shasum -a 256 -c -
          cat > "$AITM_TEST_TASK_ROOT/wrapper/iconutil" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test -z "${HOME+x}"
          test -z "${CODEX_HOME+x}"
          test "$(pwd -P)" = "$AITM_TEST_TASK_ROOT/source/macos"
          test "$#" = 5
          test "$1" = -c
          test "$2" = icns
          test "$4" = -o
          test "$5" = "dist/AI Task Monitor.app/Contents/Resources/AppIcon.icns"
          case "$3" in "$AITM_TEST_TASK_ROOT"/temp/tmp.*/AppIcon.iconset) ;; *) exit 1;; esac
          test -d "$3"
          test ! -L "$3"
          test -z "$(find "$3" -type l -print)"
          test "$(find "$3" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 10
          cmp "$3/icon_16x16.png" assets/app-icon/icon-16.png
          cmp "$3/icon_16x16@2x.png" assets/app-icon/icon-32.png
          cmp "$3/icon_32x32.png" assets/app-icon/icon-32.png
          cmp "$3/icon_32x32@2x.png" assets/app-icon/icon-64.png
          cmp "$3/icon_128x128.png" assets/app-icon/icon-128.png
          cmp "$3/icon_128x128@2x.png" assets/app-icon/icon-256.png
          cmp "$3/icon_256x256.png" assets/app-icon/icon-256.png
          cmp "$3/icon_256x256@2x.png" assets/app-icon/icon-512.png
          cmp "$3/icon_512x512.png" assets/app-icon/icon-512.png
          cmp "$3/icon_512x512@2x.png" assets/app-icon/icon-1024.png
          test -f "$AITM_TEST_TASK_ROOT/icons/icon.icns"
          test ! -L "$AITM_TEST_TASK_ROOT/icons/icon.icns"
          test ! -e "$5"
          test ! -L "$5"
          printf '%s  %s\n' 'ec9ba4d716b1988dfad213127d9d2dffbb37e188199f8c7576d4325774e78e67' "$AITM_TEST_TASK_ROOT/icons/icon.icns" | /usr/bin/shasum -a 256 -c -
          /bin/cp "$AITM_TEST_TASK_ROOT/icons/icon.icns" "$5"
          echo 'Installed independently verified icon from unchanged source assets.'
          SCRIPT
          chmod 700 "$AITM_TEST_TASK_ROOT/wrapper/iconutil"
      - name: Build exact universal candidate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd "$AITM_TEST_TASK_ROOT/source/macos"
          "$AITM_TEST_TASK_ROOT/run-isolated" /bin/bash ./scripts/build-app.sh
          task_app="$AITM_TEST_TASK_ROOT/source/macos/dist/AI Task Monitor.app"
          task_binary="$task_app/Contents/MacOS/AITaskMonitor"
          "$AITM_TEST_TASK_ROOT/run-isolated" /usr/bin/xcrun lipo "$task_binary" -verify_arch arm64 x86_64
          test "$("$AITM_TEST_TASK_ROOT/run-isolated" /usr/bin/plutil -extract AITaskMonitorReleaseVersion raw -o - "$task_app/Contents/Info.plist")" = 0.3.9-alpha
          test "$("$AITM_TEST_TASK_ROOT/run-isolated" /usr/bin/plutil -extract CFBundleShortVersionString raw -o - "$task_app/Contents/Info.plist")" = 0.3.9
          test "$("$AITM_TEST_TASK_ROOT/run-isolated" /usr/bin/plutil -extract CFBundleVersion raw -o - "$task_app/Contents/Info.plist")" = 12
          "$AITM_TEST_TASK_ROOT/run-isolated" /usr/bin/codesign -dvv "$task_app" 2>&1 | tee "$AITM_TEST_TASK_ROOT/out/signature.txt"
          "$AITM_TEST_TASK_ROOT/run-isolated" /usr/bin/python3 -I -S -B - \
            "$task_app" "$AITM_TEST_TASK_ROOT/source/macos" "$AITM_TEST_TASK_ROOT/source/.github/macos-final-build-20261109/bundle-resources.sha256" \
            <<'PY' | tee "$AITM_TEST_TASK_ROOT/out/bundle.json"
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import plistlib
          import stat
          import sys
          app, source, manifest = map(Path, sys.argv[1:])
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != "43ecc4a14501423eaf91946bdef279474b1759fe9ac0c43ebaddb55be40d628f":
              raise SystemExit("Unexpected resource manifest.")
          expected = {}
          for line in manifest.read_text(encoding="ascii").splitlines():
              checksum, name = line.split("  ", 1)
              parts = PurePosixPath(name).parts
              if (len(parts) < 2 or parts[0] != "integrations" or ".." in parts or
                      PurePosixPath(name).is_absolute() or name in expected):
                  raise SystemExit("Invalid resource manifest.")
              expected[name] = checksum
          if len(expected) != 27:
              raise SystemExit("Unexpected resource manifest size.")
          resources = app / "Contents/Resources"
          integration_root = resources / "integrations"
          if integration_root.is_symlink() or not integration_root.is_dir():
              raise SystemExit("Unsafe integration root.")
          for entry in integration_root.rglob("*"):
              if entry.is_symlink():
                  raise SystemExit("Linked integration resource.")
          actual = {"integrations/" + path.relative_to(integration_root).as_posix()
                    for path in integration_root.rglob("*") if path.is_file()}
          if actual != set(expected):
              raise SystemExit("Bundled integration resources differ.")
          for name, checksum in expected.items():
              if hashlib.sha256((resources / name).read_bytes()).hexdigest() != checksum:
                  raise SystemExit("Wrong bundled resource: " + name)
              if hashlib.sha256((source / name).read_bytes()).hexdigest() != checksum:
                  raise SystemExit("Wrong source resource: " + name)
          plist_path = app / "Contents/Info.plist"
          if plist_path.is_symlink() or plist_path.read_bytes() != (source / "Info.plist").read_bytes():
              raise SystemExit("Bundle version file differs from source.")
          info = plistlib.loads(plist_path.read_bytes())
          for key, value in {"AITaskMonitorReleaseVersion":"0.3.9-alpha", "CFBundleShortVersionString":"0.3.9",
                             "CFBundleVersion":"12", "CFBundleExecutable":"AITaskMonitor",
                             "LSMinimumSystemVersion":"13.0"}.items():
              if info.get(key) != value:
                  raise SystemExit("Unexpected bundle value: " + key)
          icon = resources / "AppIcon.icns"
          binary = app / "Contents/MacOS/AITaskMonitor"
          if icon.is_symlink() or hashlib.sha256(icon.read_bytes()).hexdigest() != "ec9ba4d716b1988dfad213127d9d2dffbb37e188199f8c7576d4325774e78e67":
              raise SystemExit("Unexpected application icon.")
          if binary.is_symlink() or not binary.is_file() or not (stat.S_IMODE(binary.stat().st_mode) & 0o111) or not os.access(binary, os.X_OK):
              raise SystemExit("Missing or non-executable application binary.")
          print(json.dumps({"release":info["AITaskMonitorReleaseVersion"], "build":info["CFBundleVersion"],
                            "iconSha256":hashlib.sha256(icon.read_bytes()).hexdigest(),
                            "binarySha256":hashlib.sha256(binary.read_bytes()).hexdigest(),
                            "integrationResourceCount":len(expected)}, sort_keys=True))
          PY
      - name: Smoke test bundled Claude hook
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          cd "$AITM_TEST_TASK_ROOT/source/macos"
          "$AITM_TEST_TASK_ROOT/run-isolated" /bin/bash ./scripts/smoke-test.sh "dist/AI Task Monitor.app"
      - name: Render candidate example with synthetic tasks
        if: ${{ matrix.runner == 'macos-26' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$AITM_TEST_TASK_ROOT"
          mkdir -p "$AITM_TEST_TASK_ROOT/previews"
          task_binary="$AITM_TEST_TASK_ROOT/source/macos/dist/AI Task Monitor.app/Contents/MacOS/AITaskMonitor"
          "$AITM_TEST_TASK_ROOT/run-isolated" "$task_binary" --render-previews "$AITM_TEST_TASK_ROOT/previews" \
            > "$AITM_TEST_TASK_ROOT/out/preview-render.log" 2>&1 &
          task_pid=$!
          cleanup_preview() { kill -TERM "$task_pid" 2>/dev/null || true; wait "$task_pid" 2>/dev/null || true; }
          trap cleanup_preview EXIT
          for task_attempt in $(jot 80); do
            if test -s "$AITM_TEST_TASK_ROOT/previews/expanded-dark.png" && test -s "$AITM_TEST_TASK_ROOT/previews/expanded-light.png"; then break; fi
            if ! kill -0 "$task_pid" 2>/dev/null; then echo 'Synthetic preview process exited early.' >&2; exit 1; fi
            sleep 0.5
          done
          test -s "$AITM_TEST_TASK_ROOT/previews/expanded-dark.png"
          test -s "$AITM_TEST_TASK_ROOT/previews/expanded-light.png"
          /bin/cp "$AITM_TEST_TASK_ROOT/previews/expanded-dark.png" "$AITM_TEST_TASK_ROOT/out/synthetic-expanded-dark.png"
          /bin/cp "$AITM_TEST_TASK_ROOT/previews/expanded-light.png" "$AITM_TEST_TASK_ROOT/out/synthetic-expanded-light.png"
          echo 'Saved built-in preview of the exact app with synthetic tasks; this is not a capture of a real session.'
      - name: Create and verify candidate disk image
        if: ${{ matrix.runner == 'macos-26' }}
        id: image
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$RUNNER_TEMP" = /Users/runner/work/_temp
          cd "$AITM_TEST_TASK_ROOT/source/macos"
          test "$(pwd -P)" = "$AITM_TEST_TASK_ROOT/source/macos"
          test -d dist
          test ! -L dist
          test -d "dist/AI Task Monitor.app"
          test ! -L "dist/AI Task Monitor.app"
          test ! -e "dist/AITaskMonitor-macOS-0.3.9-alpha.dmg"
          test ! -L "dist/AITaskMonitor-macOS-0.3.9-alpha.dmg"
          mkdir -p "$AITM_TEST_TASK_ROOT/system-home"
          test ! -L "$AITM_TEST_TASK_ROOT/system-home"
          profile='(version 1) (allow default) (deny network*) (allow network* (local unix-socket)) (allow network-outbound (remote unix-socket))'
          run_dmg_system() {
            /usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin "DEVELOPER_DIR=$DEVELOPER_DIR" \
              "TMPDIR=$AITM_TEST_TASK_ROOT/temp" "CFFIXED_USER_HOME=$AITM_TEST_TASK_ROOT/system-home" \
              "AITM_TEST_TASK_ROOT=$AITM_TEST_TASK_ROOT" "RUNNER_TEMP=$RUNNER_TEMP" \
              CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=macOS \
              /usr/bin/sandbox-exec -p "$profile" "$@"
          }
          run_dmg_system /bin/bash -c 'test -z "${HOME+x}" && test -z "${CODEX_HOME+x}"'
          run_dmg_system /bin/bash ./scripts/create-dmg.sh
          cd dist
          run_dmg_system /usr/bin/shasum -a 256 -c SHA256SUMS-macOS.txt
          task_dmg="$PWD/AITaskMonitor-macOS-0.3.9-alpha.dmg"
          test -f "$task_dmg"
          test ! -L "$task_dmg"
          run_dmg_system /usr/bin/hdiutil verify "$task_dmg"
          /bin/cp "$task_dmg" "$PWD/SHA256SUMS-macOS.txt" "$AITM_TEST_TASK_ROOT/out/"
          printf '%s\n' 'TEST CANDIDATE ONLY: ad-hoc signature; not notarized; not a published release.' > "$AITM_TEST_TASK_ROOT/out/NOT-A-RELEASE.txt"
          cat > "$AITM_TEST_TASK_ROOT/dmg-owner.py" <<'PY'
          """Mount and inspect only this job's test image, cleaning up even on attach failure."""
          import os
          from pathlib import Path
          import plistlib
          import re
          import signal
          import subprocess
          import sys
          
          
          def hdi_info():
              result = subprocess.run(["/usr/bin/hdiutil", "info", "-plist"], check=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=30)
              value = plistlib.loads(result.stdout)
              images = value.get("images")
              if not isinstance(images, list):
                  raise RuntimeError("Unexpected hdiutil info format")
              return images
          
          
          def matching_attachment(images, image_path, mount_path):
              """Return only an unambiguous attachment of our exact image, or None."""
              own = []
              for image in images:
                  if not isinstance(image, dict) or not isinstance(image.get("system-entities", []), list):
                      raise RuntimeError("Unexpected hdiutil image entry")
                  entities = image.get("system-entities", [])
                  if not all(isinstance(entity, dict) for entity in entities):
                      raise RuntimeError("Unexpected hdiutil entity")
                  mounted = [Path(entity["mount-point"]).resolve() for entity in entities
                             if isinstance(entity.get("mount-point"), str)]
                  path = image.get("image-path")
                  is_ours = isinstance(path, str) and Path(path).resolve() == image_path
                  if mount_path in mounted and not is_ours:
                      raise RuntimeError("Synthetic mount point belongs to another image")
                  if is_ours:
                      if any(point != mount_path for point in mounted):
                          raise RuntimeError("Test image has an unexpected mount point")
                      roots = {entity.get("dev-entry") for entity in entities
                               if isinstance(entity.get("dev-entry"), str)
                               and re.fullmatch(r"/dev/disk[0-9]+", entity["dev-entry"])}
                      own.append((mounted, roots))
              if len(own) > 1:
                  raise RuntimeError("More than one attachment for the test image")
              return own[0] if own else None
          
          
          def detach_owned(image_path, mount_path):
              """Use the verified mount point or, for an unmounted partial attach, its whole disk."""
              attachment = matching_attachment(hdi_info(), image_path, mount_path)
              if attachment is None:
                  if os.path.ismount(mount_path):
                      raise RuntimeError("Mount point is occupied by an unknown device")
                  return "No test attachment remained"
              mounted, roots = attachment
              if mounted:
                  target = str(mount_path)
              elif len(roots) == 1:
                  target = next(iter(roots))
              else:
                  raise RuntimeError("Cannot safely identify partially attached whole disk")
              subprocess.run(["/usr/bin/hdiutil", "detach", target, "-quiet"], check=True, timeout=60)
              if matching_attachment(hdi_info(), image_path, mount_path) is not None or os.path.ismount(mount_path):
                  raise RuntimeError("Test image remained attached after detach")
              return "Detached verified test image"
          
          
          def run_logged(command, log_path, timeout):
              try:
                  with log_path.open("xb") as log:
                      subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=timeout)
              finally:
                  if log_path.is_file():
                      print(log_path.read_text(encoding="utf-8", errors="replace"), end="", flush=True)
          
          
          def main():
              if (sys.platform != "darwin" or os.environ.get("GITHUB_ACTIONS") != "true" or
                  os.environ.get("RUNNER_ENVIRONMENT") != "github-hosted" or os.environ.get("RUNNER_OS") != "macOS" or
                  "HOME" in os.environ or "CODEX_HOME" in os.environ):
                  raise SystemExit("A disposable hosted runner with a clean environment is required.")
              if len(sys.argv) != 1:
                  raise SystemExit("Unexpected DMG owner arguments")
              root = Path(os.environ["AITM_TEST_TASK_ROOT"])
              if (re.fullmatch(r"/Users/runner/work/_temp/aitm-release-039\.[A-Za-z0-9]{8}", str(root)) is None or
                      root.resolve(strict=True) != root):
                  raise SystemExit("Unexpected synthetic task root")
              temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
              if root.parent != temp:
                  raise SystemExit("Synthetic task root is outside runner temp")
              home = root / "system-home"
              if home.is_symlink() or home.resolve(strict=True) != home or os.environ.get("CFFIXED_USER_HOME") != str(home):
                  raise SystemExit("Unexpected synthetic preferences directory")
              work = root / "source/macos"
              app = work / "dist/AI Task Monitor.app"
              expected_image = work / "dist/AITaskMonitor-macOS-0.3.9-alpha.dmg"
              mount = root / "mount"
              output = root / "out"
              inputs = root / "source/.github/macos-final-build-20261109"
              image = expected_image.resolve(strict=True)
              for path in (work, app, mount, output, inputs):
                  if path.is_symlink() or path.resolve(strict=True) != path or not path.is_dir():
                      raise SystemExit("Unexpected synthetic input or output directory")
              if image != expected_image or not image.is_file() or expected_image.is_symlink():
                  raise SystemExit("Unexpected synthetic DMG")
              if any(mount.iterdir()) or os.path.ismount(mount):
                  raise SystemExit("Synthetic mount point is not empty")
              if matching_attachment(hdi_info(), image, mount) is not None:
                  raise SystemExit("Synthetic image was already attached")
              mounted_app = mount / "AI Task Monitor.app"
              verifier = inputs / "verify-dmg-contents.py"
              if verifier.is_symlink() or not verifier.is_file():
                  raise SystemExit("Missing checked DMG verifier")
              def interrupt(signum, frame):
                  raise InterruptedError("DMG owner received termination")
              previous = signal.signal(signal.SIGTERM, interrupt)
              try:
                  try:
                      run_logged(["/usr/bin/hdiutil", "attach", "-plist", "-readonly", "-nobrowse", "-noautoopen",
                                  "-mountpoint", str(mount), str(image)], output / "mount.log", 180)
                      attachment = matching_attachment(hdi_info(), image, mount)
                      if attachment is None or mount not in attachment[0] or not os.path.ismount(mount):
                          raise RuntimeError("Mounted image identity was not confirmed")
                      checks = [
                          ("dmg-contents.log", ["/usr/bin/python3", "-I", "-S", "-B", str(verifier), str(app), str(mount)]),
                          ("mounted-signature.log", ["/usr/bin/codesign", "--verify", "--deep", "--strict", "--verbose=2", str(mounted_app)]),
                      ]
                      for name, command in checks:
                          run_logged(command, output / name, 180)
                          print(name + ": verified", flush=True)
                  finally:
                      print(detach_owned(image, mount), flush=True)
              finally:
                  signal.signal(signal.SIGTERM, previous)
          
          
          if __name__ == "__main__":
              main()
          PY
          run_dmg_system /usr/bin/python3 -I -S -B "$AITM_TEST_TASK_ROOT/dmg-owner.py"
          echo 'The owned image contents and ad-hoc signature were checked and detached.'
      - name: Build synthetic source and version tests
        id: test_build
        shell: bash
        run: |
          set -euo pipefail
          cd "$AITM_TEST_TASK_ROOT/source/macos"
          test ! -e Tests/AITaskMonitorTests/ReleaseCandidateAuditTests.swift
          "$AITM_TEST_TASK_ROOT/run-isolated" /usr/bin/python3 -I -S -B - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path("Tests/AITaskMonitorTests/ClaudeIntegrationSafetyTests.swift")
          if path.is_symlink():
              raise SystemExit("Unexpected linked synthetic test.")
          data = path.read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          if blob != "f805f855c96c2361331d268e4ea658d005026413":
              raise SystemExit("Unexpected Claude test source.")
          text = data.decode("utf-8")
          old = "            XCTAssertTrue(errors.fileHandleForReading.readDataToEndOfFile().isEmpty)"
          new = ('            let hookError = errors.fileHandleForReading.readDataToEndOfFile()\n'
                 '            XCTAssertTrue(hookError.isEmpty, "Synthetic hook stderr: \\(String(decoding: hookError, as: UTF8.self).prefix(2048))")')
          if text.count(old) != 1:
              raise SystemExit("Unexpected Claude stderr assertion.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          print("Preserved the empty-stderr assertion and added its synthetic diagnostic message.")
          PY
          cat > Tests/AITaskMonitorTests/ReleaseCandidateAuditTests.swift <<'SWIFT'
          import Foundation
          import XCTest
          @testable import AITaskMonitor

          final class ReleaseCandidateAuditTests: XCTestCase {
              func testPriorAlphaDetectsCandidateButCandidateDoesNotOfferItself() throws {
                  let version = "0.3.9-alpha"
                  XCTAssertEqual(AppVersion.sourceVersion, version)
                  let name = "AITaskMonitor-macOS-0.3.9-alpha.dmg"
                  let url = "https://github.com/trueakaru-stack/ai-task-monitor/releases/download/v0.3.9-alpha/" + name
                  let rows: [[String: Any]] = [["tag_name": "v0.3.9-alpha", "draft": false,
                                                "assets": [["name": name, "browser_download_url": url]]]]
                  let data = try JSONSerialization.data(withJSONObject: rows)
                  XCTAssertEqual(ReleaseSelector.select(data: data, currentVersion: "0.3.8-alpha")?.version, version)
                  XCTAssertNil(ReleaseSelector.select(data: data, currentVersion: version))
              }
          }
          SWIFT
          task_swift="$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift"
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          "$task_run" "$task_swift" build --disable-sandbox --build-tests --cache-path "$AITM_TEST_TASK_ROOT/swift-cache" \
            --config-path "$AITM_TEST_TASK_ROOT/swift-config" --security-path "$AITM_TEST_TASK_ROOT/swift-security"
          task_bin="$("$task_run" "$task_swift" build --disable-sandbox --show-bin-path --cache-path "$AITM_TEST_TASK_ROOT/swift-cache" \
            --config-path "$AITM_TEST_TASK_ROOT/swift-config" --security-path "$AITM_TEST_TASK_ROOT/swift-security")"
          test -d "$task_bin/AITaskMonitorPackageTests.xctest"
          printf 'AITM_TEST_BIN=%s\n' "$task_bin" >> "$GITHUB_ENV"
      - name: Verify update candidate selection
