            "$AITM_TEST_BIN/AITaskMonitorPackageTests.xctest" 2>&1 | tee "$AITM_TEST_TASK_ROOT/out/claude-test.log"
          grep -F 'Executed 1 test, with 0 failures' "$AITM_TEST_TASK_ROOT/out/claude-test.log"
