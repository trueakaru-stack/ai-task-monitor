name: macOS integrated Claude provider verification

on:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-integrated-claude-provider-20261109.yml"
      - ".github/combined-audit/claude-provider-20261109/**"

permissions:
  contents: read

jobs:
  native-and-integrations:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[macos-integrated-claude-provider]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select Xcode on macOS 15
        if: ${{ matrix.runner == 'macos-15' }}
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      - name: Verify pinned source and assemble isolated workspace
        id: workspace
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/combined-audit/claude-provider-20261109/scripts/prepare-workspace.sh"
      - name: Prepare pinned public fixtures
        id: fixtures
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/combined-audit/claude-provider-20261109/scripts/prepare-public-fixtures.sh"
      - name: Reproduce regressions and run complete XCTest and release build
        id: native
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/combined-audit/claude-provider-20261109/scripts/native-tests.sh"
      - name: Run isolated agent integration fixtures
        if: ${{ always() && steps.workspace.outcome == 'success' && steps.fixtures.outcome == 'success' }}
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/combined-audit/claude-provider-20261109/scripts/integration-tests.sh"
      - name: Upload synthetic logs and layout evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-integrated-tests-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/aitm-unified-output/
            ${{ runner.temp }}/aitm-layout-${{ github.run_id }}/
            ${{ runner.temp }}/aitm-feedback-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 7

  visual:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[macos-integrated-claude-provider]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select Xcode on macOS 15
        if: ${{ matrix.runner == 'macos-15' }}
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      - name: Verify pinned source and assemble isolated workspace
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/combined-audit/claude-provider-20261109/scripts/prepare-workspace.sh"
      - name: Render synthetic plan and settings states
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/combined-audit/claude-provider-20261109/scripts/visual.sh"
      - name: Upload synthetic previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-integrated-visual-${{ matrix.runner }}
          path: ${{ runner.temp }}/aitm-unified-output/
          if-no-files-found: warn
          retention-days: 7
