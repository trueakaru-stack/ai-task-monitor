name: Synthetic provider V1 recovery
on:
  push:
    branches: [codex/windows-provider-v1-safe-20261116]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [tests]
    env:
      AITM_CI_PART: ${{ matrix.part }}
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Run synthetic provider and channel checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Read-PathState([string]$scope) {
            $key = if ($scope -eq 'User') {
              [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $false)
            } else {
              [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey('SYSTEM\CurrentControlSet\Control\Session Manager\Environment', $false)
            }
            try {
              return [pscustomobject]@{
                Value = [string]$key.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                Kind = [string]$key.GetValueKind('Path')
              }
            } finally { $key.Dispose() }
          }
          $beforeUser = Read-PathState 'User'
          $beforeMachine = Read-PathState 'Machine'
          try {
            $root = Join-Path $env:RUNNER_TEMP ('aitm-provider-v1-' + [guid]::NewGuid().ToString('N'))
            $source = Join-Path $root 'source'
            $template = Join-Path $root 'template'
            $hooks = Join-Path $root 'hooks'
            New-Item -ItemType Directory -Path $source, $template, $hooks -Force | Out-Null
            git -c credential.helper= -c core.hooksPath="$hooks" -c init.defaultBranch=integration init --quiet --template="$template" "$source"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize the synthetic checkout.' }
            git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" fetch --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the exact test revision.' }
            git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" checkout --quiet --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot select the test revision.' }
            # Add the current primary branch's PATH guard and its test fixtures
            # only to this disposable checkout; do not alter the candidate branch.
            git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" fetch --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" 'b8eb77e4d817f2dc80285ae19bfff1f0075e1246'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot fetch the current PATH-safety guard.' }
            git -C "$source" -c core.hooksPath="$hooks" restore --source=b8eb77e4d817f2dc80285ae19bfff1f0075e1246 -- '.github/workflows/windows-dotnet-path-safety.yml' 'windows/native/SelfContainedExperiment' 'windows/tests/Test-DotnetPathSafety.py'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare the current PATH-safety fixtures.' }
            python -B (Join-Path $source 'windows/tests/Test-DotnetPathSafety.py')
            if ($LASTEXITCODE -ne 0) { throw 'The static PATH-safety guard failed.' }
            $command = Get-Command dotnet.exe -CommandType Application | Select-Object -First 1
            if ($null -eq $command) { throw 'The Windows .NET SDK is unavailable.' }
            $sdk = Split-Path -Parent $command.Source
            foreach ($name in @('profile','appdata','localappdata','temp','nuget','dotnet')) {
              $null = [IO.Directory]::CreateDirectory((Join-Path $root $name))
            }
            $config = Join-Path $root 'NuGet.Config'
            [IO.File]::WriteAllText($config, '<configuration><packageSources><clear /></packageSources></configuration>', [Text.UTF8Encoding]::new($false))
            function Invoke-Isolated([string]$executable,[string[]]$arguments) {
              foreach ($argument in $arguments) {
                if ($argument.Contains('"') -or $argument.EndsWith('\')) { throw 'Unsupported synthetic argument.' }
              }
              $info = New-Object Diagnostics.ProcessStartInfo
              $info.FileName = $executable
              $info.Arguments = ($arguments | ForEach-Object { '"' + $_ + '"' }) -join ' '
              $info.WorkingDirectory = $root
              $info.UseShellExecute = $false
              $info.CreateNoWindow = $true
              $info.RedirectStandardOutput = $true
              $info.RedirectStandardError = $true
              $info.EnvironmentVariables.Clear()
              $values = @{
                SystemRoot=$env:SystemRoot; windir=$env:SystemRoot
                PATH=($sdk + ';' + (Join-Path $env:SystemRoot 'System32') + ';' + $env:SystemRoot)
                DOTNET_ROOT=$sdk; DOTNET_MULTILEVEL_LOOKUP='0'; DOTNET_ADD_GLOBAL_TOOLS_TO_PATH='0'
                DOTNET_CLI_HOME=(Join-Path $root 'dotnet'); DOTNET_CLI_TELEMETRY_OPTOUT='1'
                DOTNET_GENERATE_ASPNET_CERTIFICATE='0'; DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE='1'
                NUGET_PACKAGES=(Join-Path $root 'nuget'); USERPROFILE=(Join-Path $root 'profile')
                APPDATA=(Join-Path $root 'appdata'); LOCALAPPDATA=(Join-Path $root 'localappdata')
                TEMP=(Join-Path $root 'temp'); TMP=(Join-Path $root 'temp')
                CI=$env:CI; GITHUB_ACTIONS=$env:GITHUB_ACTIONS; RUNNER_ENVIRONMENT=$env:RUNNER_ENVIRONMENT
                RUNNER_OS=$env:RUNNER_OS; RUNNER_TEMP=$env:RUNNER_TEMP
              }
              foreach ($name in @('ProgramFiles','ProgramFiles(x86)','ProgramW6432','ProgramData','ALLUSERSPROFILE','SystemDrive','ComSpec')) {
                $value = [Environment]::GetEnvironmentVariable($name)
                if (-not [string]::IsNullOrEmpty($value)) { $values[$name] = $value }
              }
              foreach ($key in $values.Keys) { $info.EnvironmentVariables[$key] = [string]$values[$key] }
              $process = [Diagnostics.Process]::Start($info)
              try {
                $stdout = $process.StandardOutput.ReadToEndAsync()
                $stderr = $process.StandardError.ReadToEndAsync()
                if (-not $process.WaitForExit(180000)) { $process.Kill($true); throw 'The synthetic provider check timed out.' }
                if ($process.ExitCode -ne 0) { throw ("The synthetic provider check failed: " + $stdout.Result + $stderr.Result) }
                if ($stdout.Result) { Write-Output $stdout.Result.TrimEnd() }
                if ($stderr.Result) { Write-Output $stderr.Result.TrimEnd() }
              } finally { $process.Dispose() }
            }
            $powershell = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
            if ($env:AITM_CI_PART -eq 'tests') {
              $artifacts = Join-Path $root 'artifacts'
              $project = Join-Path $source 'windows/native/Tests/ProviderV1Recovery/ProviderV1Recovery.Tests.csproj'
              $dotnet = Join-Path $sdk 'dotnet.exe'
              Invoke-Isolated $dotnet @('build', $project, '-c', 'Release', '--configfile', $config, '--artifacts-path', $artifacts, '-p:NuGetAudit=false', '--nologo')
              $assembly = Join-Path $artifacts 'bin/ProviderV1Recovery.Tests/release/AITaskMonitor.ProviderV1Recovery.Tests.dll'
              Invoke-Isolated $dotnet @($assembly)
              Invoke-Isolated $powershell @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',(Join-Path $source 'windows/tests/Test-ProviderV1Recovery.ps1'))
              foreach ($test in @('Test-ExternalProviderState.ps1','Test-ExternalProviderView.ps1',
                'Test-ExternalProviderRuntime.ps1','Test-ExternalProviderController.ps1',
                'Test-ExternalProviderScopeIsolation.ps1','Test-ExternalProviderIsolation.ps1',
                'Test-HermesObserverState.ps1','Test-ExternalSourceSnapshot.ps1')) {
                Invoke-Isolated $powershell @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',(Join-Path $source "windows/tests/$test"))
              }
            } else {
            $screenshots = Join-Path $root 'screenshots'
            $null = [IO.Directory]::CreateDirectory($screenshots)
            foreach ($warning in @('partial-data','partial-both')) {
              foreach ($theme in @('light','dark')) {
                foreach ($language in @('ru','en')) {
                  foreach ($mode in @('expanded','compact')) {
                  $stem = "$warning-$theme-$language-$mode"
                  $arguments = @('-NoProfile','-STA','-NonInteractive','-ExecutionPolicy','Bypass','-File',
                    (Join-Path $source 'windows/app/CodexProgress.ps1'),'-PreviewActiveTasks','1',
                    '-PreviewSourceWarning',$warning,'-PreviewOffscreen','-ThemeOverride',$theme,'-LanguageOverride',$language,
                    '-DiagnosticDirectory',(Join-Path $root "temp/diagnostic-$stem"),
                    '-PreferencesFile',(Join-Path $root "temp/preferences-$stem.json"),
                    '-SnapshotFile',(Join-Path $screenshots "$stem.png"))
                  if ($mode -eq 'compact') { $arguments += '-CompactMode' }
                  Invoke-Isolated $powershell $arguments
                  if (-not [IO.File]::Exists((Join-Path $screenshots "$stem.png"))) { throw "Missing $stem screenshot." }
                  }
                }
              }
            }
            }
          } finally {
            foreach ($scope in @('User', 'Machine')) {
              $before = if ($scope -eq 'User') { $beforeUser } else { $beforeMachine }
              $after = Read-PathState $scope
              if ($after.Value -cne $before.Value -or $after.Kind -cne $before.Kind) {
                throw "$scope PATH changed during the integration test."
              }
            }
          }
      - name: Preserve synthetic warning screenshots
        if: always() && matrix.part == 'screenshots'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-provider-warning
          path: ${{ runner.temp }}/aitm-provider-v1-*/screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
