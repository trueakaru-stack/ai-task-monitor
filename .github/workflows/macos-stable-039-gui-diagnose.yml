        if: ${{ always() && env.AITM_TEST_TASK_ROOT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gui-039-alpha-${{ matrix.runner }}
          path: ${{ env.AITM_TEST_TASK_ROOT }}/out/
          if-no-files-found: warn
          retention-days: 7
      - name: Prepare stable environment
        shell: bash
        run: |
          set -euo pipefail
