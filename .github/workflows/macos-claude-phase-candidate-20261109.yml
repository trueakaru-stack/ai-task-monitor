name: macOS Claude phase candidate synthetic tests

on:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-claude-phase-candidate-20261109.yml"
      - ".github/claude-audit/phase-20261109/**"

permissions:
  contents: read

jobs:
  candidate-tests:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[claude-phase-candidate]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Check disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Select Xcode on macOS 15
        if: ${{ matrix.runner == 'macos-15' }}
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      - name: Verify and stage synthetic candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git diff --quiet 96f6ab5f88c60a528f39f93ade610830893d7d13 "$GITHUB_SHA" -- macos
          INPUT="$GITHUB_WORKSPACE/.github/claude-audit/phase-20261109"
          cd "$INPUT"
          printf '%s  %s\n' \
            '78a663ec67aa4615fc87ce75a68f70f5d3d6823a3db0a0c954eb0fdf4fb5939a' ClaudeHook.swift \
            'f593692d96f8a6ac3c1cbac11c4a275c35a5e325097684ba9224faf497f79172' ClaudeIntegration.swift \
            '6074db67e1ed3e8ac5937aea6f504e2de8e481662a3c66d0563316fe75da687c' ClaudeJSONValidation.swift \
            '2c1ea102a9c4309ee32e945d33a5509243876e05534d3c834265eb0f6a7e4282' ClaudeLoopChannel.swift \
            'cb2a3d3ed31028b5b258d68c2507bbde08fda990d0668f1956ec94eb86f8f8eb' ClaudeLoopDetection.swift \
            'b6092cf88f0b02cfbb1a47f0d6ef38649983461f65da4ae1090b819a28f3970f' ClaudePhaseEvidence.swift \
            'f65173ed28ce075323d51044547c15346a11d6f1ffc9adc82a17f37df7752d68' ClaudeTaskReader.swift \
            'c52dc72b1d1ebbd07f545283fe483b7c3a1ec279d2844c861c4538669500b225' TaskStore.swift \
            '72990f0db2302e122dbbeac99eb4f1c0a4775ce9ff422c0327beafa4e61c8f9e' ClaudePhaseIntegrationTests.swift \
            '61143d15e9efbebec4c2d9db66989879929d517acbd226f29a0b28111daaeb02' ClaudeIdentityInvalidUTF8Tests.swift \
            '9a359fcefcefd9b46a42f7b888c7f5a6ea96e39abb797e2049302891557fc674' ClaudeHookPhaseBlockingTests.swift \
            'f4804a47e08373a80b5430b91233ebea72049bac1535758de0cb302f541915b1' ClaudeReaderIndependentTests.swift \
            '812258f924d34d040b111bc1b44e843321599e6181138136ce2d2875d7f21ed1' ClaudeReaderSafetyCandidateTests.swift \
            '36c1b723845b75119e97d39a0d5698cecd48ced65ed1da6ffadebbe1316c7ce1' ClaudePlanOrderingCandidateTests.swift \
            '43e4be4f9cf87edb1716b1faa389006031d4b616f45aa8f086663bfd81522c33' ParserTests.swift \
            '723727c08f0d62355a4bb304aba2795e788a1230cb1acc8184b995f5146262e1' ClaudeIntegrationSafetyTests.swift \
            '1331aea90ce93bdba4cfd38dc380d5a6c4bbc85ee1e4984f5a9bb5295454116c' ClaudePhaseChannelTests.swift \
            '7abf0c786dc28555e249ddc2e6300be62b88513e4459d452577ebbc7a1551b86' ClaudePhaseIndependentCounterexamples.swift \
            '8f7a63f9b5d957a9ff9db01fe179f0eba9ec8198a9d3769c3b5013eec336efcc' ClaudeBackgroundIndependentTests.swift \
            'efa0a512f5fe58c46975a19ccbee7f56e478f869f211e1d4266bea0c70ec9d88' ClaudePhaseUnresolvedTests.swift \
            | shasum -a 256 -c -
          for name in ClaudeHook.swift ClaudeIntegration.swift ClaudeJSONValidation.swift ClaudeLoopChannel.swift ClaudeLoopDetection.swift ClaudePhaseEvidence.swift ClaudeTaskReader.swift TaskStore.swift; do
            cp "$INPUT/$name" "$GITHUB_WORKSPACE/macos/Sources/AITaskMonitor/$name"
          done
          for name in ClaudePhaseIntegrationTests.swift ClaudeIdentityInvalidUTF8Tests.swift ClaudeHookPhaseBlockingTests.swift ClaudeReaderIndependentTests.swift ClaudeReaderSafetyCandidateTests.swift ClaudePlanOrderingCandidateTests.swift ParserTests.swift ClaudeIntegrationSafetyTests.swift ClaudePhaseChannelTests.swift ClaudePhaseIndependentCounterexamples.swift ClaudeBackgroundIndependentTests.swift ClaudePhaseUnresolvedTests.swift; do
            cp "$INPUT/$name" "$GITHUB_WORKSPACE/macos/Tests/AITaskMonitorTests/$name"
          done
      - name: Run synthetic suites with IP denied
        shell: bash
        working-directory: macos
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aitm-phase-home" "$RUNNER_TEMP/aitm-phase-tmp" "$RUNNER_TEMP/aitm-phase-support"
          DEVELOPER="$(xcode-select -p)"
          PROFILE='(version 1) (allow default) (deny network*) (allow network* (local unix-socket)) (allow network-outbound (remote unix-socket))'
          cat > "$RUNNER_TEMP/aitm-phase-network-probe.py" <<'PY'
          import errno
          import os
          import socket
          import sys

          for family, destination in ((socket.AF_INET, ("127.0.0.1", 0)), (socket.AF_INET6, ("::1", 0))):
              try:
                  internet = socket.socket(family, socket.SOCK_STREAM)
              except OSError as error:
                  if error.errno not in (errno.EPERM, errno.EACCES): raise
              else:
                  try:
                      if internet.connect_ex(destination) not in (errno.EPERM, errno.EACCES): sys.exit(1)
                  finally:
                      internet.close()
          path = "/private/tmp/aitm-phase-probe-" + str(os.getpid())
          server = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          try:
              server.bind(path)
              server.listen(1)
              client.connect(path)
              peer, _ = server.accept()
              peer.close()
          finally:
              client.close()
              server.close()
              if os.path.exists(path): os.unlink(path)
          print("Network probe: IPv4/IPv6 denied; synthetic local Unix socket allowed")
          PY
          run_isolated() {
            /usr/bin/env -i "PATH=/usr/bin:/bin" "DEVELOPER_DIR=$DEVELOPER" \
              "CFFIXED_USER_HOME=$RUNNER_TEMP/aitm-phase-home" \
              "TMPDIR=$RUNNER_TEMP/aitm-phase-tmp/" \
              "AI_TASK_MONITOR_SUPPORT_DIR=$RUNNER_TEMP/aitm-phase-support" \
              "AITM_CLAUDE_TEST_EXECUTABLE=$GITHUB_WORKSPACE/macos/.build/debug/AITaskMonitor" \
              /usr/bin/sandbox-exec -p "$PROFILE" "$@"
          }
          run_isolated /usr/bin/python3 -I -S -B "$RUNNER_TEMP/aitm-phase-network-probe.py"
          run_isolated /usr/bin/xcrun swift build --disable-sandbox
          audit_status=0
          for entry in ClaudePhaseIntegrationTests:30 ClaudeIdentityInvalidUTF8Tests:4 ClaudeHookPhaseBlockingTests:1 ClaudeReaderIndependentTests:13 ClaudeReaderSafetyCandidateTests:6 ClaudePlanOrderingCandidateTests:14 ParserTests:23 ClaudeHookLockTests:1 ClaudeLoopChannelTests:9 ClaudeLoopDetectionTests:7 ClaudeRetentionTests:3 ClaudeIntegrationSafetyTests:11 ClaudePlanLabelTests:2 ClaudePhaseChannelTests:13 ClaudePhaseIndependentCounterexamples:7 ClaudeBackgroundIndependentTests:1 ClaudePhaseUnresolvedTests:2; do
            suite="${entry%:*}"
            count="${entry#*:}"
            log="$RUNNER_TEMP/aitm-phase-$suite.log"
            if ! run_isolated /usr/bin/xcrun swift test --disable-sandbox --filter "$suite" 2>&1 | /usr/bin/tee "$log"; then
              audit_status=1
            fi
            if ! /usr/bin/grep -Eq "Executed $count tests?, with 0 failures" "$log"; then
              printf '%s\n' "Missing successful expected test count: $suite"
              audit_status=1
            fi
          done
          if ! run_isolated /usr/bin/xcrun swift build --disable-sandbox --configuration release; then
            audit_status=1
          fi
          exit "$audit_status"
