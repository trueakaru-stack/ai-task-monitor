name: Publish verified Windows 0.2.10
on:
  push:
    branches:
      - codex/windows-publish-v0210-20261118-a
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify CI artifact and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="trueakaru-stack/ai-task-monitor"
          source_revision="4fb0d209befc3bcec732a2fa78cb0c94b75a6f10"
          ci_head="c32f77b1fd5dd81d4a5c6dc7c08b9614c38906a7"
          run_id="44284739983"
          visual_run_id="44284728999"
          artifact_id="14418307854"
          zip_sha="fb74426a60789408b11a6b5fd3b5d02e749b49892260ac45e294bc27f6dc0c70"
          setup_sha="ed73fc016b66944d353443556cfb53f09b98d6757c1716c3513ed7ddb72d00d1"
          tag="v0.2.10"
          test "$GITHUB_REPOSITORY" = "$repo"
          run_json="$(gh api "repos/$repo/actions/runs/$run_id")"
          test "$(jq -r .status <<<"$run_json")" = "completed"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .head_sha <<<"$run_json")" = "$ci_head"
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/windows-installer-0210-final.yml"
          test "$(gh api "repos/$repo/actions/runs/$visual_run_id" --jq .conclusion)" = "success"
          test "$(gh api "repos/$repo/git/ref/heads/windows" --jq .object.sha)" = "$source_revision"
          artifact_json="$(gh api "repos/$repo/actions/artifacts/$artifact_id")"
          test "$(jq -r .workflow_run.id <<<"$artifact_json")" = "$run_id"
          test "$(jq -r .workflow_run.head_sha <<<"$artifact_json")" = "$ci_head"
          test "$(jq -r .name <<<"$artifact_json")" = "verified-windows-0210-$source_revision"
          test "$(jq -r .digest <<<"$artifact_json")" = "sha256:$zip_sha"
          test "$(jq -r .expired <<<"$artifact_json")" = "false"
          archive="$RUNNER_TEMP/windows-0210-artifact.zip"
          gh api "repos/$repo/actions/artifacts/$artifact_id/zip" > "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$zip_sha"
          printf '%s\n' AITaskMonitorSetup.exe SHA256SUMS-windows.txt SOURCE-REVISION.txt | LC_ALL=C sort > "$RUNNER_TEMP/expected-files"
          unzip -Z1 "$archive" | LC_ALL=C sort > "$RUNNER_TEMP/artifact-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/artifact-files"
          mkdir "$RUNNER_TEMP/verified-windows"
          unzip -q "$archive" -d "$RUNNER_TEMP/verified-windows"
          cd "$RUNNER_TEMP/verified-windows"
          test "$(tr -d '\r\n' < SOURCE-REVISION.txt)" = "$source_revision"
          test "$(sha256sum AITaskMonitorSetup.exe | cut -d' ' -f1)" = "$setup_sha"
          test "$(tr -d '\r' < SHA256SUMS-windows.txt)" = "$setup_sha  AITaskMonitorSetup.exe"
          mkdir "$RUNNER_TEMP/windows-release"
          cp AITaskMonitorSetup.exe "$RUNNER_TEMP/windows-release/AITaskMonitorSetup-0.2.10.exe"
          cd "$RUNNER_TEMP/windows-release"
          sha256sum AITaskMonitorSetup-0.2.10.exe > SHA256SUMS-windows.txt
          checksum_sha="$(sha256sum SHA256SUMS-windows.txt | cut -d' ' -f1)"
          if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to replace it."
            exit 1
          fi
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release already exists; refusing to replace it."
            exit 1
          fi
          previous_latest="$(gh api "repos/$repo/releases/latest" --jq .tag_name)"
          gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$source_revision" >/dev/null
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.type)" = "commit"
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)" = "$source_revision"
          cat > "$RUNNER_TEMP/windows-release-notes.md" <<'NOTES'
          Обновление Windows: выровнены боковые отступы содержимого задачи в компактном окне.

          Windows update: balanced the horizontal insets of task content in compact mode.
          NOTES
          gh release create "$tag" AITaskMonitorSetup-0.2.10.exe SHA256SUMS-windows.txt --repo "$repo" --verify-tag --draft --latest=false --title "AI Task Monitor 0.2.10 — Windows" --notes-file "$RUNNER_TEMP/windows-release-notes.md"
          gh api "repos/$repo/releases?per_page=100" > "$RUNNER_TEMP/windows-releases.json"
          release_id="$(jq -er --arg tag "$tag" '[.[] | select(.tag_name == $tag and .draft == true) | .id] | if length == 1 then .[0] else error("Draft not unique") end' "$RUNNER_TEMP/windows-releases.json")"
          gh api "repos/$repo/releases/$release_id" > "$RUNNER_TEMP/windows-draft.json"
          jq -e --arg tag "$tag" '.tag_name == $tag and .draft == true and .prerelease == false and (.assets | length) == 2' "$RUNNER_TEMP/windows-draft.json" >/dev/null
          jq -e --arg sha "sha256:$setup_sha" '[.assets[] | select(.name == "AITaskMonitorSetup-0.2.10.exe" and .state == "uploaded" and .size == 1426944 and .digest == $sha)] | length == 1' "$RUNNER_TEMP/windows-draft.json" >/dev/null
          jq -e --arg sha "sha256:$checksum_sha" '[.assets[] | select(.name == "SHA256SUMS-windows.txt" and .state == "uploaded" and .digest == $sha)] | length == 1' "$RUNNER_TEMP/windows-draft.json" >/dev/null
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)" = "$source_revision"
          test "$(gh api "repos/$repo/git/ref/heads/windows" --jq .object.sha)" = "$source_revision"
          gh api --method PATCH "repos/$repo/releases/$release_id" -F draft=false -f make_latest=false > "$RUNNER_TEMP/windows-published.json"
          jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false and .prerelease == false and (.assets | length) == 2' "$RUNNER_TEMP/windows-published.json" >/dev/null
          test "$(gh api "repos/$repo/releases/latest" --jq .tag_name)" = "$previous_latest"
          echo "Published https://github.com/$repo/releases/tag/$tag"
