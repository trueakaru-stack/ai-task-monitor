name: macOS Claude plan visual candidate

on:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-claude-plan-visual-20261109.yml"
      - ".github/claude-audit/plan-visual-20261109/**"

permissions:
  contents: read

jobs:
  compare:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[claude-plan-visual]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Select Xcode on macOS 15
        if: ${{ matrix.runner == 'macos-15' }}
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      - name: Verify test inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git diff --quiet cf9dce5918011a581f68193c74fdda196f23d35b "$GITHUB_SHA" -- macos
          cd "$GITHUB_WORKSPACE/.github/claude-audit/plan-visual-20261109"
          printf '%s  %s\n' \
            '7c8b0fbe144458ea5ad3622df303e8aba39331f95804c559329186e9856e2090' TaskCardView.swift \
            '9332bf7142fead0bdad1bdf8f9adf067bee585d5a3135b3ed6f7a245af45b76c' SnapshotRenderer.swift \
            '81fd267e3445c0fc77af00479c441ed701d0aea5a2479dbfbc1b70277d273760' RootView.swift \
            '54219cf61c1deb4a9e344f1665aec93e12f21e521950c0dc218e6b170e596832' Models.swift \
            '8462d208aa6b11c03c5f0effb232e2a64d94215f3fb1618cfca89bbd8fdd68d3' ClaudePlanLabelTests.swift \
            | shasum -a 256 -c -
      - name: Render both variants without network
        shell: bash
        working-directory: macos
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aitm-claude-plan-home" "$RUNNER_TEMP/aitm-claude-plan-tmp" \
            "$RUNNER_TEMP/aitm-claude-plan-support" "$RUNNER_TEMP/aitm-claude-plan/base" \
            "$RUNNER_TEMP/aitm-claude-plan/candidate"
          DEVELOPER="$(xcode-select -p)"
          PROFILE='(version 1) (allow default) (deny network*)'
          cat > "$RUNNER_TEMP/aitm-claude-plan-network-probe.py" <<'PY'
          import errno
          import socket
          import sys

          try:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          except OSError as error:
              sys.exit(0 if error.errno in (errno.EPERM, errno.EACCES) else 1)
          try:
              result = sock.connect_ex(("127.0.0.1", 0))
          finally:
              sock.close()
          sys.exit(0 if result in (errno.EPERM, errno.EACCES) else 1)
          PY
          run_isolated() {
            /usr/bin/env -i "PATH=/usr/bin:/bin" "DEVELOPER_DIR=$DEVELOPER" \
              "CFFIXED_USER_HOME=$RUNNER_TEMP/aitm-claude-plan-home" \
              "TMPDIR=$RUNNER_TEMP/aitm-claude-plan-tmp/" \
              "AI_TASK_MONITOR_SUPPORT_DIR=$RUNNER_TEMP/aitm-claude-plan-support" \
              "AITM_CLAUDE_PLAN_PREVIEW_ONLY=1" \
              /usr/bin/sandbox-exec -p "$PROFILE" "$@"
          }
          run_isolated /usr/bin/python3 -I -S -B "$RUNNER_TEMP/aitm-claude-plan-network-probe.py"
          INPUT="$GITHUB_WORKSPACE/.github/claude-audit/plan-visual-20261109"
          cp "$INPUT/SnapshotRenderer.swift" Sources/AITaskMonitor/SnapshotRenderer.swift
          run_isolated /usr/bin/xcrun swift build --disable-sandbox
          run_isolated .build/debug/AITaskMonitor --render-previews "$RUNNER_TEMP/aitm-claude-plan/base"
          for name in TaskCardView.swift RootView.swift Models.swift; do
            cp "$INPUT/$name" "Sources/AITaskMonitor/$name"
          done
          cp "$INPUT/ClaudePlanLabelTests.swift" Tests/AITaskMonitorTests/ClaudePlanLabelTests.swift
          run_isolated /usr/bin/xcrun swift test --disable-sandbox --filter ClaudePlanLabelTests 2>&1 | /usr/bin/tee "$RUNNER_TEMP/aitm-claude-plan-label-tests.log"
          /usr/bin/grep -Eq 'Executed 2 tests?, with 0 failures' "$RUNNER_TEMP/aitm-claude-plan-label-tests.log"
          for suite in ParserTests ExternalProviderStateTests; do
            run_isolated /usr/bin/xcrun swift test --disable-sandbox --filter "$suite" 2>&1 | /usr/bin/tee "$RUNNER_TEMP/aitm-claude-plan-$suite.log"
            /usr/bin/grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$RUNNER_TEMP/aitm-claude-plan-$suite.log"
          done
          run_isolated /usr/bin/xcrun swift build --disable-sandbox
          run_isolated .build/debug/AITaskMonitor --render-previews "$RUNNER_TEMP/aitm-claude-plan/candidate"
          for variant in base candidate; do
            count="$(find "$RUNNER_TEMP/aitm-claude-plan/$variant" -name '*.png' -type f | wc -l | tr -d ' ')"
            test "$count" = 24
          done
      - name: Upload synthetic comparisons
        uses: actions/upload-artifact@v4
        with:
          name: macos-claude-plan-visual-${{ matrix.runner }}
          path: ${{ runner.temp }}/aitm-claude-plan/
          if-no-files-found: error
          retention-days: 7
