name: Synthetic Windows display preferences
on:
  push:
    branches: [codex/claude-settings-visual-20261116]
permissions:
  contents: read
jobs:
  display-preferences:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: '0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check isolated preferences and WPF build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP ('aitm-display-source-'+[guid]::NewGuid().ToString('N'))
          $source=Join-Path $root 'source'
          $template=Join-Path $root 'template'
          $hooks=Join-Path $root 'hooks'
          New-Item -ItemType Directory -Path $source,$template,$hooks | Out-Null
          $env:GIT_CONFIG_NOSYSTEM='1'
          $env:GIT_CONFIG_GLOBAL=Join-Path $root 'empty.gitconfig'
          [IO.File]::WriteAllText($env:GIT_CONFIG_GLOBAL,'')
          $env:GIT_TERMINAL_PROMPT='0'
          git -c credential.helper= -c core.hooksPath="$hooks" init --quiet --template="$template" "$source"
          if($LASTEXITCODE -ne 0){throw 'Cannot initialize source checkout.'}
          git -C "$source" -c credential.helper= -c core.hooksPath="$hooks" fetch --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" "$env:GITHUB_SHA"
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch the exact source revision.'}
          git -C "$source" -c core.hooksPath="$hooks" checkout --quiet --detach FETCH_HEAD
          if($LASTEXITCODE -ne 0){throw 'Cannot select the exact source revision.'}
          $released=Join-Path $root 'released'
          New-Item -ItemType Directory -Path $released | Out-Null
          git -c credential.helper= -c core.hooksPath="$hooks" init --quiet --template="$template" "$released"
          if($LASTEXITCODE -ne 0){throw 'Cannot initialize released source checkout.'}
          git -C "$released" -c credential.helper= -c core.hooksPath="$hooks" fetch --no-tags --depth=1 "https://github.com/$env:GITHUB_REPOSITORY.git" 'a04da15354b9d49b368df7ee0e46e0e2527b5d7c'
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch the published Windows release.'}
          git -C "$released" -c core.hooksPath="$hooks" checkout --quiet --detach FETCH_HEAD
          if($LASTEXITCODE -ne 0){throw 'Cannot select the published Windows release.'}
          $env:AITM_RELEASE_SOURCE=$released
          & (Join-Path $source '.github/display-settings-ci/Run.ps1')
      - name: Preserve synthetic settings frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-settings-frames
          path: |
            ${{ runner.temp }}/aitm-display-*/settings-*.png
            ${{ runner.temp }}/aitm-display-*/source-*.png
            ${{ runner.temp }}/aitm-display-*/released-*.png
          if-no-files-found: ignore
          retention-days: 7
