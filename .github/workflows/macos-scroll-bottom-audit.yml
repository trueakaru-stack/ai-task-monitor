name: macOS synthetic bottom-to-short scroll

on:
  workflow_dispatch:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-scroll-bottom-audit.yml"
      - ".github/audits/ScrollAutohideBottomAuditTests.swift"
      - ".github/audits/generate-scroll-bottom.py"

permissions:
  contents: read

jobs:
  bottom-scroll:
    if: ${{ github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[tests-only]') && contains(github.event.head_commit.message, '[scroll-bottom-audit]')) }}
    name: synthetic bottom-to-short scroll (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Checkout audit tools
        uses: actions/checkout@v4
        with:
          path: audit-control
          persist-credentials: false
      - name: Checkout pinned application source
        uses: actions/checkout@v4
        with:
          ref: 835ad09e98efb59546a8b850b8b8c2777323b581
          path: pinned-source
          persist-credentials: false
      - name: Select Xcode for macOS 15
        if: ${{ matrix.runner == 'macos-15' }}
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      - name: Check isolated variants
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          status=0
          for variant in baseline autohide; do
            project="$RUNNER_TEMP/aitm-scroll-bottom-code-$variant"
            output="$RUNNER_TEMP/aitm-layout-bottom-$variant"
            test ! -e "$project"
            mkdir -p "$project" "$output"
            cp -R "$GITHUB_WORKSPACE/pinned-source/macos/." "$project/"
            cp "$GITHUB_WORKSPACE/audit-control/.github/audits/ScrollWideProbes.swift" "$project/Sources/AITaskMonitor/"
            cp "$GITHUB_WORKSPACE/audit-control/.github/audits/ScrollAutohideBottomAuditTests.swift" "$project/Tests/AITaskMonitorTests/"
            if ! python3 "$GITHUB_WORKSPACE/audit-control/.github/audits/generate-scroll-wide.py" "$project" baseline "$output"; then
              status=1
              continue
            fi
            if [[ "$variant" == autohide ]]; then
              if ! python3 "$GITHUB_WORKSPACE/audit-control/.github/audits/generate-scroll-autohide.py" "$project" "$output"; then
                status=1
                continue
              fi
            fi
            if ! python3 "$GITHUB_WORKSPACE/audit-control/.github/audits/generate-scroll-bottom.py" "$project" "$output"; then
              status=1
              continue
            fi
            for file in RootView.swift TaskCardView.swift OverlayScrollerProbe.swift TaskStore.swift; do
              if diff -u "$GITHUB_WORKSPACE/pinned-source/macos/Sources/AITaskMonitor/$file" "$project/Sources/AITaskMonitor/$file" > "$output/$file.patch"; then
                :
              else
                test "$?" -eq 1 || status=1
              fi
            done
            export AITM_LAYOUT_SYNTHETIC_CI=1
            export AITM_LAYOUT_SYNTHETIC_ROOT="$output"
            export AITM_SCROLL_VARIANT="$variant"
            if ! (cd "$project" && swift test --filter ScrollAutohideBottomAuditTests); then status=1; fi
            test -s "$output/bottom-geometry.json" || status=1
          done
          exit "$status"
      - name: Document scope
        if: ${{ always() }}
        shell: bash
        run: |
          printf '%s\n' 'Synthetic tasks and in-process scrolling only; no product change, no installer, and no full reconnect regression.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload synthetic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-scroll-bottom-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/aitm-layout-bottom-*/
          if-no-files-found: warn
          retention-days: 7
