name: macOS synthetic layout audit

on:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-layout-audit.yml"
      - "macos/Tests/AITaskMonitorTests/WindowLayoutAuditTests.swift"
      - "macos/Sources/AITaskMonitor/RootView.swift"
      - "macos/Sources/AITaskMonitor/UpdateDialog.swift"
      - "macos/Sources/AITaskMonitor/TaskStore.swift"
      - "macos/Sources/AITaskMonitor/SnapshotRenderer.swift"

permissions:
  contents: read

jobs:
  window-layout:
    if: ${{ contains(github.event.head_commit.message, '[tests-only]') && contains(github.event.head_commit.message, '[layout-audit]') }}
    name: synthetic window layout (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout candidate at the triggering commit
        uses: actions/checkout@v4
      - name: Checkout pinned baseline
        uses: actions/checkout@v4
        with:
          ref: c034eef660922c9a06ee601e6ab9f8eac22b7889
          path: baseline-layout
      - name: Select Xcode for macOS 15
        if: ${{ matrix.runner == 'macos-15' }}
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      - name: Verify download guard before synthetic clicks
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          candidate = pathlib.Path('macos/Sources/AITaskMonitor/UpdateDialog.swift').read_text(encoding='utf-8')
          baseline = pathlib.Path('baseline-layout/macos/Sources/AITaskMonitor/UpdateDialog.swift').read_text(encoding='utf-8')
          pattern = r'(?ms)^    private func openDownload\(\) \{.*?^    \}'
          current, reference = re.search(pattern, candidate), re.search(pattern, baseline)
          action = 'Button(tr("Скачать", "Download")) { openDownload() }'
          if not current or not reference or current.group() != reference.group() or candidate.count(action) != 1 or baseline.count(action) != 1:
              raise SystemExit('Download action or guard changed; synthetic clicks were not run.')
          PY
      - name: Test pinned baseline window layout
        working-directory: baseline-layout/macos
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          cp "$GITHUB_WORKSPACE/macos/Tests/AITaskMonitorTests/WindowLayoutAuditTests.swift" Tests/AITaskMonitorTests/
          export AITM_LAYOUT_SYNTHETIC_ROOT="$RUNNER_TEMP/aitm-layout-baseline"
          mkdir -p "$AITM_LAYOUT_SYNTHETIC_ROOT"
          export AITM_LAYOUT_SYNTHETIC_CI=1
          swift test --filter WindowLayoutAuditTests
      - name: Test candidate window layout
        if: ${{ !cancelled() && steps.guard.outcome == 'success' }}
        working-directory: macos
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          export AITM_LAYOUT_SYNTHETIC_ROOT="$RUNNER_TEMP/aitm-layout-candidate"
          mkdir -p "$AITM_LAYOUT_SYNTHETIC_ROOT"
          export AITM_LAYOUT_SYNTHETIC_CI=1
          swift test --filter WindowLayoutAuditTests
      - name: Upload baseline diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-layout-baseline-${{ matrix.runner }}
          path: ${{ runner.temp }}/aitm-layout-baseline/
          if-no-files-found: error
          retention-days: 7
      - name: Upload candidate diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-layout-candidate-${{ matrix.runner }}
          path: ${{ runner.temp }}/aitm-layout-candidate/
          if-no-files-found: error
          retention-days: 7
