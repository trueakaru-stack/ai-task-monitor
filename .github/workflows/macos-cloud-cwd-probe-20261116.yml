name: Synthetic macOS cloud cwd safety probe
on:
  push:
    branches: ['codex/macos-cloud-cwd-probe-20261116']
    paths: ['.github/workflows/macos-cloud-cwd-probe-20261116.yml', 'macos/**']
permissions:
  contents: read
jobs:
  isolated:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            developer: /Applications/Xcode_16.1.app/Contents/Developer
          - runner: macos-26
            developer: /Applications/Xcode.app/Contents/Developer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.developer }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare and verify disposable sandbox
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          task_profile_dir="$(/usr/bin/python3 -I -S -B -c 'import os,pwd; print(os.path.realpath(pwd.getpwuid(os.getuid()).pw_dir))')"
          case "$task_profile_dir" in /Users/*) ;; *) echo 'Unexpected hosted runner profile.' >&2; exit 1;; esac
          task_root="$(mktemp -d "$RUNNER_TEMP/aitm-card-tests.XXXXXXXX")"
          task_marker="$(mktemp "$RUNNER_TEMP/aitm-profile-deny.XXXXXXXX")"
          case "$task_marker" in "$task_profile_dir"/*) ;; *) echo 'Runner temp is outside expected profile.' >&2; exit 1;; esac
          printf 'synthetic-only\n' > "$task_marker"
          task_node="$(command -v node)"
          task_node_real="$(/usr/bin/python3 -I -S -B -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$task_node")"
          task_node_root="$(dirname "$(dirname "$task_node_real")")"
          task_node_bin="$(dirname "$task_node")"
          task_python=''
          for name in python3 python3.14 python3.13 python3.12 python3.11; do
            candidate="$(command -v "$name" || true)"
            if [[ "$candidate" == /* && -x "$candidate" ]] && "$candidate" -I -S -B -c 'import sys; assert (3, 11) <= sys.version_info[:2] < (3, 15)' 2>/dev/null; then task_python="$candidate"; break; fi
          done
          test -n "$task_python"
          task_python_root="$("$task_python" -I -S -B -c 'import os,sys; print(os.path.realpath(sys.base_prefix))')"
          case "$task_node_root" in /|/Users|"$task_profile_dir") echo 'Unsafe Node root.' >&2; exit 1;; esac
          case "$task_python_root" in /|/Users|"$task_profile_dir") echo 'Unsafe Python root.' >&2; exit 1;; esac
          task_path="$task_node_bin:$(dirname "$task_python"):$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin:$DEVELOPER_DIR/usr/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          mkdir -p "$task_root/source" "$task_root/template" "$task_root/hooks" "$task_root/temp" "$task_root/npm-cache" "$task_root/swift-cache" "$task_root/swift-config" "$task_root/swift-security" "$task_root/clang-cache"
          : > "$task_root/npmrc"
          git -c credential.helper= -c core.hooksPath="$task_root/hooks" -c init.templateDir="$task_root/template" init --quiet "$task_root/source"
          git -C "$task_root/source" -c credential.helper= -c core.hooksPath="$task_root/hooks" fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$task_root/source" -c core.hooksPath="$task_root/hooks" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$task_root/source" rev-parse HEAD)" = "$GITHUB_SHA"
          cat > "$task_root/profile.sb" <<'PROFILE'
          (version 1)
          (allow default)
          (deny file-read* (subpath (param "TASK_PROFILE")))
          (allow file-read-metadata)
          (allow file-read* (subpath (param "TASK_ROOT")))
          (deny mach-lookup (global-name "com.apple.bsd.dirhelper"))
          (allow file-read* (subpath (param "TASK_NODE_ROOT")))
          (allow file-read* (subpath (param "TASK_PYTHON_ROOT")))
          (deny file-write*)
          (allow file-write* (subpath (param "TASK_ROOT")))
          (allow file-write-data (literal "/dev/null") (literal "/dev/tty"))
          PROFILE
          cat > "$task_root/run-isolated" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          exec /usr/bin/env -i "PATH=$AITM_TASK_PATH" "TMPDIR=$AITM_TEST_TASK_ROOT/temp" "DEVELOPER_DIR=$DEVELOPER_DIR" "CLANG_MODULE_CACHE_PATH=$AITM_TEST_TASK_ROOT/clang-cache" "SDKROOT=$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" XCRUN_NO_CACHE=1 \
            CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=macOS AITM_MACOS_TEST_SANDBOX=1 AITM_SYNTHETIC_REQUIRED=1 \
            "AITM_CI_DENIED_FILE=$AITM_TEST_DENIED_FILE" "AITM_MACOS_TEST_ROOT=$AITM_TEST_TASK_ROOT/temp" "AITM_SYNTHETIC_TEST_ROOT=$AITM_TEST_TASK_ROOT/temp" "NPM_CONFIG_CACHE=$AITM_TEST_TASK_ROOT/npm-cache" \
            "NPM_CONFIG_USERCONFIG=$AITM_TEST_TASK_ROOT/npmrc" NPM_CONFIG_GLOBALCONFIG=/dev/null NPM_CONFIG_UPDATE_NOTIFIER=false \
            /usr/bin/sandbox-exec -D "TASK_PROFILE=$AITM_TEST_PROFILE" -D "TASK_ROOT=$AITM_TEST_TASK_ROOT" \
              -D "TASK_NODE_ROOT=$AITM_TEST_NODE_ROOT" -D "TASK_PYTHON_ROOT=$AITM_TEST_PYTHON_ROOT" \
              -f "$AITM_TEST_TASK_ROOT/profile.sb" "$@"
          SCRIPT
          chmod 700 "$task_root/run-isolated"
          { printf 'AITM_TEST_TASK_ROOT=%s\n' "$task_root"; printf 'AITM_TEST_DENIED_FILE=%s\n' "$task_marker"; printf 'AITM_TEST_PROFILE=%s\n' "$task_profile_dir"; printf 'AITM_TEST_NODE_ROOT=%s\n' "$task_node_root"; printf 'AITM_TEST_PYTHON_ROOT=%s\n' "$task_python_root"; printf 'AITM_TASK_PATH=%s\n' "$task_path"; printf 'AITM_TEST_NODE_BIN=%s\n' "$task_node"; printf 'AITM_TEST_PYTHON_BIN=%s\n' "$task_python"; } >> "$GITHUB_ENV"
      - name: Verify sandbox blocks runner profile
        shell: bash
        run: |
          set -euo pipefail
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          "$task_run" /usr/bin/true
          if "$task_run" /bin/cat "$AITM_TEST_DENIED_FILE" >"$AITM_TEST_TASK_ROOT/out" 2>"$AITM_TEST_TASK_ROOT/err"; then echo 'Profile read was not denied.' >&2; exit 1; fi
          if "$task_run" /usr/bin/touch "$AITM_TEST_DENIED_FILE" >"$AITM_TEST_TASK_ROOT/out" 2>"$AITM_TEST_TASK_ROOT/err"; then echo 'Profile write was not denied.' >&2; exit 1; fi
          "$task_run" "$AITM_TEST_PYTHON_BIN" -I -S -B -c 'import os; assert "HOME" not in os.environ and "CODEX_HOME" not in os.environ'
          /bin/ln -s "$AITM_TEST_DENIED_FILE" "$AITM_TEST_TASK_ROOT/denied-link"
          if "$task_run" /bin/cat "$AITM_TEST_TASK_ROOT/denied-link" >"$AITM_TEST_TASK_ROOT/out" 2>"$AITM_TEST_TASK_ROOT/err"; then echo 'Profile read via link was not denied.' >&2; exit 1; fi
          if "$task_run" /usr/bin/touch "$AITM_TEST_TASK_ROOT/denied-link" >"$AITM_TEST_TASK_ROOT/out" 2>"$AITM_TEST_TASK_ROOT/err"; then echo 'Profile write via link was not denied.' >&2; exit 1; fi
      - name: Probe a read-only working directory using a fake CLI
        shell: bash
        run: |
          set -euo pipefail
          cat > "$AITM_TEST_TASK_ROOT/fake-cli" <<'FAKE'
          #!/bin/sh
          if [ "${HOME+x}" = x ] || [ "${CODEX_HOME+x}" = x ]; then exit 19; fi
          if (umask 077; printf 'synthetic-only\n' >> error.log) 2>/dev/null; then
            printf 'allowed\n'
          else
            printf 'denied\n'
          fi
          FAKE
          chmod 700 "$AITM_TEST_TASK_ROOT/fake-cli"
          cat > "$AITM_TEST_TASK_ROOT/probe.swift" <<'SWIFT'
          import Darwin
          import Foundation

          func check(_ result: Bool, _ message: String) {
              if !result { fputs("FAIL: \(message)\n", stderr); exit(1) }
          }
          let env = ProcessInfo.processInfo.environment
          guard let root = env["AITM_SYNTHETIC_TEST_ROOT"],
                root.hasPrefix("/Users/runner/work/_temp/aitm-card-tests."),
                root.hasSuffix("/temp"), env["HOME"] == nil, env["CODEX_HOME"] == nil else { exit(2) }
          check(geteuid() != 0, "the hosted probe must run unprivileged")
          let base = URL(fileURLWithPath: root, isDirectory: true).appendingPathComponent("cwd-probe-" + UUID().uuidString)
          try FileManager.default.createDirectory(at: base, withIntermediateDirectories: false)
          let cli = URL(fileURLWithPath: root).deletingLastPathComponent().appendingPathComponent("fake-cli")
          func folder(_ name: String) throws -> URL {
              let url = base.appendingPathComponent(name, isDirectory: true)
              try FileManager.default.createDirectory(at: url, withIntermediateDirectories: false)
              return url
          }
          func setMode(_ url: URL, _ mode: mode_t) { check(chmod(url.path, mode) == 0, "chmod synthetic directory") }
          func run(_ cwd: URL) throws -> String {
              let process = Process()
              let output = Pipe()
              process.executableURL = cli
              process.currentDirectoryURL = cwd
              process.environment = ["PATH": "/usr/bin:/bin"]
              process.standardInput = FileHandle.nullDevice
              process.standardOutput = output
              process.standardError = FileHandle.nullDevice
              try process.run()
              process.waitUntilExit()
              check(process.terminationStatus == 0, "fake CLI exit or leaked HOME/CODEX_HOME")
              return String(decoding: output.fileHandleForReading.readDataToEndOfFile(), as: UTF8.self).trimmingCharacters(in: .whitespacesAndNewlines)
          }
          let safe = try folder("safe")
          setMode(safe, 0o500)
          check(try run(safe) == "denied", "a new log must be refused")
          check(try run(safe) == "denied", "a repeated launch must remain refused")
          check(!FileManager.default.fileExists(atPath: safe.appendingPathComponent("error.log").path), "unexpected log")
          print("PASS: new log denied across two unprivileged launches")

          let replacement = try folder("replacement")
          let held = base.appendingPathComponent("held", isDirectory: true)
          check(rename(safe.path, held.path) == 0, "rename synthetic directory")
          check(symlink(replacement.path, safe.path) == 0, "replace synthetic path")
          check(try run(safe) == "allowed", "synthetic path replacement did not demonstrate the race")
          check(FileManager.default.fileExists(atPath: replacement.appendingPathComponent("error.log").path), "synthetic replacement log missing")
          print("PASS: replacing the checked path redirects the fake CLI")

          let linkDirectory = try folder("with-link")
          let target = base.appendingPathComponent("synthetic-target")
          let targetFD = open(target.path, O_CREAT | O_EXCL | O_WRONLY | O_NOFOLLOW | O_CLOEXEC, 0o600)
          check(targetFD >= 0, "create synthetic target")
          check(close(targetFD) == 0, "close synthetic target")
          let link = linkDirectory.appendingPathComponent("error.log")
          check(symlink(target.path, link.path) == 0, "create synthetic log link")
          setMode(linkDirectory, 0o500)
          check(try run(linkDirectory) == "allowed", "synthetic preexisting file link must remain writable")
          check(try Data(contentsOf: target) == Data("synthetic-only\n".utf8), "unexpected synthetic target content")
          print("PASS: a preexisting link bypasses directory-only write protection")
          print("Root UID behavior is not exercised on this unprivileged runner.")
          SWIFT
          task_compiler=(/usr/bin/env -i "PATH=$AITM_TASK_PATH" "TMPDIR=$AITM_TEST_TASK_ROOT/temp" "DEVELOPER_DIR=$DEVELOPER_DIR" "CLANG_MODULE_CACHE_PATH=$AITM_TEST_TASK_ROOT/clang-cache" "SDKROOT=$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" XCRUN_NO_CACHE=1 swiftc)
          "${task_compiler[@]}" "$AITM_TEST_TASK_ROOT/probe.swift" -o "$AITM_TEST_TASK_ROOT/probe"
          "$AITM_TEST_TASK_ROOT/run-isolated" "$AITM_TEST_TASK_ROOT/probe"
      - name: Probe pinned working-directory descriptor
        shell: bash
        run: |
          set -euo pipefail
          cat > "$AITM_TEST_TASK_ROOT/fake-fd.c" <<'CHILD'
          #include <errno.h>
          #include <fcntl.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          int main(int argc, char **argv) {
              if (argc != 2 || getenv("HOME") || getenv("CODEX_HOME")) return 19;
              int descriptor = atoi(argv[1]);
              errno = 0;
              int closed = fcntl(descriptor, F_GETFD) == -1 && errno == EBADF;
              int log = open("error.log", O_CREAT | O_APPEND | O_WRONLY | O_CLOEXEC, 0600);
              int denied = log < 0 && errno == EACCES;
              if (log >= 0) { if (write(log, "synthetic\n", 10) != 10) return 20; close(log); }
              printf("write=%s fd=%s\n", log >= 0 ? "allowed" : (denied ? "denied" : "other"), closed ? "closed" : "open");
              return 0;
          }
          CHILD
          cat > "$AITM_TEST_TASK_ROOT/fd-probe.c" <<'PARENT'
          #include <errno.h>
          #include <fcntl.h>
          #include <limits.h>
          #include <spawn.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <unistd.h>

          static void check(int condition, const char *message) {
              if (!condition) { fprintf(stderr, "FAIL: %s (errno=%d)\n", message, errno); exit(1); }
          }
          static void run_at(int dirfd, const char *fake, const char *expected) {
              int channel[2];
              check(pipe(channel) == 0, "pipe");
              posix_spawn_file_actions_t actions;
              posix_spawnattr_t attr;
              check(posix_spawn_file_actions_init(&actions) == 0, "init file actions");
              check(posix_spawn_file_actions_addfchdir_np(&actions, dirfd) == 0, "add fchdir");
              check(posix_spawn_file_actions_adddup2(&actions, channel[1], STDOUT_FILENO) == 0, "redirect stdout");
              check(posix_spawn_file_actions_addclose(&actions, channel[0]) == 0, "close read pipe in child");
              check(posix_spawn_file_actions_addclose(&actions, channel[1]) == 0, "close write pipe in child");
              check(posix_spawn_file_actions_addclose(&actions, dirfd) == 0, "close directory in child");
              check(posix_spawnattr_init(&attr) == 0, "init spawn attrs");
              check(posix_spawnattr_setflags(&attr, POSIX_SPAWN_CLOEXEC_DEFAULT) == 0, "restrict descriptors");
              char fd_text[24];
              snprintf(fd_text, sizeof(fd_text), "%d", dirfd);
              char *arguments[] = {(char *)fake, fd_text, NULL};
              char *environment[] = {"PATH=/usr/bin:/bin", NULL};
              pid_t pid;
              int result = posix_spawn(&pid, fake, &actions, &attr, arguments, environment);
              check(result == 0, "spawn fake CLI");
              posix_spawn_file_actions_destroy(&actions);
              posix_spawnattr_destroy(&attr);
              close(channel[1]);
              char output[160] = {0};
              ssize_t count = read(channel[0], output, sizeof(output) - 1);
              check(count > 0, "read fake CLI response");
              close(channel[0]);
              int status = 0;
              check(waitpid(pid, &status, 0) == pid && WIFEXITED(status) && WEXITSTATUS(status) == 0, "fake CLI exit");
              check(strcmp(output, expected) == 0, output);
          }
          int main(int argc, char **argv) {
              const char *root = getenv("AITM_SYNTHETIC_TEST_ROOT");
              check(argc == 2 && root && strstr(root, "/aitm-card-tests.") && !getenv("HOME") && !getenv("CODEX_HOME"), "synthetic root and environment");
              check(geteuid() != 0, "runner must be unprivileged");
              char base[PATH_MAX], safe[PATH_MAX], held[PATH_MAX], replacement[PATH_MAX], errorlog[PATH_MAX], target[PATH_MAX];
              check(snprintf(base, sizeof(base), "%s/fd-probe-XXXXXX", root) < sizeof(base), "base path");
              check(mkdtemp(base) != NULL, "create test root");
              check(snprintf(safe, sizeof(safe), "%s/safe", base) < sizeof(safe), "safe path");
              check(snprintf(held, sizeof(held), "%s/held", base) < sizeof(held), "held path");
              check(snprintf(replacement, sizeof(replacement), "%s/replacement", base) < sizeof(replacement), "replacement path");
              check(snprintf(errorlog, sizeof(errorlog), "%s/error.log", held) < sizeof(errorlog), "log path");
              check(snprintf(target, sizeof(target), "%s/target", base) < sizeof(target), "target path");
              check(mkdir(safe, 0700) == 0 && mkdir(replacement, 0700) == 0 && chmod(safe, 0500) == 0, "create synthetic directories");
              int original = open(safe, O_RDONLY | O_DIRECTORY | O_NOFOLLOW | O_CLOEXEC);
              check(original >= 0, "open safe directory");
              int pinned = fcntl(original, F_DUPFD_CLOEXEC, 90);
              check(pinned >= 90, "pin a high descriptor");
              close(original);
              check(rename(safe, held) == 0 && symlink(replacement, safe) == 0, "replace path after open");
              run_at(pinned, argv[1], "write=denied fd=closed\n");
              char otherlog[PATH_MAX];
              check(snprintf(otherlog, sizeof(otherlog), "%s/error.log", replacement) < sizeof(otherlog), "replacement log path");
              check(access(otherlog, F_OK) == -1 && errno == ENOENT, "replacement must not receive a log");
              puts("PASS: pinned descriptor resists path replacement; descriptor closed in child");

              int targetfd = open(target, O_CREAT | O_EXCL | O_WRONLY | O_NOFOLLOW | O_CLOEXEC, 0600);
              check(targetfd >= 0 && close(targetfd) == 0, "create synthetic target");
              check(chmod(held, 0700) == 0 && symlink(target, errorlog) == 0 && chmod(held, 0500) == 0, "replace synthetic directory content");
              run_at(pinned, argv[1], "write=allowed fd=closed\n");
              puts("PASS: an owner can still alter directory content before spawn");
              check(close(pinned) == 0, "close parent descriptor");
              errno = 0;
              check(fcntl(pinned, F_GETFD) == -1 && errno == EBADF, "parent descriptor closed");
              return 0;
          }
          PARENT
          task_compiler=(/usr/bin/env -i "PATH=$AITM_TASK_PATH" "TMPDIR=$AITM_TEST_TASK_ROOT/temp" "DEVELOPER_DIR=$DEVELOPER_DIR" "CLANG_MODULE_CACHE_PATH=$AITM_TEST_TASK_ROOT/clang-cache" "SDKROOT=$DEVELOPER_DIR/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" XCRUN_NO_CACHE=1 clang -mmacosx-version-min=13.0)
          "${task_compiler[@]}" "$AITM_TEST_TASK_ROOT/fake-fd.c" -o "$AITM_TEST_TASK_ROOT/fake-fd"
          "${task_compiler[@]}" "$AITM_TEST_TASK_ROOT/fd-probe.c" -o "$AITM_TEST_TASK_ROOT/fd-probe"
          "$AITM_TEST_TASK_ROOT/run-isolated" "$AITM_TEST_TASK_ROOT/fd-probe" "$AITM_TEST_TASK_ROOT/fake-fd"
