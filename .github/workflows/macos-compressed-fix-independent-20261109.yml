name: macOS compressed discovery independent verification

on:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-compressed-fix-independent-20261109.yml"
      - ".github/codex-audit/cold-compressed-fix-independent-20261109/**"

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[compressed-fix-independent]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Verify disposable runner
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Select Xcode on macOS 15
        if: ${{ matrix.runner == 'macos-15' }}
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
      - name: Verify pinned input and baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git diff --quiet 0b11986e4c2a3570a46eef49b5e46b95ca56cb80 "$GITHUB_SHA" -- macos
          cd "$GITHUB_WORKSPACE/.github/codex-audit/cold-compressed-fix-independent-20261109"
          printf '%s  %s\n' \
            '712993419db65042e4de4b3444e69349acd5719e8cc20630da97144ad2415b26' CodexTaskReader.swift \
            '9cf23df7eda4164bcc0c1a1843f2cdad1ef45f00ef5082624378abd79f5fa830' CodexColdCompressedIndependentTests.swift \
            '16f23ab277c4f3d8609d445d7013d99f6c6d851ce3e658ab0d62c6c564934fef' CodexSiblingDirectoryIndependentTests.swift \
            '812a6f18510137f8a97336082d23778e80759fa9b8d7ec2615d64e0e5008e1d6' CodexCompressedBoundaryIndependentTests.swift \
            | shasum -a 256 -c -
          cd "$GITHUB_WORKSPACE/.github/codex-audit/revert-safe-20261109"
          printf '%s  %s\n' \
            '734187524ad64e778ffb1bdea773b350dda77d91e10a888867a1e3819a580ec2' TaskStore.swift \
            'e338137c8b33c3be653ebe7b30d46ffbeb62c914d022b5b9bff3a8b8eb81a82f' RootView.swift \
            'fcf1bdf1f6166701c3403d3bcd6e43fc16a0f5581a18d20641535b7e6f507a9a' SnapshotRenderer.swift \
            'a804b8dd29db27c82276eb32203634f4e75a7d531a89a8d30c29222d37e87ac1' CodexRevertSafetyTests.swift \
            '2612566bf9ce50fd2c8f201f58ac19042ac07e54f1a6ff26c3480057a47a2410' CodexCloudStoreTests.swift \
            'ed181937cf1e926576b55bfec13c754b693aa0bbe24cbb331e89d703a1d49429' CodexLongTurnTests.swift \
            '8accf33c2b8fcc90c721b331a15a9fceb95abc84b76e52919bd26b32ede288dc' CodexSourceStalePlanTests.swift \
            '1940d30b91f7b98ecc13286b45a0213a95bc2ba755859a129d9bc037d1523771' ParserTests.swift \
            | shasum -a 256 -c -
      - name: Test and render isolated fixtures without network
        working-directory: macos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aitm-fix-user" "$RUNNER_TEMP/aitm-fix-tmp" "$RUNNER_TEMP/aitm-fix-support" "$RUNNER_TEMP/aitm-fix-frames"
          DEVELOPER="$(xcode-select -p)"
          PROFILE='(version 1) (allow default) (deny network*)'
          cat > "$RUNNER_TEMP/aitm-fix-network-probe.py" <<'PY'
          import errno, socket, sys
          for family, destination in ((socket.AF_INET, ('127.0.0.1', 0)), (socket.AF_INET6, ('::1', 0))):
              try:
                  client = socket.socket(family, socket.SOCK_STREAM)
              except OSError as error:
                  if error.errno not in (errno.EPERM, errno.EACCES): raise
              else:
                  try:
                      if client.connect_ex(destination) not in (errno.EPERM, errno.EACCES): sys.exit(1)
                  finally:
                      client.close()
          print('Network probe: IPv4/IPv6 denied')
          PY
          run_isolated() {
            /usr/bin/env -i "PATH=/usr/bin:/bin" "DEVELOPER_DIR=$DEVELOPER" \
              "CFFIXED_USER_HOME=$RUNNER_TEMP/aitm-fix-user" "TMPDIR=$RUNNER_TEMP/aitm-fix-tmp/" \
              "AI_TASK_MONITOR_SUPPORT_DIR=$RUNNER_TEMP/aitm-fix-support" "AITM_CODEX_PARTIAL_PREVIEW_ONLY=1" \
              /usr/bin/sandbox-exec -p "$PROFILE" "$@"
          }
          run_isolated /usr/bin/python3 -I -S -B "$RUNNER_TEMP/aitm-fix-network-probe.py"
          ORIGINAL="$GITHUB_WORKSPACE/.github/codex-audit/revert-safe-20261109"
          FIXED="$GITHUB_WORKSPACE/.github/codex-audit/cold-compressed-fix-independent-20261109"
          cp "$FIXED/CodexTaskReader.swift" Sources/AITaskMonitor/CodexTaskReader.swift
          for name in TaskStore.swift RootView.swift SnapshotRenderer.swift; do cp "$ORIGINAL/$name" "Sources/AITaskMonitor/$name"; done
          for name in CodexRevertSafetyTests.swift CodexCloudStoreTests.swift CodexLongTurnTests.swift CodexSourceStalePlanTests.swift ParserTests.swift; do cp "$ORIGINAL/$name" "Tests/AITaskMonitorTests/$name"; done
          for name in CodexColdCompressedIndependentTests.swift CodexSiblingDirectoryIndependentTests.swift CodexCompressedBoundaryIndependentTests.swift; do cp "$FIXED/$name" "Tests/AITaskMonitorTests/$name"; done
          audit_status=0
          for entry in CodexRevertSafetyTests:13 CodexCloudStoreTests:1 CodexLongTurnTests:3 CodexSourceStalePlanTests:1 ParserTests:23 TaskFocusTests:4 ClaudePlanLabelTests:2 ExternalProviderStateTests:7 UnconfirmedPlanModelTests:3 CodexColdCompressedIndependentTests:8 CodexSiblingDirectoryIndependentTests:1 CodexCompressedBoundaryIndependentTests:4; do
            suite="${entry%:*}"
            count="${entry#*:}"
            log="$RUNNER_TEMP/aitm-fix-$suite.log"
            if ! run_isolated /usr/bin/xcrun swift test --disable-sandbox --filter "$suite" 2>&1 | /usr/bin/tee "$log"; then audit_status=1; fi
            if ! /usr/bin/grep -Eq "Executed $count tests?, with 0 failures" "$log"; then echo "Missing successful expected test count: $suite"; audit_status=1; fi
            if /usr/bin/grep -Eq 'Test Case .* skipped ' "$log"; then audit_status=1; fi
          done
          if ! run_isolated /usr/bin/xcrun swift build --disable-sandbox --configuration release; then audit_status=1; fi
          if ! run_isolated /usr/bin/xcrun swift build --disable-sandbox; then audit_status=1; fi
          if ! run_isolated .build/debug/AITaskMonitor --render-previews "$RUNNER_TEMP/aitm-fix-frames"; then audit_status=1; fi
          count="$(find "$RUNNER_TEMP/aitm-fix-frames" -name '*.png' -type f | wc -l | tr -d ' ')"
          if [ "$count" != 24 ]; then echo "Unexpected frame count: $count"; audit_status=1; fi
          exit "$audit_status"
      - name: Upload synthetic frames
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-compressed-fix-independent-${{ matrix.runner }}
          path: ${{ runner.temp }}/aitm-fix-frames/
          if-no-files-found: error
          retention-days: 7
