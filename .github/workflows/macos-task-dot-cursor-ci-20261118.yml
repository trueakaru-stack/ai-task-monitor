name: macOS compact task cursor verification
on:
  push:
    branches: [codex/macos-task-dot-cursor-ci-20261118]
    paths: [".github/workflows/macos-task-dot-cursor-ci-20261118.yml"]
permissions:
  contents: read
jobs:
  cursor:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prepare synthetic runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          fixture="$(mktemp -d "$RUNNER_TEMP/aitm-cursor-XXXXXXXX")"
          mkdir -p "$fixture/synthetic-home" "$fixture/tmp" "$fixture/evidence"
          echo "AITM_CURSOR_SYNTHETIC_ROOT=$fixture" >> "$GITHUB_ENV"
      - name: Build isolated application and check real pointer
        shell: bash
        run: |
          set -euo pipefail
          export CFFIXED_USER_HOME="$AITM_CURSOR_SYNTHETIC_ROOT/synthetic-home"
          export TMPDIR="$AITM_CURSOR_SYNTHETIC_ROOT/tmp"
          cd macos
          /usr/bin/xcrun swift build --disable-sandbox --scratch-path "$AITM_CURSOR_SYNTHETIC_ROOT/build" 2>&1 | /usr/bin/tee "$AITM_CURSOR_SYNTHETIC_ROOT/evidence/build.log"
          app="$AITM_CURSOR_SYNTHETIC_ROOT/AI Task Monitor.app"
          mkdir -p "$app/Contents/MacOS"
          cp "$AITM_CURSOR_SYNTHETIC_ROOT/build/debug/AITaskMonitor" "$app/Contents/MacOS/AITaskMonitor"
          cp Info.plist "$app/Contents/Info.plist"
          "$app/Contents/MacOS/AITaskMonitor" --cursor-integration "$AITM_CURSOR_SYNTHETIC_ROOT" > "$AITM_CURSOR_SYNTHETIC_ROOT/evidence/gui.log" 2>&1 &
          pid=$!
          for attempt in {1..100}; do
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid" || true
            wait "$pid" || true
            cat "$AITM_CURSOR_SYNTHETIC_ROOT/evidence/gui.log"
            echo "BLOCKED: GUI harness timed out"
            exit 1
          fi
          set +e
          wait "$pid"
          code=$?
          set -e
          cat "$AITM_CURSOR_SYNTHETIC_ROOT/evidence/gui.log"
          exit "$code"
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compact-cursor-verification
          path: ${{ env.AITM_CURSOR_SYNTHETIC_ROOT }}/evidence/
          if-no-files-found: warn
          retention-days: 7

# Tracking-area verification, including minimize.

# Recheck cursor synchronization across themes and app activation.

# Separate visual capture from active theme-transition checks.

# Verify appearance-change synchronization.

# Attempt keyboard and accessibility checks without changing permissions.

# Check actual focus and accessibility activation independently.

# Whole-window hover activation with rounded-corner and focus-cycle checks.

# Diagnose geometry and key events on the hosted runner.

# Verify real content bounds, released modifiers and expanded window.

# Final unobscured targets and clean product sources.

# Verify the keyboard after hover-driven focus activation.
