name: macOS synthetic Unix sandbox diagnostic

on:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-unix-nested-diagnostic-20261109.yml"
      - ".github/macos-unix-nested-diagnostic-20261109/**"

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.event_name == 'push' && github.ref == 'refs/heads/macos' && contains(github.event.head_commit.message, '[macos-unix-nested-diagnostic-20261109]')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check disposable runner and fetch exact public snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$GITHUB_REPOSITORY" = 'trueakaru-stack/ai-task-monitor'
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -d "$GITHUB_WORKSPACE"
          test -z "$(ls -A "$GITHUB_WORKSPACE")"
          run_git() {
            /usr/bin/env -i 'PATH=/usr/bin:/bin' 'GIT_CONFIG_NOSYSTEM=1' \
              'GIT_CONFIG_GLOBAL=/dev/null' 'GIT_TERMINAL_PROMPT=0' \
              /usr/bin/git -c credential.helper= -c core.autocrlf=false "$@"
          }
          run_git init "$GITHUB_WORKSPACE"
          run_git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 https://github.com/trueakaru-stack/ai-task-monitor.git "$GITHUB_SHA"
          run_git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          test "$(run_git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compare synthetic direct and nested Unix sandbox
        shell: bash
        run: |
          set -euo pipefail
          input="$GITHUB_WORKSPACE/.github/macos-unix-nested-diagnostic-20261109"
          (cd "$input" && /usr/bin/shasum -a 256 -c staged.sha256)
          /usr/bin/env -i 'PATH=/usr/bin:/bin' "RUNNER_TEMP=$RUNNER_TEMP" \
            "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" 'GITHUB_ACTIONS=true' \
            'RUNNER_ENVIRONMENT=github-hosted' 'RUNNER_OS=macOS' \
            /usr/bin/python3 -I -S -B "$input/diagnostic.py"
