name: Independent macOS window frame regression
on:
  push:
    branches: [codex/macos-frame-test-independent-20261118]
permissions:
  contents: read
jobs:
  frame:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 20
      - name: Run the same regression against old and new window code
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          test "$GITHUB_REPOSITORY" = trueakaru-stack/ai-task-monitor
          test "$DOTNET_ADD_GLOBAL_TOOLS_TO_PATH" = 0
          candidate=5863d11e9c493a3d361be0a0338e2222b33bbcec
          baseline=6f9e11914064052c0bbe5fbc30bfa6c0a23bc860
          git merge-base --is-ancestor "$candidate" HEAD
          test "$(git rev-parse "$candidate^")" = "$baseline"
          changes="$(git diff --name-only "$candidate" HEAD)"
          test "$changes" = '.github/workflows/macos-frame-test-independent.yml'
          root="$RUNNER_TEMP/aitm-frame-independent"
          test ! -e "$root"
          mkdir -p "$root"/{source,home,tmp,cache,config,security,evidence}
          cp -R macos "$root/source/macos"
          test -z "$(find "$root/source/macos" -type l -print)"
          source_root="$root/source/macos/Sources/AITaskMonitor/RootView.swift"
          git show "$candidate:macos/Sources/AITaskMonitor/RootView.swift" > "$root/candidate.swift"
          git show "$baseline:macos/Sources/AITaskMonitor/RootView.swift" > "$root/baseline.swift"
          cmp "$source_root" "$root/candidate.swift"
          test "$(git hash-object "$root/source/macos/Tests/AITaskMonitorTests/CompactWindowLayoutTests.swift")" = "$(git rev-parse "$candidate:macos/Tests/AITaskMonitorTests/CompactWindowLayoutTests.swift")"
          cat > "$root/profile.sb" <<'PROFILE'
          (version 1)
          (allow default)
          (deny file-read* (subpath "/Users") (subpath "/private/var/folders"))
          (allow file-read-metadata (literal "/Users") (literal "/Users/runner") (literal "/Users/runner/work") (literal "/Users/runner/work/_temp"))
          (allow file-read* (subpath (param "TASK_ROOT")))
          (deny file-write*)
          (allow file-write* (subpath (param "TASK_ROOT")))
          (allow file-write-data (literal "/dev/null") (literal "/dev/tty"))
          (deny network*)
          (allow mach-lookup)
          (deny mach-lookup (global-name "com.apple.cfprefsd.agent") (global-name "com.apple.cfprefsd.daemon") (global-name "com.apple.bsd.dirhelper"))
          PROFILE
          cat > "$root/run-test" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          exec /usr/bin/env -i "PATH=/usr/bin:/bin:/usr/sbin:/sbin" "TMPDIR=$AITM_FRAME_ROOT/tmp" \
            "CFFIXED_USER_HOME=$AITM_FRAME_ROOT/home" "DEVELOPER_DIR=$DEVELOPER_DIR" \
            "CLANG_MODULE_CACHE_PATH=$AITM_FRAME_ROOT/cache" XCRUN_NO_CACHE=1 \
            CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=macOS \
            DOTNET_ADD_GLOBAL_TOOLS_TO_PATH=0 \
            /usr/bin/sandbox-exec -D "TASK_ROOT=$AITM_FRAME_ROOT" -f "$AITM_FRAME_ROOT/profile.sb" "$@"
          SCRIPT
          chmod 700 "$root/run-test"
          export AITM_FRAME_ROOT="$root"
          DEVELOPER_DIR="$(/usr/bin/xcode-select -p)"
          test -d "$DEVELOPER_DIR"
          export DEVELOPER_DIR
          marker="$(mktemp "$RUNNER_TEMP/aitm-frame-denied.XXXXXXXX")"
          printf 'isolated fixture only\n' > "$marker"
          "$root/run-test" /bin/bash -c 'test -z "${HOME+x}" && test -z "${CODEX_HOME+x}"'
          if "$root/run-test" /bin/cat "$marker" > /dev/null 2>&1; then echo 'Outside-profile read was not denied'; exit 1; fi
          if "$root/run-test" /usr/bin/touch "$marker" > /dev/null 2>&1; then echo 'Outside-profile write was not denied'; exit 1; fi
          cd "$root/source/macos"
          test_file="$root/source/macos/Tests/AITaskMonitorTests/CompactWindowLayoutTests.swift"
          cp "$test_file" "$root/original-test.swift"
          cat > "$root/instrument.py" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          mode = sys.argv[2]
          source_path = root / "source/macos/Sources/AITaskMonitor/RootView.swift"
          test_path = root / "source/macos/Tests/AITaskMonitorTests/CompactWindowLayoutTests.swift"
          source = (root / "candidate.swift").read_text()
          tests = (root / "original-test.swift").read_text()
          tests = tests.replace("TaskStore.loopPreview(unavailableSources: [.claude])", "TaskStore.loopPreview(unavailableSources: [.codex, .claude])")
          frame_line = "        .frame(width: store.isCompact ? 372 : 560, height: store.isCompact ? compactHeight : 700, alignment: .top)"
          if source.count(frame_line) != 1:
              raise SystemExit("unexpected root frame")
          if mode == "ignore-top":
              source = source.replace(frame_line, frame_line + "\n        .ignoresSafeArea(.container, edges: .top)")
          if mode == "safe-area-none":
              target = "        window.contentView = host"
              if tests.count(target) != 2:
                  raise SystemExit("unexpected hosting view assignments")
              tests = tests.replace(target, "        if #available(macOS 13.3, *) { host.safeAreaRegions = [] }\n" + target)
          if mode == "borderless-resizable":
              target = "        window.styleMask.formUnion([.fullSizeContentView, .resizable])"
              if source.count(target) != 1:
                  raise SystemExit("unexpected window style assignment")
              source = source.replace(target, target + "\n        window.styleMask = [.borderless, .resizable]")
          if mode == "combo":
              source = source.replace(frame_line, frame_line + "\n        .ignoresSafeArea(.container, edges: .top)")
              target = "        window.contentView = host"
              if tests.count(target) != 2:
                  raise SystemExit("unexpected hosting view assignments")
              tests = tests.replace(target, "        host.sizingOptions = []\n" + target)
          if mode == "sizing-none":
              target = "        window.contentView = host"
              if tests.count(target) != 2:
                  raise SystemExit("unexpected hosting view assignments")
              tests = tests.replace(target, "        host.sizingOptions = []\n" + target)
          inject_at = "        if window.frame.size != size {\n"
          trace = r'''        func frameTrace(_ stage: String) {
                      print("ROOT_DIAG stage=\(stage) compact=\(isCompact) target=\(size) frame=\(window.frame) contentFrame=\(String(describing: window.contentView?.frame)) contentFitting=\(String(describing: window.contentView?.fittingSize)) contentMin=\(window.contentMinSize) contentMax=\(window.contentMaxSize) frameMin=\(window.minSize) frameMax=\(window.maxSize) contentLayout=\(window.contentLayoutRect)")
                  }
                  frameTrace("before")
          '''
          if source.count(inject_at) != 1:
              raise SystemExit("unexpected configure branch")
          source = source.replace(inject_at, trace + inject_at)
          target = "            window.setFrame(frame, display: true)"
          if source.count(target) != 1:
              raise SystemExit("unexpected setFrame count")
          source = source.replace(target, target + '\n            frameTrace("immediate")')
          snapshot = r'''        func testTrace(_ stage: String) {
                      print("TEST_DIAG stage=\(stage) frame=\(window.frame) contentFrame=\(String(describing: window.contentView?.frame)) fitting=\(host.fittingSize) contentMin=\(window.contentMinSize) contentMax=\(window.contentMaxSize) frameMin=\(window.minSize) frameMax=\(window.maxSize) contentLayout=\(window.contentLayoutRect) safeArea=\(host.safeAreaInsets) sizing=\(host.sizingOptions) canBecomeKey=\(window.canBecomeKey) isKeyWindow=\(window.isKeyWindow) movableBackground=\(window.isMovableByWindowBackground) styleMask=\(window.styleMask.rawValue)")
                  }
          '''
          target = "        window.orderFrontRegardless()\n        defer { window.close() }\n        RunLoop.current.run(until: Date().addingTimeInterval(1.2))\n\n        XCTAssertEqual(window.frame.width, 560, accuracy: 1)"
          if tests.count(target) != 1:
              raise SystemExit("unexpected titled test structure")
          tests = tests.replace(target, "        window.orderFrontRegardless()\n        defer { window.close() }\n" + snapshot + "        RunLoop.current.run(until: Date().addingTimeInterval(1.2))\n        testTrace(\"expanded-settled\")\n\n        XCTAssertEqual(window.frame.width, 560, accuracy: 1)")
          target = "        store.isCompact = true\n        RunLoop.current.run(until: Date().addingTimeInterval(1.2))\n        XCTAssertEqual(window.frame.width, 372, accuracy: 1)"
          if tests.count(target) != 1:
              raise SystemExit("unexpected titled compact test structure")
          tests = tests.replace(target, "        store.isCompact = true\n        RunLoop.current.run(until: Date().addingTimeInterval(1.2))\n        testTrace(\"compact-settled\")\n        XCTAssertEqual(window.frame.width, 372, accuracy: 1)")
          source_path.write_text(source)
          test_path.write_text(tests)
          PY
          cat > "$root/source/macos/Sources/AITaskMonitor/FrameAppProbe.swift" <<'SWIFT'
          import AppKit
          import SwiftUI
          import Foundation
          import CoreGraphics

          @MainActor
          enum FrameAppProbe {
              static var anchor: NSPoint?
              static var hostConfigured = false
              static var beforeDrag: NSPoint?
              static weak var trackedWindow: NSWindow?

              static func output(_ message: String) {
                  FileHandle.standardError.write(Data(("APP_PROBE " + message + "\n").utf8))
              }

              static func appWindow() -> NSWindow? {
                  NSApplication.shared.windows.first { $0.isVisible && $0.frame.width >= 300 }
              }

              static func describeViews(_ view: NSView, depth: Int) {
                  guard depth <= 3 else { return }
                  output("view depth=\(depth) class=\(String(reflecting: type(of: view))) frame=\(view.frame)")
                  for child in view.subviews { describeViews(child, depth: depth + 1) }
              }

              static func configureTypedHost<Content: View>(_ content: Content, window: NSWindow) -> Bool {
                  func visit(_ view: NSView) -> Bool {
                      if let host = view as? NSHostingView<Content> {
                          host.sizingOptions = []
                          output("typed-host-configured class=\(String(reflecting: type(of: host)))")
                          return true
                      }
                      for child in view.subviews where visit(child) { return true }
                      return false
                  }
                  guard let root = window.contentView else { return false }
                  return visit(root)
              }

              static func snapshot(_ stage: String) {
                  guard let window = appWindow() else {
                      output("missing-window stage=\(stage)")
                      return
                  }
                  let view = window.contentView
                  output("stage=\(stage) windowNumber=\(window.windowNumber) frame=\(window.frame) contentFrame=\(String(describing: view?.frame)) fitting=\(String(describing: view?.fittingSize)) safeArea=\(String(describing: view?.safeAreaInsets)) contentMin=\(window.contentMinSize) contentMax=\(window.contentMaxSize) contentLayout=\(window.contentLayoutRect) canBecomeKey=\(window.canBecomeKey) isKey=\(window.isKeyWindow)")
                  if let anchor, stage.hasPrefix("compact-after-switch") {
                      let ok = abs(window.frame.maxX - anchor.x) <= 1 && abs(window.frame.minY - anchor.y) <= 1
                      output("anchor stage=\(stage) matches=\(ok)")
                  }
              }

              static func postDrag(_ window: NSWindow) {
                  guard let screen = window.screen else { output("drag-unverified no-screen"); return }
                  let start = CGPoint(x: window.frame.minX + window.frame.width / 2,
                                      y: screen.frame.maxY - window.frame.maxY + 28)
                  let end = CGPoint(x: start.x + 60, y: start.y + 30)
                  beforeDrag = window.frame.origin
                  let events: [(CGEventType, CGPoint)] = [(.leftMouseDown, start), (.leftMouseDragged, end), (.leftMouseUp, end)]
                  let warp = CGWarpMouseCursorPosition(start)
                  for (kind, point) in events {
                      guard let event = CGEvent(mouseEventSource: nil, mouseType: kind, mouseCursorPosition: point, mouseButton: .left) else {
                          output("drag-unverified event-creation")
                          return
                      }
                      event.post(tap: .cghidEventTap)
                      usleep(150_000)
                  }
                  output("drag-sent warp=\(warp.rawValue) start=\(start) end=\(end)")
              }

              static func postRefreshKey() {
                  let down = CGEvent(keyboardEventSource: nil, virtualKey: 15, keyDown: true)
                  let up = CGEvent(keyboardEventSource: nil, virtualKey: 15, keyDown: false)
                  guard let down, let up else { output("keyboard-unverified event-creation"); return }
                  down.flags = .maskCommand
                  up.flags = .maskCommand
                  down.post(tap: .cghidEventTap)
                  up.post(tap: .cghidEventTap)
                  output("keyboard-sent command-r")
              }

              static func makeStore() -> TaskStore {
                  let store = TaskStore.loopPreview(unavailableSources: [.codex, .claude])
                  DispatchQueue.main.asyncAfter(deadline: .now() + 4) {
                      snapshot("expanded-before-host")
                      if let window = appWindow() {
                          if let root = window.contentView { describeViews(root, depth: 0) }
                          trackedWindow = window
                          hostConfigured = false
                          output("typed-host-accessible=\(hostConfigured)")
                      }
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 7) {
                      snapshot("expanded")
                      store.isCompact = true
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 10) {
                      snapshot("compact-first")
                      if let window = appWindow() {
                          window.setFrameOrigin(NSPoint(x: 120, y: 200))
                          anchor = NSPoint(x: window.frame.maxX, y: window.frame.minY)
                          output("moved anchor=\(String(describing: anchor))")
                      }
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 12) { store.compactIndex = 1 }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 15) {
                      snapshot("compact-after-switch-1")
                      store.compactIndex = 0
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 18) {
                      snapshot("compact-after-switch-0")
                      if let window = trackedWindow {
                          NSApplication.shared.activate(ignoringOtherApps: true)
                          window.makeKeyAndOrderFront(nil)
                          output("focus-request canBecomeKey=\(window.canBecomeKey) isKey=\(window.isKeyWindow)")
                          postDrag(window)
                      } else { output("drag-unverified no-window") }
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 21) {
                      if let window = trackedWindow, let beforeDrag {
                          let moved = abs(window.frame.origin.x - beforeDrag.x) > 1 || abs(window.frame.origin.y - beforeDrag.y) > 1
                          output("drag-observed moved=\(moved) before=\(beforeDrag) after=\(window.frame.origin)")
                          output("focus-before-key isKey=\(window.isKeyWindow) appActive=\(NSApplication.shared.isActive)")
                          postRefreshKey()
                      }
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 24) {
                      if let window = trackedWindow {
                          output("minimize-before key=\(window.isKeyWindow)")
                          NSApplication.shared.keyWindow?.miniaturize(nil)
                      }
                  }
                  DispatchQueue.main.asyncAfter(deadline: .now() + 27) {
                      if let window = trackedWindow {
                          output("minimize-observed miniaturized=\(window.isMiniaturized)")
                          if window.isMiniaturized { window.deminiaturize(nil) }
                      }
                      NSApplication.shared.terminate(nil)
                  }
                  return store
              }
          }
          SWIFT
          /usr/bin/python3 -I -S -B - "$root/source/macos/Sources/AITaskMonitor/AITaskMonitorApp.swift" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = 'TaskStore(enableUpdateChecks: true, enableClaudeRetention: true, enableExternalProviders: true, enableExternalV2: true, enableCodexCloud: true)'
          if text.count(old) != 1:
              raise SystemExit('unexpected product App initializer')
          text = text.replace(old, 'FrameAppProbe.makeStore()')
          old_command = '{ store.refresh() }.keyboardShortcut("r")'
          if text.count(old_command) != 1:
              raise SystemExit('unexpected refresh command')
          text = text.replace(old_command, '{ FrameAppProbe.output("keyboard-refresh"); store.refresh() }.keyboardShortcut("r")')
          path.write_text(text)
          PY
          /usr/bin/python3 -V
          for mode in borderless-resizable; do
            /usr/bin/python3 -I -S -B "$root/instrument.py" "$root" "$mode"
            set +e
            /usr/bin/python3 -I -S -B - "$root/run-test" /usr/bin/xcrun swift build --disable-sandbox --scratch-path "$root/build" \
              --cache-path "$root/cache" --config-path "$root/config" --security-path "$root/security" \
              > "$root/evidence/$mode.log" 2>&1 <<'PY'
          import os
          import signal
          import subprocess
          import sys
          process = subprocess.Popen(sys.argv[1:], start_new_session=True)
          try:
              sys.exit(process.wait(timeout=300))
          except subprocess.TimeoutExpired:
              print("BUILD_TIMEOUT: isolated build exceeded 300 seconds", flush=True)
              os.killpg(process.pid, signal.SIGKILL)
              process.wait()
              sys.exit(124)
          PY
            status=$?
            set -e
            echo "DIAGNOSTIC_MODE_RESULT: $mode exit=$status" | tee -a "$root/evidence/results.txt"
            grep -E 'TEST_DIAG|testCompactWindowSizesToContentAndKeepsItsBottomEdge.*(passed|failed)|testTitledWindowHasNoExtraTitleBarArea.*(passed|failed)|error:|failed:' "$root/evidence/$mode.log" >> "$root/evidence/results.txt" || true
          done
          binary="$root/build/debug/AITaskMonitor"
          if test -x "$binary"; then
            app="$root/WindowGroupProbe.app"
            mkdir -p "$app/Contents/MacOS"
            cp "$binary" "$app/Contents/MacOS/AITaskMonitor"
            cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>CFBundleExecutable</key><string>AITaskMonitor</string><key>CFBundleIdentifier</key><string>local.codex.AITaskMonitor.FrameProbe</string><key>CFBundlePackageType</key><string>APPL</string><key>CFBundleName</key><string>AI Task Monitor Frame Probe</string></dict></plist>
          PLIST
            "$root/run-test" "$app/Contents/MacOS/AITaskMonitor" > "$root/evidence/windowgroup.log" 2>&1 &
            app_pid=$!
            for i in {1..38}; do
              kill -0 "$app_pid" 2>/dev/null || break
              for capture_stage in expanded compact-first; do
                if ! test -f "$root/evidence/borderless-$capture_stage.png"; then
                  number="$(sed -n "s/.*APP_PROBE stage=$capture_stage windowNumber=\\([0-9]*\\).*/\\1/p" "$root/evidence/windowgroup.log" | tail -1)"
                  if test -n "$number"; then
                    "$root/run-test" /usr/sbin/screencapture -x -l "$number" "$root/evidence/borderless-$capture_stage.png" || true
                  fi
                fi
              done
              sleep 1
            done
            if kill -0 "$app_pid" 2>/dev/null; then
              echo "WINDOWGROUP_PROBE_TIMEOUT" | tee -a "$root/evidence/results.txt"
              kill -TERM "$app_pid" 2>/dev/null || true
            fi
            set +e
            wait "$app_pid"
            status=$?
            set -e
            echo "WINDOWGROUP_PROBE_EXIT=$status" | tee -a "$root/evidence/results.txt"
            grep -E 'APP_PROBE|ROOT_DIAG|error:|Fatal error' "$root/evidence/windowgroup.log" >> "$root/evidence/results.txt" || true
          else
            echo "WINDOWGROUP_PROBE_NOT_BUILT" | tee -a "$root/evidence/results.txt"
          fi
          cat "$root/evidence/results.txt"
          echo "DIAGNOSTICS_COMPLETE: compare individual test results; successful job does not imply tests passed"
      - name: Save isolated test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-frame-independent-5863d11
          path: ${{ runner.temp }}/aitm-frame-independent/evidence/
          if-no-files-found: warn
          retention-days: 7
