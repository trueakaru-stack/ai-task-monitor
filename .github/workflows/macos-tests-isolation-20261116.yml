name: Validate macOS tests without profile access
on:
  push:
    branches: ['codex/macos-tests-isolation-20261116']
    paths: ['.github/workflows/macos-tests-isolation-20261116.yml', 'macos/**']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.1.app/Contents/Developer
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Prepare and verify disposable sandbox
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS
          task_profile_dir="$(/usr/bin/python3 -I -S -B -c 'import os,pwd; print(os.path.realpath(pwd.getpwuid(os.getuid()).pw_dir))')"
          case "$task_profile_dir" in /Users/*) ;; *) echo 'Unexpected hosted runner profile.' >&2; exit 1;; esac
          task_root="$(mktemp -d /private/tmp/aitm-macos-tests.XXXXXXXX)"
          task_marker="$(mktemp "$RUNNER_TEMP/aitm-profile-deny.XXXXXXXX")"
          case "$task_marker" in "$task_profile_dir"/*) ;; *) echo 'Runner temp is outside expected profile.' >&2; exit 1;; esac
          printf 'synthetic-only\n' > "$task_marker"
          task_node="$(command -v node)"
          task_node_real="$(/usr/bin/python3 -I -S -B -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$task_node")"
          task_node_root="$(dirname "$(dirname "$task_node_real")")"
          task_node_bin="$(dirname "$task_node")"
          task_python=''
          for name in python3 python3.14 python3.13 python3.12 python3.11; do
            candidate="$(command -v "$name" || true)"
            if [[ "$candidate" == /* && -x "$candidate" ]] && "$candidate" -I -S -B -c 'import sys; assert (3, 11) <= sys.version_info[:2] < (3, 15)' 2>/dev/null; then task_python="$candidate"; break; fi
          done
          test -n "$task_python"
          task_python_root="$("$task_python" -I -S -B -c 'import os,sys; print(os.path.realpath(sys.base_prefix))')"
          case "$task_node_root" in /|/Users|"$task_profile_dir") echo 'Unsafe Node root.' >&2; exit 1;; esac
          case "$task_python_root" in /|/Users|"$task_profile_dir") echo 'Unsafe Python root.' >&2; exit 1;; esac
          task_path="$task_node_bin:$(dirname "$task_python"):/usr/bin:/bin:/usr/sbin:/sbin"
          mkdir -p "$task_root/source" "$task_root/template" "$task_root/hooks" "$task_root/temp" "$task_root/npm-cache" "$task_root/swift-cache" "$task_root/swift-config" "$task_root/swift-security"
          : > "$task_root/npmrc"
          git -c credential.helper= -c core.hooksPath="$task_root/hooks" -c init.templateDir="$task_root/template" init --quiet "$task_root/source"
          git -C "$task_root/source" -c credential.helper= -c core.hooksPath="$task_root/hooks" fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -C "$task_root/source" -c core.hooksPath="$task_root/hooks" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$task_root/source" rev-parse HEAD)" = "$GITHUB_SHA"
          cat > "$task_root/profile.sb" <<'PROFILE'
          (version 1)
          (allow default)
          (deny file-read* (subpath (param "TASK_PROFILE")))
          (allow file-read* (subpath (param "TASK_NODE_ROOT")))
          (allow file-read* (subpath (param "TASK_PYTHON_ROOT")))
          (deny file-write*)
          (allow file-write* (subpath (param "TASK_ROOT")))
          (allow file-write-data (literal "/dev/null") (literal "/dev/tty"))
          PROFILE
          cat > "$task_root/run-isolated" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          exec /usr/bin/env -i "PATH=$AITM_TASK_PATH" "TMPDIR=$AITM_TEST_TASK_ROOT/temp" "DEVELOPER_DIR=$DEVELOPER_DIR" \
            CI=true GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted RUNNER_OS=macOS AITM_MACOS_TEST_SANDBOX=1 \
            "AITM_CI_DENIED_FILE=$AITM_TEST_DENIED_FILE" "NPM_CONFIG_CACHE=$AITM_TEST_TASK_ROOT/npm-cache" \
            "NPM_CONFIG_USERCONFIG=$AITM_TEST_TASK_ROOT/npmrc" NPM_CONFIG_GLOBALCONFIG=/dev/null NPM_CONFIG_UPDATE_NOTIFIER=false \
            /usr/bin/sandbox-exec -D "TASK_PROFILE=$AITM_TEST_PROFILE" -D "TASK_ROOT=$AITM_TEST_TASK_ROOT" \
              -D "TASK_NODE_ROOT=$AITM_TEST_NODE_ROOT" -D "TASK_PYTHON_ROOT=$AITM_TEST_PYTHON_ROOT" \
              -f "$AITM_TEST_TASK_ROOT/profile.sb" "$@"
          SCRIPT
          chmod 700 "$task_root/run-isolated"
          { printf 'AITM_TEST_TASK_ROOT=%s\n' "$task_root"; printf 'AITM_TEST_DENIED_FILE=%s\n' "$task_marker"; printf 'AITM_TEST_PROFILE=%s\n' "$task_profile_dir"; printf 'AITM_TEST_NODE_ROOT=%s\n' "$task_node_root"; printf 'AITM_TEST_PYTHON_ROOT=%s\n' "$task_python_root"; printf 'AITM_TASK_PATH=%s\n' "$task_path"; printf 'AITM_TEST_NODE_BIN=%s\n' "$task_node"; printf 'AITM_TEST_PYTHON_BIN=%s\n' "$task_python"; } >> "$GITHUB_ENV"
      - name: Verify sandbox blocks runner profile
        shell: bash
        run: |
          set -euo pipefail
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          "$task_run" /usr/bin/true
          if "$task_run" /bin/cat "$AITM_TEST_DENIED_FILE" >"$AITM_TEST_TASK_ROOT/out" 2>"$AITM_TEST_TASK_ROOT/err"; then echo 'Profile read was not denied.' >&2; exit 1; fi
          if "$task_run" /usr/bin/touch "$AITM_TEST_DENIED_FILE" >"$AITM_TEST_TASK_ROOT/out" 2>"$AITM_TEST_TASK_ROOT/err"; then echo 'Profile write was not denied.' >&2; exit 1; fi
          "$task_run" "$AITM_TEST_PYTHON_BIN" -I -S -B -c 'import os; assert "HOME" not in os.environ and "CODEX_HOME" not in os.environ'
      - name: Prepare pinned synthetic upstream packages
        shell: bash
        run: |
          set -euo pipefail
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          cd "$AITM_TEST_TASK_ROOT/source/macos"
          "$task_run" npm install --prefix "$AITM_TEST_TASK_ROOT/dsh" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.5 pnpm@11.25.0
          "$task_run" /usr/bin/curl -q --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 3 'https://codeload.github.com/NousResearch/hermes-agent/tar.gz/b200f5bc60e31588ba2cb60e288029c4a54ba5fa' --output "$AITM_TEST_TASK_ROOT/hermes.tar.gz"
          "$task_run" "$AITM_TEST_PYTHON_BIN" -I -S -B integration-tests/Extract-HermesFixture.py "$AITM_TEST_TASK_ROOT/hermes.tar.gz" "$AITM_TEST_TASK_ROOT/hermes-source"
          "$task_run" "$AITM_TEST_PYTHON_BIN" -m venv "$AITM_TEST_TASK_ROOT/hermes-python"
          "$task_run" "$AITM_TEST_TASK_ROOT/hermes-python/bin/python" -m pip install --no-cache-dir --disable-pip-version-check --only-binary=:all: 'ruamel.yaml==0.18.16' 'packaging==26.0' 'python-dotenv==1.2.4'
          "$task_run" npm pack @moonshot-ai/kimi-code@2.5.0 --ignore-scripts --pack-destination "$AITM_TEST_TASK_ROOT" --json > "$AITM_TEST_TASK_ROOT/kimi-package.json"
          "$task_run" npm install --prefix "$AITM_TEST_TASK_ROOT/kimi" --ignore-scripts --omit=optional --no-audit --no-fund "$AITM_TEST_TASK_ROOT/moonshot-ai-kimi-code-2.5.0.tgz"
      - name: Exercise Swift and DeepSeek synthetic integration
        shell: bash
        run: |
          set -euo pipefail
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          cd "$AITM_TEST_TASK_ROOT/source/macos"
          task_flags=(--cache-path "$AITM_TEST_TASK_ROOT/swift-cache" --config-path "$AITM_TEST_TASK_ROOT/swift-config" --security-path "$AITM_TEST_TASK_ROOT/swift-security" --disable-sandbox)
          "$task_run" swift build "${task_flags[@]}"
          task_bin="$("$task_run" swift build --show-bin-path "${task_flags[@]}")"
          "$task_run" /usr/bin/env "AITM_DSH_ANCHOR=$AITM_TEST_TASK_ROOT/dsh/node_modules/@deepseek-ai/dsh/package.json" "AITM_PNPM_SCRIPT=$AITM_TEST_TASK_ROOT/dsh/node_modules/pnpm/bin/pnpm.mjs" "AITM_NODE=$AITM_TEST_NODE_BIN" "AITM_CLAUDE_TEST_EXECUTABLE=$task_bin/AITaskMonitor" /bin/bash scripts/run-swift-tests.sh "${task_flags[@]}" --filter DeepSeekIntegrationTests/testIsolatedUpstreamConnectionBridge | tee "$AITM_TEST_TASK_ROOT/swift-deepseek.log"
          grep -q 'testIsolatedUpstreamConnectionBridge.*passed' "$AITM_TEST_TASK_ROOT/swift-deepseek.log"
          "$task_run" node integration-tests/Test-DeepSeekIntegration.mjs "$AITM_TEST_TASK_ROOT/dsh/node_modules/@deepseek-ai/dsh/package.json" "$AITM_TEST_TASK_ROOT/dsh/node_modules/pnpm/bin/pnpm.mjs"
      - name: Exercise Hermes and Kimi synthetic integrations
        shell: bash
        run: |
          set -euo pipefail
          task_run="$AITM_TEST_TASK_ROOT/run-isolated"
          cd "$AITM_TEST_TASK_ROOT/source/macos"
          "$task_run" "$AITM_TEST_TASK_ROOT/hermes-python/bin/python" -I -S -B integration-tests/Test-HermesSetup.py integrations "$AITM_TEST_TASK_ROOT/hermes-source"
          "$task_run" "$AITM_TEST_TASK_ROOT/hermes-python/bin/python" -I -B integration-tests/Test-HermesManager.py integrations "$AITM_TEST_TASK_ROOT/hermes-source"
          "$task_run" "$AITM_TEST_PYTHON_BIN" -B integration-tests/Test-HermesLiveness.py "$AITM_TEST_TASK_ROOT/hermes-source/hermes_cli/active_sessions.py"
          "$task_run" "$AITM_TEST_TASK_ROOT/hermes-python/bin/python" -B integration-tests/Test-HermesPublication.py "$AITM_TEST_TASK_ROOT/hermes-source"
          "$task_run" node integration-tests/Test-KimiApprovalWeb.mjs "$AITM_TEST_TASK_ROOT/kimi"
