name: macOS updater synthetic candidate audit

on:
  push:
    branches: [macos]
    paths:
      - ".github/workflows/macos-updater-candidate-ci.yml"
      - ".github/updater-audit/**"

permissions:
  contents: read

jobs:
  updater-synthetic:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tests-only]') && contains(github.event.head_commit.message, '[updater-background-stop-audit]') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Verify disposable runner
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = macOS

      - name: Checkout only the test-route commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: updater-ci-input
          persist-credentials: false
          clean: true

      - name: Verify candidate inputs
        shell: bash
        working-directory: updater-ci-input
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/aitm-update-input"
          for name in frozen-wip.patch.b64 hardening.patch.b64 redirect-test-fix.patch.b64 background-parser.patch.b64 clock-test-fix.patch.b64 stop-test-fix.patch.b64 candidate.sha256 ReleaseRedirectDiagnosticTests.swift; do
            git show "$GITHUB_SHA:.github/updater-audit/$name" > "$RUNNER_TEMP/aitm-update-input/$name"
          done
          cd "$RUNNER_TEMP/aitm-update-input"
          printf '%s  %s\n' \
            'b97325dac7df58f96441ab74f748d572ef3e4bd01e7adc77d229d5fb1ab89bd1' 'frozen-wip.patch.b64' \
            'bf9cb606149e6a4ca6eadff54d6cecf1938a040147f7e6240e9b87b4499f574a' 'hardening.patch.b64' \
            '7a53f005ef73dd8fa4501937c2a84995cc74e2fc13fe24417aff4da24a507c6f' 'redirect-test-fix.patch.b64' \
            '3b669e663b6ea33512c05ef7c60472e5b21ba34da5717e0e16d1599157ca57f9' 'background-parser.patch.b64' \
            '9df9d4d022dd412b1a2864fb9262bcf51959e980b2d56b1d09fe8a1d8a6d7ff1' 'clock-test-fix.patch.b64' \
            '91842c50bdc6e75e43562b5b51795dafdab75f4e473b5b61bcc661bf12a48c36' 'stop-test-fix.patch.b64' \
            '91ddc5ea89fd8b8279717966fc0e548812df3303963448130b13f3d37f9e33b2' 'candidate.sha256' \
            '5f1d4c865e72bc9e490ca17770a614e5fa1fc38da8e7c5589ce27fc546d600a5' 'ReleaseRedirectDiagnosticTests.swift' \
            | shasum -a 256 -c -
          /usr/bin/base64 -D < frozen-wip.patch.b64 > "$RUNNER_TEMP/aitm-frozen-wip.patch"
          /usr/bin/base64 -D < hardening.patch.b64 > "$RUNNER_TEMP/aitm-hardening.patch"
          /usr/bin/base64 -D < redirect-test-fix.patch.b64 > "$RUNNER_TEMP/aitm-redirect-test-fix.patch"
          /usr/bin/base64 -D < background-parser.patch.b64 > "$RUNNER_TEMP/aitm-background-parser.patch"
          /usr/bin/base64 -D < clock-test-fix.patch.b64 > "$RUNNER_TEMP/aitm-clock-test-fix.patch"
          /usr/bin/base64 -D < stop-test-fix.patch.b64 > "$RUNNER_TEMP/aitm-stop-test-fix.patch"
          printf '%s  %s\n' \
            '436a7815494753d4510b6e986bd762a49271acb2b1fe24bc0a5bb2fa7706134c' "$RUNNER_TEMP/aitm-frozen-wip.patch" \
            'da35492ce9177bc54474de61b6d46132819fcfbc402ffe07683dbc44974cc124' "$RUNNER_TEMP/aitm-hardening.patch" \
            '615f18743bad50c0f59913c3a0d401f135db8cbcc9aa08021c8570d3fd8cf0ec' "$RUNNER_TEMP/aitm-redirect-test-fix.patch" \
            'fed63fd1fe9fc7a7b5bbe7c7a3e26ca1bc85c188afac6e0ba4622b0953d14d7d' "$RUNNER_TEMP/aitm-background-parser.patch" \
            'd71f6507ed83e7c9fd5cc9b412db62476ed172f0744b0e0ea754d5321c15a851' "$RUNNER_TEMP/aitm-clock-test-fix.patch" \
            'd51116c8396f04670ae4aeee328a7efa99adf937d1c02c0f840c2a4c007cca7b' "$RUNNER_TEMP/aitm-stop-test-fix.patch" \
            | shasum -a 256 -c -

      - name: Checkout fixed baseline
        uses: actions/checkout@v4
        with:
          ref: d09119082860ab0dd0129f0db8506504b6f37e0a
          path: updater-baseline
          persist-credentials: false
          clean: true

      - name: Reconstruct and verify the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=d09119082860ab0dd0129f0db8506504b6f37e0a
          INPUT="$RUNNER_TEMP/aitm-update-input"
          TREE="$RUNNER_TEMP/aitm-update-candidate"
          test "$(git -C "$GITHUB_WORKSPACE/updater-baseline" rev-parse HEAD)" = "$BASE"
          test -z "$(git -C "$GITHUB_WORKSPACE/updater-baseline" status --porcelain)"
          mkdir -p "$TREE"
          git -C "$GITHUB_WORKSPACE/updater-baseline" -c core.autocrlf=false archive "$BASE" macos | tar -xf - -C "$TREE"
          git -C "$TREE" init --quiet
          git -C "$TREE" config core.autocrlf false
          {
            git -C "$TREE" apply --numstat --include='macos/**' "$RUNNER_TEMP/aitm-frozen-wip.patch"
            git -C "$TREE" apply --numstat --include='macos/**' "$RUNNER_TEMP/aitm-hardening.patch"
          } | cut -f3 | LC_ALL=C sort -u > "$RUNNER_TEMP/aitm-update-patch-paths"
          cut -c 67- "$INPUT/candidate.sha256" | LC_ALL=C sort -u > "$RUNNER_TEMP/aitm-update-allowed-paths"
          diff -u "$RUNNER_TEMP/aitm-update-allowed-paths" "$RUNNER_TEMP/aitm-update-patch-paths"
          git -C "$TREE" apply --check --include='macos/**' "$RUNNER_TEMP/aitm-frozen-wip.patch"
          git -C "$TREE" apply --include='macos/**' "$RUNNER_TEMP/aitm-frozen-wip.patch"
          git -C "$TREE" apply --check --include='macos/**' "$RUNNER_TEMP/aitm-hardening.patch"
          git -C "$TREE" apply --include='macos/**' "$RUNNER_TEMP/aitm-hardening.patch"
          cd "$TREE"
          shasum -a 256 -c "$INPUT/candidate.sha256"
          test "$(git apply --numstat "$RUNNER_TEMP/aitm-redirect-test-fix.patch" | cut -f3)" = 'macos/Tests/AITaskMonitorTests/ReleaseRequestSyntheticTests.swift'
          git apply --check "$RUNNER_TEMP/aitm-redirect-test-fix.patch"
          git apply "$RUNNER_TEMP/aitm-redirect-test-fix.patch"
          printf '%s  %s\n' 'de75ff9bf942f8923d46f57b3d0aa5387b89c3e379361cea35f34c9340a75af9' \
            macos/Tests/AITaskMonitorTests/ReleaseRequestSyntheticTests.swift | shasum -a 256 -c -
          awk '$2 ~ /^macos\/Sources\// { print }' "$INPUT/candidate.sha256" | shasum -a 256 -c -
          git apply --numstat "$RUNNER_TEMP/aitm-background-parser.patch" | cut -f3 | LC_ALL=C sort > "$RUNNER_TEMP/aitm-background-paths"
          printf '%s\n' \
            'macos/Sources/AITaskMonitor/ReleaseUpdateCoordinator.swift' \
            'macos/Sources/AITaskMonitor/ReleaseUpdates.swift' \
            'macos/Sources/AITaskMonitor/TaskStore.swift' \
            'macos/Tests/AITaskMonitorTests/ReleaseUpdateCoordinatorTests.swift' | LC_ALL=C sort > "$RUNNER_TEMP/aitm-background-allowed-paths"
          diff -u "$RUNNER_TEMP/aitm-background-allowed-paths" "$RUNNER_TEMP/aitm-background-paths"
          git apply --check "$RUNNER_TEMP/aitm-background-parser.patch"
          git apply "$RUNNER_TEMP/aitm-background-parser.patch"
          printf '%s  %s\n' \
            'ff34a7e2bc38e85c122806d866ca683869c6bbc73788310c1b127be9969c5af8' macos/Sources/AITaskMonitor/ReleaseUpdateCoordinator.swift \
            '1d7698d0f8ad5eefa9df66b3b022dd90aa3ad5de9a4d28be7f8e0495d6875f04' macos/Sources/AITaskMonitor/ReleaseUpdates.swift \
            'aeaa65e539f77fd599fc65ef1d29eccf5cb77cf80fe1cef44202620c934127be' macos/Sources/AITaskMonitor/TaskStore.swift \
            '20cf82abd4d900bedcaa8942ecf73c94f614c3b91a683eb206cd7f03004f6339' macos/Tests/AITaskMonitorTests/ReleaseUpdateCoordinatorTests.swift \
            | shasum -a 256 -c -
          test "$(git apply --numstat "$RUNNER_TEMP/aitm-clock-test-fix.patch" | cut -f3)" = 'macos/Tests/AITaskMonitorTests/ReleaseUpdateCoordinatorTests.swift'
          git apply --check "$RUNNER_TEMP/aitm-clock-test-fix.patch"
          git apply "$RUNNER_TEMP/aitm-clock-test-fix.patch"
          printf '%s  %s\n' '35ea8e46b7e905458c6cccaed36c5a7bf0a7bcc22beee2d6af6260cc2e5251b7' \
            macos/Tests/AITaskMonitorTests/ReleaseUpdateCoordinatorTests.swift | shasum -a 256 -c -
          test "$(git apply --numstat "$RUNNER_TEMP/aitm-stop-test-fix.patch" | cut -f3)" = 'macos/Tests/AITaskMonitorTests/ReleaseUpdateCoordinatorTests.swift'
          git apply --check "$RUNNER_TEMP/aitm-stop-test-fix.patch"
          git apply "$RUNNER_TEMP/aitm-stop-test-fix.patch"
          printf '%s  %s\n' '16b36f9d19df4c6b8a246a532b5ded339e938b980981a6a678680b003280a887' \
            macos/Tests/AITaskMonitorTests/ReleaseUpdateCoordinatorTests.swift | shasum -a 256 -c -
          cp "$INPUT/ReleaseRedirectDiagnosticTests.swift" macos/Tests/AITaskMonitorTests/ReleaseRedirectDiagnosticTests.swift
          printf '%s  %s\n' '5f1d4c865e72bc9e490ca17770a614e5fa1fc38da8e7c5589ce27fc546d600a5' \
            macos/Tests/AITaskMonitorTests/ReleaseRedirectDiagnosticTests.swift | shasum -a 256 -c -

      - name: Run isolated synthetic Swift tests and two-process fixture
        shell: bash
        run: |
          set -euo pipefail
          TREE="$RUNNER_TEMP/aitm-update-candidate"
          mkdir -p "$RUNNER_TEMP/aitm-update-tmp" "$RUNNER_TEMP/aitm-update-support"
          DEVELOPER="$(xcode-select -p)"
          PROFILE='(version 1) (allow default) (deny network*)'
          run_isolated() {
            /usr/bin/env -i "PATH=/usr/bin:/bin" "DEVELOPER_DIR=$DEVELOPER" \
              "TMPDIR=$RUNNER_TEMP/aitm-update-tmp/" \
              "AI_TASK_MONITOR_SUPPORT_DIR=$RUNNER_TEMP/aitm-update-support" \
              /usr/bin/sandbox-exec -p "$PROFILE" "$@"
          }
          cat > "$RUNNER_TEMP/aitm-network-deny.py" <<'PY'
          import errno
          import socket
          import sys

          try:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          except OSError as error:
              if error.errno not in (errno.EPERM, errno.EACCES):
                  raise
              print("Synthetic network-deny probe passed: socket creation denied")
              sys.exit(0)
          try:
              result = sock.connect_ex(("127.0.0.1", 0))
          finally:
              sock.close()
          if result not in (errno.EPERM, errno.EACCES):
              sys.exit("Synthetic network-deny probe failed: loopback was not denied")
          print("Synthetic network-deny probe passed: loopback connection denied")
          PY
          run_isolated /usr/bin/python3 -I -S -B "$RUNNER_TEMP/aitm-network-deny.py"
          run_isolated /usr/bin/which codesign
          cd "$TREE/macos"
          run_isolated /usr/bin/xcrun swift --version
          audit_status=0
          for suite in ReleaseUpdatesTests ReleaseRetryScheduleTests ReleaseUpdateCoordinatorTests ReleaseRequestSyntheticTests ReleaseRedirectDiagnosticTests; do
            printf '%s\n' "Running synthetic suite: $suite"
            if ! run_isolated /usr/bin/xcrun swift test --disable-sandbox --filter "$suite"; then
              audit_status=1
            fi
          done
          printf '%s\n' 'Running synthetic two-process lease fixture'
          if run_isolated /usr/bin/xcrun swiftc Sources/AITaskMonitor/ReleaseScheduleFileStore.swift \
            integration-tests/release-lease-fixture/main.swift -o "$RUNNER_TEMP/aitm-release-lease-fixture"; then
            if ! run_isolated "$RUNNER_TEMP/aitm-release-lease-fixture"; then audit_status=1; fi
          else
            audit_status=1
          fi
          exit "$audit_status"

      - name: Record scope
        if: ${{ always() }}
        shell: bash
        run: |
          printf '%s\n' 'Synthetic updater checks only. No live updater endpoint, user profile, installer, publication, or full-suite claim.' >> "$GITHUB_STEP_SUMMARY"
